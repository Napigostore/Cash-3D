name: iOS

# Builds Cash to Freedom on a GitHub-hosted Mac.
#  - Every push that touches ios/, web/, tools/ or this file: compiles for the simulator (no Apple account needed).
#  - Run by hand with the boxes ticked, or push a commit whose message contains the tag:
#      [testflight]  sign and upload a build to App Store Connect / TestFlight
#      [listing]     take screenshots on the 6.9" iPhone simulator and upload texts + screenshots (ios/fastlane)
#      [submit]      attach the newest processed build and submit the version for App Review
#
# Secrets (repository Settings â†’ Secrets and variables â†’ Actions):
#   APPLE_TEAM_ID     10-character Team ID of the Apple Developer account
#   ASC_KEY_ID        App Store Connect API key id
#   ASC_ISSUER_ID     App Store Connect API issuer id
#   ASC_KEY_P8        contents of the AuthKey_XXXX.p8 file
on:
  push:
    paths:
      - "ios/**"
      - "web/**"
      - "tools/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false
      listing:
        description: Take screenshots and upload the App Store listing
        type: boolean
        default: false
      submit:
        description: Submit the prepared version for App Review
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: CashToFreedom
  BUNDLE_ID: com.cashtofreedom.app

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner: $(ls /Applications | grep Xcode | xargs)"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Build the web game (vi + en)
        run: python3 tools/build_web.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project $APP.xcodeproj -scheme $APP -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt || true
          if [ -s errors.txt ]; then
            cat errors.txt
            echo "::error title=Swift errors::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' errors.txt)"
          fi
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-log
          path: ios/build.log

  testflight:
    if: ${{ inputs.testflight || contains(github.event.head_commit.message, '[testflight]') }}
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X"
      # Fails fast, with a readable reason, when the API key secrets are wrong or the app record is missing.
      - name: Check App Store Connect access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_check.py
      - name: Build the web game (vi + en)
        run: python3 tools/build_web.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive, sign and upload
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          report() {
            grep -iE "error|failed|invalid|denied|no profiles|no account|missing" "$1" | grep -viE "^\s*$|warning:" | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -40 > problems.txt || true
            [ -s problems.txt ] && echo "::error title=TestFlight::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' problems.txt)"
            exit 1
          }
          missing=""
          for name in TEAM KEY_ID ISSUER KEY_P8; do [ -z "${!name}" ] && missing="$missing $name"; done
          if [ -n "$missing" ]; then echo "::error title=TestFlight::Missing secrets:$missing (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; fi

          # Stray spaces or newlines from pasting the secrets make Apple reject the key.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]'); ISSUER=$(printf '%s' "$ISSUER" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # The run number gives every upload a higher build number. The archive is unsigned (a development
          # profile would need a registered iPhone); the export signs it for App Store distribution.
          xcodebuild -project $APP.xcodeproj -scheme $APP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > archive.log 2>&1 || report archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log || report archive.log

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > export.log 2>&1 || report export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log || report export.log
          echo "::notice title=TestFlight::Build ${{ github.run_number }} uploaded. Apple needs 10-30 minutes to process it before it appears in TestFlight."
      - name: Keep the signing logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log

  listing:
    # Screenshots of the game in Vietnamese and English on a 6.9" iPhone simulator, then texts + screenshots to App Store Connect.
    if: ${{ inputs.listing || contains(github.event.head_commit.message, '[listing]') }}
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=Xcode::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X"
      - name: Build the web game (vi + en)
        run: python3 tools/build_web.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Take the screenshots
        working-directory: ios
        run: |
          # A 6.9" iPhone gives the 1320x2868 screenshots App Store Connect asks for.
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $(xcrun simctl list devices available | grep "$DEVICE")"
          xcrun simctl boot "$DEVICE"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcodebuild -project $APP.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEVICE" -derivedDataPath sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { tail -40 sim.log; exit 1; }
          xcrun simctl install "$DEVICE" sim/Build/Products/Debug-iphonesimulator/$APP.app
          for lang in vi en-US; do
            dir="fastlane/screenshots/$lang"; mkdir -p "$dir"; rm -f "$dir"/*.png
            short=${lang%%-*}
            n=1
            for screen in board deal ledger statement home; do
              xcrun simctl terminate "$DEVICE" $BUNDLE_ID 2>/dev/null || true
              # The app keeps the language chosen in game; reset it so -AppleLanguages decides.
              xcrun simctl spawn "$DEVICE" defaults delete $BUNDLE_ID language 2>/dev/null || true
              xcrun simctl launch "$DEVICE" $BUNDLE_ID -AppleLanguages "($short)" -demo "$screen"
              sleep 16
              xcrun simctl io "$DEVICE" screenshot "$dir/0$n-$screen.png"
              n=$((n+1))
            done
          done
          ls -la fastlane/screenshots/*
      - name: Keep the screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ios/fastlane/screenshots
      - name: Upload the listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_listing.py "$(grep -E 'MARKETING_VERSION' ios/project.yml | grep -oE '[0-9][0-9.]*')"
          echo "::notice title=Listing::App Store texts and screenshots uploaded for vi and en-US."

  submit:
    if: ${{ inputs.submit || contains(github.event.head_commit.message, '[submit]') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Submit for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 tools/asc_submit.py "$(grep -E 'MARKETING_VERSION' ios/project.yml | grep -oE '[0-9][0-9.]*')"
