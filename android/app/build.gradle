plugins { id 'com.android.application' }
android {
    namespace 'vn.dongtien.game'
    compileSdk 35
    defaultConfig {
        // Google Play package name, the same as the iOS bundle id. It can never change once published.
        applicationId 'com.cashtofreedom.app'
        minSdk 24
        targetSdk 35
        // CI passes the GitHub run number so every Play upload gets a higher version code.
        versionCode((System.getenv('VERSION_CODE') ?: '26') as int)
        versionName "1.0.0"
    }
    signingConfigs {
        // Upload key for Google Play, from CI secrets (see .github/workflows/android.yml).
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.android.billingclient:billing:8.0.0'
}
