<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>html,body{margin:0;background:#0b1220;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style></head>
<script>if(location.hash.indexOf('#demo-')===0){try{localStorage.clear()}catch(e){}}</script>
<title>Cash to Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D board, player bar on top, ledger HUD sheet at the bottom; cards slide up as sheets. Single dark "night bank" look with gold. */
:root{
  --ink:#0b1424; --panel:#13213a; --panel2:#1a2b49; --line:#2a3d62;
  --text:#eef2f8; --muted:#93a3c0; --gold:#e9b949; --money:#4fd18b; --danger:#ff6b6b;
  --opp:#2fae6e; --market:#3a86d4; --doodad:#e0566b; --payday:#e9b949; --charity:#9b6bdb; --baby:#f08fb8; --down:#7d8aa3; --ft:#d2a03a;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--money)} .neg{color:var(--danger)} .warn{color:var(--gold)}

#moment{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(circle,rgba(11,18,32,.55),rgba(5,9,18,.92));animation:mIn .35s ease-out}
#moment .mcard{width:min(86vw,380px);text-align:center;animation:mPop .6s cubic-bezier(.2,1.4,.4,1)}#moment .mart{border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 3px var(--gold)}
#moment h2{font:800 30px/1.15 'Bricolage Grotesque','Be Vietnam Pro',sans-serif;color:#ffe08a;margin:18px 0 6px;text-shadow:0 4px 18px rgba(233,185,73,.5)}#moment p{color:#dbe4f3;margin:0}
@keyframes mIn{from{opacity:0}to{opacity:1}}@keyframes mPop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
#chick{position:fixed;left:12px;top:34%;z-index:290;display:flex;gap:6px;align-items:flex-end;max-width:min(78vw,330px);pointer-events:none;animation:mPop .45s cubic-bezier(.2,1.4,.4,1)}
#chick .bub{background:#fff8dc;color:#2a1e05;border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
body.swan #app,body.swan canvas{animation:shake .12s linear 10}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}
#ticker.alert{background:#4a0a0a;border-bottom-color:#ff4d4d}
.bio{background:linear-gradient(160deg,#f7f0de,#e9dfc4);color:#2b2316;border-radius:14px;padding:12px 14px;margin:8px 0;font-family:'Be Vietnam Pro',sans-serif}.bio h4{margin:0 0 4px;font:800 15px/1.25 'Bricolage Grotesque','Be Vietnam Pro',sans-serif;color:#5a3d0c;text-transform:uppercase;letter-spacing:.04em}.bio p{color:#2b2316!important;margin:0;font-size:14px;line-height:1.5}
.mis{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}.mis b{min-width:20px}.mis.done{color:var(--money)}
#ticker{position:fixed;left:0;right:0;top:0;z-index:6;height:calc(env(safe-area-inset-top,0px) + 24px);padding-top:env(safe-area-inset-top,0px);overflow:hidden;background:#070d18;border-bottom:1px solid rgba(233,185,73,.35);font-size:12px;line-height:24px;white-space:nowrap}
#ticker[hidden]{display:none!important}#tickerIn{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}#ticker:active #tickerIn{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.tk{margin:0 6px}.tk b{font-weight:800;margin-right:5px;padding:1px 6px;border-radius:6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase}.tk.real b{background:#1d4ed8;color:#fff}.tk.mkt b{background:#0f766e;color:#fff}.tk.fun b{background:#b45309;color:#fff}.tk.rumor b{background:#7f1d1d;color:#ffd5d5}.tk.hot b{background:#e9b949;color:#1a1200}#tickerIn i{color:#e9b949;font-style:normal;margin:0 8px}
body.tk-on #topbar{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
#topbar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;z-index:5;background:linear-gradient(var(--ink),rgba(11,20,36,0))}
#topbar{flex-wrap:wrap}
.rankhead{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0 4px;font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--gold);text-transform:uppercase}
.rankhead span{display:inline-block;transition:transform .2s}
.rankhead.closed span{transform:rotate(-90deg)}
#rank{flex-basis:100%;background:rgba(19,33,58,.88);border:1px solid var(--line);border-radius:12px;padding:4px 8px 6px;max-height:36vh;overflow:auto;backdrop-filter:blur(4px)}
.rk{display:grid;grid-template-columns:14px 30px minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:3px 2px;text-align:left}
.rk+.rk{border-top:1px solid rgba(42,61,98,.6)}
.rk.on{background:rgba(233,185,73,.1)}
.rk.cols{padding:2px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rk.cols span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .n{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.rk.top .n{color:var(--gold)}
.rk img{width:26px;height:26px;border-radius:50%;background:var(--ink);display:block}
.rk .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.rk .nm small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.mb{min-width:0}
.mb i{display:block;height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
.mb i b{display:block;height:100%;border-radius:3px;transition:width .6s}
.mb span{display:block;font-family:var(--f-num);font-size:9.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);max-width:560px;margin:0 auto}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who img{width:30px;height:30px;border-radius:50%;background:var(--ink);flex:none}
.who b{color:var(--text);font-size:16px;font-family:var(--f-display);font-weight:800}
.who .turn{margin-left:auto;font-family:var(--f-num);font-size:11px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.stat label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;font-family:var(--f-num);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{margin-top:10px}
.bar{height:8px;border-radius:99px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--money),var(--gold));border-radius:99px;transition:width .6s}
.progress p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;min-height:46px}
.btn.primary{flex:1;background:var(--gold);color:#1b1404;border-color:transparent;font-family:var(--f-display);font-size:17px}
.btn.green{background:var(--money);color:#06210f;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;border-radius:9px}

#modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;border-top:4px solid var(--tone,var(--gold));padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.band{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;z-index:1}
.band span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tone,var(--gold))}
.band .x{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;margin:2px 0 8px;text-wrap:balance}
.sheet p{line-height:1.55;color:#d3dbea;margin:0 0 10px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ledger td .acts{margin-top:6px;gap:6px}.ledger td .acts .btn{padding:6px 10px;font-size:12px}
.acts .btn{flex:1 1 140px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}
.fact{background:var(--ink);border-radius:10px;padding:8px 10px;border:1px solid var(--line);min-width:0}
.fact label{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fact b{font-family:var(--f-num);font-size:15px}
.fact small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.note{font-size:12px;color:var(--gold);background:rgba(233,185,73,.08);border:1px dashed rgba(233,185,73,.4);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.verdict{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:6px}
.v-good{background:rgba(79,209,139,.15);color:var(--money)} .v-ok{background:rgba(233,185,73,.15);color:var(--gold)} .v-bad{background:rgba(255,107,107,.15);color:var(--danger)}
.calc{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0}
.calc div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.calc div:last-child{border-bottom:0}
.calc span{color:var(--muted)} .calc b{font-family:var(--f-num);white-space:nowrap}
.calc .tot{font-weight:800} .calc .tot span{color:var(--text)}
.seg2{display:flex;gap:6px;margin:6px 0}
.seg2 button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink);font-weight:700;font-size:13px}
.seg2 button.on{background:var(--gold);color:#1b1404;border-color:transparent}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row .grow{flex:1;min-width:0;font-size:13px;line-height:1.4}
.row .grow small{color:var(--muted);display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.stepper{display:flex;align-items:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.stepper .qty{font-family:var(--f-num);font-size:20px;min-width:90px;text-align:center}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:12px;display:block}
.tone-opp{--tone:var(--opp)} .tone-market{--tone:var(--market)} .tone-doodad{--tone:var(--doodad)} .tone-payday{--tone:var(--payday)}
.tone-charity{--tone:var(--charity)} .tone-baby{--tone:var(--baby)} .tone-downsized{--tone:var(--down)} .tone-ft{--tone:var(--ft)}

.ledger h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.ledger table{width:100%;border-collapse:collapse;font-size:13px}
.ledger td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger td:last-child{text-align:right;font-family:var(--f-num);white-space:nowrap;padding-left:8px}
.ledger td small{color:var(--muted);font-family:var(--f-body)}
.ledger tr.total td{font-weight:700;border-bottom:2px solid var(--line)}
.ledger .big{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.ledger .big b{font-family:var(--f-num);font-size:20px}
.spark{width:100%;height:90px;display:block;background:var(--ink);border-radius:10px;border:1px solid var(--line)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.pos{border-color:rgba(79,209,139,.6)} .toast.neg{border-color:rgba(255,107,107,.6)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#setup{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#1d3157 0%,var(--ink) 60%);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.setup-in{max-width:520px;margin:0 auto}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:.92;letter-spacing:-.02em;margin:8px 0 6px}
.logo em{font-style:normal;color:var(--gold)}
.lede{color:var(--muted);line-height:1.55;margin:0 0 18px;max-width:52ch}
.seg{display:flex;gap:6px;margin:6px 0 16px}
.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-num);font-weight:700}
.seg button.on{background:var(--gold);color:#1b1404;border-color:transparent}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin-bottom:8px}
.avatar{width:76px;height:76px;border-radius:14px;background:var(--ink);border:1px solid var(--line);padding:0;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;display:block}
.avatar span{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(11,20,36,.8);padding:2px 0}
.pcard input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-weight:700}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px}
.pill b{font-family:var(--f-num)}
.chargrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.chargrid button{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px 2px 6px;font-size:11px;font-weight:700;min-width:0}
.chargrid button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.chargrid img{width:100%;aspect-ratio:1;display:block;max-width:100%}
.howto{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.6}
.howto b{color:var(--text)}
.artwrap{margin:4px -4px 10px;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.art{width:100%;height:auto;display:block;aspect-ratio:16/9;max-width:100%}
.story{font-style:italic;color:#e7ecf5!important;border-left:3px solid var(--tone,var(--gold));padding-left:10px}
.lesson{font-size:12px;color:var(--muted)!important;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;margin-top:10px!important}
.lesson b{color:var(--gold)}
.botpill{background:rgba(90,169,255,.15)!important;border-color:#5aa9ff!important;color:#bfe0ff}
#rollNum{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;text-align:center;font-family:var(--f-display);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6),0 0 40px rgba(233,185,73,.7)}
#rollNum b{display:block;font-size:110px;line-height:1;font-weight:800;color:var(--gold)}
#rollNum span{font-family:var(--f-num);font-size:18px}
#rollNum.pop{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.rules h3{font-family:var(--f-display);font-size:16px;margin:16px 0 6px;color:var(--gold)}
.rules li{margin:4px 0;line-height:1.5;color:#d3dbea}
.rules ul{padding-left:18px;margin:0}
.sheet.locked .acts button,.sheet.locked .stepper button,.sheet.locked .seg2 button,.sheet.locked .rows button{opacity:.3;pointer-events:none;filter:grayscale(.7)}
.botbar{display:flex;align-items:center;gap:8px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.5);color:#bfe0ff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.botbar i{width:8px;height:8px;border-radius:50%;background:#5aa9ff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#hud.locked .actions .btn{opacity:.3;filter:grayscale(.7)}
#hud.locked .who::after{content:"BOT IS PLAYING";margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#bfe0ff;background:rgba(90,169,255,.18);border-radius:99px;padding:3px 8px;flex:none}
#rank.locked .rk{pointer-events:none}
#viewer{position:fixed;inset:0;z-index:55;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.band .when{color:var(--muted)!important;letter-spacing:.04em!important;font-family:var(--f-num)}
.hint{font-size:13px;color:#d9f5e6!important;background:rgba(79,209,139,.1);border:1px solid rgba(79,209,139,.4);border-radius:10px;padding:8px 10px;margin-top:8px!important}
.hint b{color:var(--money)}
#paySlip{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:58;width:min(340px,calc(100% - 32px));background:#fffaf0;color:#1b2a44;border-radius:14px;padding:12px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5);font-size:13px;border-top:6px solid var(--gold)}
#paySlip.in{animation:slip .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slip{from{transform:translate(-50%,-30px) rotate(-3deg);opacity:0}}
.ps-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed #d8cdb4;padding-bottom:6px;margin-bottom:4px}

function assetCF(a){
  if(a.type==='re')return a.rent*(1-a.opex)-(a.left>0?a.pay:0);
  if(a.type==='biz')return a.profit-(a.left>0?a.pay:0);
  if(a.type==='stock')return a.shares*STOCKS[a.sym].div*(1-DIV_TAX)/12;
  if(a.type==='bond')return a.def?0:a.units*a.face*a.coupon*(1-BOND_TAX)/12;
  return 0;
}
function assetValue(a){
  if(a.type==='stock')return a.shares*STOCKS[a.sym].base*(G&&G.stockIdx||1);
  if(a.type==='bond')return a.units*a.face;
  if(a.type==='gold')return a.qty*GOLD_REF;
  if(a.type==='scam')return a.amount;
  if(a.type==='crypto')return a.qty*btcPrice();
  return num(a.value||a.price);
}

function calc(p,o={}){
  let passive=0,rentGross=0;for(const a of p.assets){passive+=num(assetCF(a));if(a.type==='re'&&a.kind!=='land')rentGross+=a.rent;}
  const rentTax=rentGross*12>RENT_TAX_TH?rentGross*RENT_TAX:0;
  const depInt=p.dep*DEP_RATE/12;passive+=depInt-rentTax;
  const kidsIn=p.kidAges.filter(k=>k<22);
  const sal=o.noSalary?p.salary*(o.benefit||0):p.salary;
  const {ins,tax}=netSalary(sal,kidsIn.length);
  const sp=p.spouse?netSalary(p.spouse,0):null,spouseNet=p.spouse?p.spouse-sp.ins-sp.tax:0;
  const liabPay=p.liabs.reduce((s,l)=>s+num(l.pay),0);
  const childExp=kidsIn.reduce((s,k)=>s+kidCost(p,k),0), loanPay=Math.round(p.loan*clr());
  const insPrem=p.hins?Math.round(p.salary*.015/1e4)*1e4:0;
  const totalExp=ins+tax+p.rent+p.living+liabPay+childExp+loanPay+insPrem+p.parentCare;
  const side=(o.noSalary?0:1)*p.sides.reduce((s,x)=>s+x.inc,0)+(p.gift||0);
  const income=sal+spouseNet+passive+side;
  return {passive,income,totalExp:totalExp+p.schoolPrem,cashflow:income-totalExp-p.schoolPrem,childExp,loanPay,liabPay,ins,tax,rentTax,depInt,spouseNet,insPrem,sal,side};
}

function needLoan(p,amt){return p.ft?0:Math.max(0,Math.ceil((amt-p.cash)/CL_STEP)*CL_STEP);}
function pay(p,amt,why){
  amt=num(amt);if(amt<=0)return;
  if(!p.ft&&p.cash<amt&&p.loan+needLoan(p,amt)>loanCap(p))liquidate(p,amt);
  if(!p.ft&&p.cash<amt&&p.dep>0){const w=Math.min(p.dep,amt-p.cash);p.dep-=w;p.cash+=w;}
  const need=needLoan(p,amt);
  if(need){p.loan+=need;p.cash+=need;p.st=p.st||{};p.st.loanMax=Math.max(p.st.loanMax||0,p.loan);if(Math.random()<.4)chickSay('autoLoan',p);toast(`${p.name} automatic consumer loan ${fmt(need)} (interest ${fmt(need*clr())}/month)`,'neg');log(`Consumer loan ${fmt(need)} to pay: ${why}`,p);}
  p.cash-=amt;sfx('pay');
}
function liquidate(p,amt){
  const list=p.assets.slice().sort((a,b)=>assetCF(a)-assetCF(b));
  for(const a of list){if(p.cash+p.dep+Math.max(0,loanCap(p)-p.loan)>=amt)break;
    const v=Math.max(0,a.type==='scam'?0:a.type==='re'||a.type==='biz'?(assetValue(a)-a.loan)*.5:assetValue(a)*.5);
    p.assets.splice(p.assets.indexOf(a),1);p.cash+=v;p.deals.push({name:'Fire sale '+(a.name||a.type),pl:v-(a.equity||a.cost||0)});toast(`${p.name} fire sale ${assetLabel(a)}: only gets ${fmt(v)}`,'neg');log(`Fire sale ${assetLabel(a)} get ${fmt(v)} (50% of value) because the credit limit ran out`,p);}
  if(p.cash+p.dep+Math.max(0,loanCap(p)-p.loan)<amt){
    p.bankrupt=(p.bankrupt||0)+1;p.skip=Math.max(p.skip,2);
    p.liabs.forEach(l=>{if(l.key!=='home'){l.bal=Math.round(l.bal/2);l.pay=Math.round(l.pay/2);}});
    toast(`${p.name} BANKRUPT: lose 2 turns, personal debt restructured to half`,'neg');log('Bankruptcy: out of assets, over the credit limit. Lose 2 turns, personal debt is halved.',p);}
}

function amortize(p){for(const a of p.assets){if(a.loan>0&&a.left>0){const int=a.loan*a.rate/12;a.loan=Math.max(0,a.loan-(a.pay-int));a.left--;

function advanceTurn(p){
  if(p.ft||p.out)return null;
  const before=p.cash,unemp=p.skip>0;
  for(let m=0;m<mpt();m++){amortize(p);const cf=calc(p,{noSalary:unemp,benefit:unemp&&p.benefitLeft>0?mode().benefit:0}).cashflow;if(cf>=0)p.cash+=cf;else pay(p,-cf,'living expenses');}
  if(unemp&&p.benefitLeft>0)p.benefitLeft--;
  p.assets.filter(a=>a.type==='scam').forEach(a=>{if(a.turns>0){const g=a.amount*a.promise*mpt();p.cash+=g;a.paid+=g;a.turns--;}else{p.assets.splice(p.assets.indexOf(a),1);p.deals.push({name:a.name,pl:a.paid-a.amount});p.events.push({k:'scamcrash',name:a.name,lost:a.amount-a.paid});log(`${a.name} collapsed, lost ${fmt(a.amount-a.paid)}`,p);}});
  const y0=Math.floor(p.age);p.age+=mpt()/12;if(Math.floor(p.age)>y0)yearTick(p);
  return {delta:p.cash-before,unemp};
}

function analyze(a,ltv){
  const loan=round1(a.price*ltv),fees=a.type==='re'?a.price*FEE_BUY_RE:0,equity=a.price-loan+fees;
  const rate=a.teaser?a.teaser.rate:a.rate,pmtM=pmt(loan,rate,a.term);
  const net=a.type==='re'?a.rent*(1-a.opex):a.profit;
  const cf=net-pmtM,coc=equity?cf*12/equity:0;
  const pmtAfter=a.teaser?pmt(loan*.95,a.floatRate+(G&&G.rateAdj||0),a.term-a.teaser.months/12):pmtM;
  return {loan,fees,equity,pmtM,net,cf,coc,gy:a.type==='re'&&a.price?a.rent*12/a.price:0,pmtAfter,cfAfter:net-pmtAfter};
}
function botPick(p,d){const L=BOT_LVL[p.botLvl||'normal'];const a=d.a;let best=null;
  for(const x of d.ltvs){const R=analyze(a,x),Ln=needLoan(p,R.equity);if(p.loan+Ln>loanCap(p))continue;if(Ln&&!L.useLoan)continue;const real=Math.min(R.cf,R.cfAfter)-Ln*clr(),coc=R.equity?real*12/R.equity:0;
    if(a.kind==='land'||a.kind==='startup'){if(p.cash>R.equity*3&&Math.random()<L.spec)best={x,real:0};continue;}
    if(real>0&&coc>=L.coc&&(!best||real>best.real))best={x,real};}
  return best?best.x:null;}
function botHousekeeping(p){if(p.ft){ftFix(p);if(!p.ftGuard&&p.ftStart>=4*TY)p.ftGuard=true;return;}

function assetLabel(a){

  if(a.type==='bond')return `TP ${a.issuer} · ${a.units} lot${a.def?' (default)':''}`;

}

   giá người mua trên thẻ Thị trường; mua ngay trên sàn đắt hơn giá trên thẻ Cơ hội. */
const QUICK={re:{boom:.97,normal:.9,bust:.8},biz:.7,gold:.97,crypto:.98,bond:.95,buy:1.02,goldBuy:1.03};
let armed=null;
const reCyc=a=>(G.cyc&&G.cyc[a.kind==='land'?'land':'re'])||'normal';
function quickQuote(a){let price,net,basis;
  if(a.type==='re'){price=round1(assetValue(a)*QUICK.re[reCyc(a)]);net=price-a.loan-price*TAX_SELL_RE;basis=a.equity||0;}
  else if(a.type==='biz'){if(a.kind==='startup')return null;price=round1(assetValue(a)*QUICK.biz);net=price-a.loan;basis=a.equity||0;}
  else if(a.type==='stock'){price=Math.round(a.shares*STOCKS[a.sym].base*(G.stockIdx||1));net=price*(1-STK_FEE-STK_TAX);basis=a.shares*a.cost;}
  else if(a.type==='gold'){price=Math.round(a.qty*GOLD_REF*QUICK.gold);net=price;basis=a.cost;}
  else if(a.type==='crypto'){price=Math.round(a.qty*btcPrice()*QUICK.crypto);net=price;basis=a.cost;}
  else if(a.type==='bond'){price=Math.round(a.units*a.face*(a.def?.4:QUICK.bond));net=price;basis=a.units*a.face;}

function quickSell(p,a){const Q=quickQuote(a);if(!Q)return;

function quickBuy(p,kind,sym,n){

function drawSpark(p){
  const cv=$('#spark');if(!cv)return;const dpr=Math.min(devicePixelRatio,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);const H=[...p.hist,snapHist(p)].map(d=>({passive:num(d.passive),exp:num(d.exp)}));
  const max=Math.max(1,...H.map(d=>Math.max(d.passive,d.exp)))*1.1,n=H.length,pad=8;
  const X=i=>pad+(n<2?0:i*(w-2*pad)/(n-1)),Y=v=>h-pad-Math.max(0,v)/max*(h-2*pad);
  x.strokeStyle='rgba(147,163,192,.18)';x.lineWidth=1;for(let g=1;g<4;g++){x.beginPath();x.moveTo(0,h*g/4);x.lineTo(w,h*g/4);x.stroke();}
  const ln=(key,col,fill)=>{x.beginPath();H.forEach((d,i)=>i?x.lineTo(X(i),Y(d[key])):x.moveTo(X(i),Y(d[key])));x.strokeStyle=col;x.lineWidth=2;x.stroke();
    if(fill){x.lineTo(X(n-1),h-pad);x.lineTo(X(0),h-pad);x.closePath();x.fillStyle=fill;x.fill();}
    x.beginPath();x.arc(X(n-1),Y(H[n-1][key]),3.5,0,7);x.fillStyle=col;x.fill();};
  ln('exp','#ff6b6b');ln('passive','#4fd18b','rgba(79,209,139,.15)');
}

/* ================= turn flow ================= */
function startTurn(){
  const p=curP();G.phase='busy';if(isOnline()){G.turnAt=Date.now();G.takeover=0;}renderHUD();focusOn(p);save();
  const seq=[];
  if(G.news&&!G.news.seen)seq.push(done=>showNews(done));
  if(G.swan&&!G.swan.seen)seq.push(done=>showSwan(done));
  if(!p.ft&&!p.out){const unemp=p.skip>0,c=calc(p,{noSalary:unemp,benefit:unemp&&p.benefitLeft>0?mode().benefit:0});const r=advanceTurn(p);if(r)showPaySlip(p,c,r);log(`Salary ${mpt()} month: ${sgn(r.delta)}`,p);renderHUD();}
  else if(p.ft){p.age+=mpt()/12;}
  seq.push(done=>runEvents(p,done));
  const next=()=>{if(seq.length){seq.shift()(next);return;}afterEvents(p);};
  setTimeout(next,p.ft?50:900);
}
function afterEvents(p){
  if(p.out){nextTurn();return;}
  if(p.jail>0){p.jail--;toast(`${p.name} is in prison, turn lost (left ${p.jail})`,'neg');log('In prison, lost a turn',p);renderHUD();setTimeout(nextTurn,1400);return;}
  if(p.skip>0){p.skip--;toast(`${p.name} unemployed, skip this turn (left ${p.skip})`,'neg');log('Unemployed, skip a turn',p);renderHUD();setTimeout(nextTurn,1400);return;}
  if(!p.bot&&G.quiz&&!p.introDone&&mastered(p))p.introDone=true;
  if(!p.bot&&G.quiz&&!p.introDone){p.introDone=true;return ledgerQuiz(p,introItems(p),()=>afterEvents(p),true);}
  if(p.bot&&iControl())botHousekeeping(p);
  G.phase='roll';renderHUD();save();
  if(p.bot&&iControl()){const nd=p.ft?2:1;botLater(()=>roll(p.charity>0?nd+1:nd,true),900,()=>G&&curP()===p&&G.phase==='roll');}
}
function showNews(done){G.news.seen=true;openModal({tone:'market',eyebrow:`Economic news for the year ${G.news.year}`,title:`Happy new year ${G.news.year}!`,art:art('news',{year:G.news.year}),body:G.news.lines.map(l=>`<p>${l}</p>`).join(''),lesson:'Market cycles affect asset prices all year. Buy in a freeze, sell in a boom.',acts:[{label:'Continue',cls:'primary',fn:()=>{closeModal();done();}}],bot:()=>{closeModal();done();}});}
const LUCK_X2=80;
async function roll(n,byBot){
  if(G.phase!=='roll')return;const p=curP();if(isBotTurn()&&!byBot)return;G.phase='busy';renderHUD();ensureAudio();
  const vals=Array.from({length:n},()=>1+Math.floor(Math.random()*6));
  if(p.charity>0)p.charity--;
  sfx('dice');await animDice(vals);collRoll(p,vals);diceTalk(p,vals);
  let sum=vals.reduce((a,b)=>a+b,0);const lucky=S(p).luck>=LUCK_X2;if(lucky){sum*=2;addS(p,{luck:-30},'Use luck to double the dice');}p.lastRoll=sum;showRoll(vals,sum);if(lucky)$('#rollNum').innerHTML=`<b>${sum}</b><span>${vals.join(' + ')} × 2 · luck</span>`;if(lucky&&!p.bot)quoteToast('Luck knocks: dice total doubled!');
  await moveSteps(p,sum);
  if(p.ft)ftLanding(p);else landing(p);
}
function bonus(p,kind,landed){const M=mode(),r=rf(...(kind==='tet'?M.tetBonus:M.midBonus)),amt=Math.round(p.salary*r/1e5)*1e5;
  if(p.retired||p.skip>0){toast(`${p.name} no bonus (${p.retired?'retired':'unemployed'})`);return 0;}
  p.cash+=amt;log(`${kind==='tet'?'Year-end bonus':'Mid-year bonus'} ${fmt(amt)} (${trimNum(r,1)} months of salary)`,p);
  if(!landed){toast(`${p.name} · ${kind==='tet'?'Year-end bonus':'Mid-year bonus'}: +${fmt(amt)}`,'pos');jingle(kind==='tet'?'tet':'payday');}
  renderHUD();return amt;}
async function moveSteps(p,steps){
  for(let s=0;s<steps;s++){
    if(p.ft){p.ftPos=(p.ftPos+1)%FT.length;await hopTo(p);if(FT[p.ftPos].t==='cf'){ftPayday(p);if(!p.ft)break;}}
    else{p.pos=(p.pos+1)%BOARD.length;await hopTo(p);const t=BOARD[p.pos];if(s<steps-1&&(t==='midbonus'||t==='tetbonus'))bonus(p,t==='tetbonus'?'tet':'mid',false);}
  }
  sfx('land');arrangeTokens();if(typeof celebrateTile==='function')celebrateTile(p);
}
function endTurn(){
  closeModal();const p=curP();missionsCheck();const c=calc(p);
  [...G.players].forEach(q=>checkAch(q).forEach(k=>{toast(`${q.name} achievement unlocked: ${ACH[k].n}`,'pos');log(`Achievements: ${ACH[k].n}`,q);}));
  if(!p.ft&&!p.out&&c.passive>c.totalExp&&!(needPaywall(p)&&p.ftWait&&G.turn-p.ftWait<4*G.players.length)){
    sfx('win');coinRain(40);
    const ftc=Math.max(TY,Math.round(c.passive*200/(10*TR))*10*TR);
    const go=async()=>{closeModal();p.ft=true;p.freeAge=p.age;addS(p,{happy:20},'Financial freedom');moment('escape','FINANCIAL FREEDOM!',`${esc(p.name)} escapes the Grind Mill at ${Math.floor(p.age)} y/o`);chickSay('freedom',p);if(!p.bot){setMastered(p);if(G.quiz)toast(`${p.name} has mastered assets and liabilities: no more ledger from now on`,'pos');}p.ftCF=ftc;p.ftStart=ftc;p.ftBase=ftc;p.ftLap=0;p.ftVentures=[];p.ftAssets=[];p.cash+=ftc;p.ftPos=0;checkAch(p);log(`Financially free at ${Math.floor(p.age)} years old! Payday ${fmt(ftc)}`,p);await hopTo(p,true);arrangeTokens();ftChooseLifestyle(p,nextTurn);};
    openModal({tone:'ft',eyebrow:'Complete the Worker track',title:`${esc(p.name)} financial freedom at ${Math.floor(p.age)} years old!`,art:art('escape'),quote:QUOTES.ctx.free,
      body:`<p>Passive income <b class="num pos">${fmt(c.passive)}</b>/months already exceeds total expenses <b class="num">${fmt(c.totalExp)}</b>. No longer working for money.</p><div class="facts">${fact('New Payday',fmt(ftc),'pos','= passive income × 200')}${fact('Winning goal',fmt(ftc+ftGoal()))}</div><p>On the Prosperity Track (outer ring), buy the dream “${esc(G.dreams[p.dream].n)}” or increase Payday by ${fmt(ftGoal())} to win. Careful: lifestyle creep, lawsuits, taxes, crashes and risky bets can push you back to the Grind Mill.</p>`,
      acts:[{label:'Enter the Prosperity Track',cls:'primary',fn:()=>needPaywall(p)?showPaywall(p,go):go()}],bot:go});
    return;
  }
  if(p.ft&&p.ftCF>=p.ftStart+ftGoal()&&!p.won){if(S(p).legacy>=legacyNeed()){win(p,`Payday reaches ${fmt(p.ftCF)}, Legacy ${S(p).legacy}.`);return;}if(!p.legacyHint){p.legacyHint=1;toast(`${p.name} has the cash flow but Legacy is only ${S(p).legacy}/${legacyNeed()}: give to charity and build a legacy project`,'neg');}}
  nextTurn();
}
function nextTurn(){
  if(G&&G.players)G.players.forEach(q=>{if(q.tmpBot){q.bot=false;q.tmpBot=false;}});
  const p=curP();p.hist.push(snapHist(p));if(p.hist.length>120)p.hist.shift();
  if(!G.players.some(q=>!q.won&&!q.out)){save();showSummary();return;}
  let i=G.cur;do{i=(i+1)%G.players.length;if(i===0){G.turn++;const m0=G.month;G.month+=mpt();if(Math.floor(G.month/12)>Math.floor(m0/12))newYear();}}while(G.players[i].won||G.players[i].out);
  G.cur=i;if(isOnline()&&!iControl()){G.phase='await';save();renderHUD();return;}startTurn();
}
function win(p,why){
  p.won=true;checkAch(p);sfx('win');coinRain(120);moment('trophy','VICTORY!',`${esc(p.name)} reached the dream at ${Math.floor(p.age)} y/o`);log(`WON at ${Math.floor(p.age)} years old! ${why}`,p);save();

    acts:[{label:'View summary',fn:()=>showSummary()},...(left?[{label:'Others continue playing',fn:()=>{closeModal();nextTurn();}}]:[]),{label:'New game',cls:'primary',fn:()=>{closeModal();G={dreams:G.dreams};draft=[];showSetup();}}]});
  renderHUD();

/* ================= vòng Người lao động: các ô ================= */
function landing(p){
  const t=BOARD[p.pos];
  if(t==='opp')return cardOpp(p);
  if(t==='market')return cardMarket(p);
  if(t==='doodad')return cardDoodad(p);
  if(t==='charity')return cardCharity(p);
  if(t==='baby')return cardBaby(p);
  if(t==='downsized')return cardDown(p);

/* ngày lĩnh lương: các khoản công nghệ tới hạn, người chơi tự tung xúc xắc từng khoản */
function ftReveal(p,done){const v=p.ftVentures.find(x=>x.due);if(!v)return done();
  ftGamble(p,{eyebrow:'Tech bet settles',title:`${esc(v.name)}: invest ${fmt(v.stake)}`,art:'chartup',bonus:v.bonus||0,
    body:`<p>Settlement day. Roll 2 dice to learn your investment’s fate.</p>`,
    outcome:R=>{const m=(v.m||VOUT_TABLE)[R.sum-2],back=Math.round(v.stake*m);p.cash+=back;p.ftVentures.splice(p.ftVentures.indexOf(v),1);p.deals.push({name:'Technology: '+v.name,pl:back-v.stake});
      log(`Settled ${v.name} (invest ${fmt(v.stake)}): dice ${R.sum} → ${m?'×'+trimNum(m,1)+' = '+fmt(back):'total loss'}`,p);if(m>=4){sfx('win');coinRain(m>=10?80:30);}if(m>=10)chickSay('unicorn',p);
      return m===0?{title:'Total loss!',text:`The company ran out of money and shut down. Lost ${fmt(v.stake)}.`,art:'chartdown',lesson:'Losing a bet is normal. Never put everything in one place.'}
        :m<1?{title:`Loss: only ×${trimNum(m,1)}`,text:`Bought out cheaply. You get back ${fmt(back)}.`,art:'chartdown'}
        :{title:m>=10?`UNICORN! ×${trimNum(m,1)}`:`Win ×${trimNum(m,1)}`,text:`Sold the stake, received ${fmt(back)} (interest ${fmt(back-v.stake)}).`,good:true,art:'trophy'};},
    after:()=>ftReveal(p,done)});}
/* IPO: cần ít nhất 2 doanh nghiệp; bán 30% cổ phần ra công chúng */
function ftIPO(p){const bz=p.ftAssets.filter(a=>a.sector!=='kcn'||true),base=bz.reduce((s,a)=>s+num(a.cost),0),fee=Math.round(base*.05/1e6)*1e6;
  if(bz.length<2)return openModal({tone:'ft',eyebrow:'Prosperity Track · IPO',title:'Not ready to go public',art:art('chartup'),body:'<p>You need at least 2 businesses (or industrial parks) to form a group and IPO.</p>',acts:[{label:'Xong',cls:'primary',fn:endTurn}],bot:endTurn});
  const bonus=(p.ftGuard?1:0)+relBonus(p)+(G.ftCredit>0?-2:0);
  const go=()=>ftGamble(p,{eyebrow:'IPO · Listing day',title:'Ringing the opening bell',art:'chartup',bonus,
    body:`<p>Paid ${fmt(fee)} in advisory and underwriting fees. Total 8–9: valued ×3, 10–11: ×5, 12: ×8 the original capital; under 8: the listing is pulled.</p>`,
    outcome:R=>{if(R.sum<8)return {title:'IPO failed',text:'Bad market, investors walk away. Fees lost.',art:'chartdown',lesson:'IPO timing matters as much as the business itself.'};
      const k=R.sum>=12?8:R.sum>=10?5:3,cash=Math.round(base*k*.3);p.cash+=cash;bz.forEach(a=>{a.cf=Math.round(a.cf*.7);a.ipo=true;});p.ipos=(p.ipos||0)+1;
      log(`IPO success: valued at ×${k}, sold 30% for ${fmt(cash)}`,p);moment('chartup','Ringing the bell!',`${esc(p.name)} IPO, valued ×${k}`);
      return {title:`IPO success! Valued at ×${k}`,text:`The group is valued at ${fmt(base*k)}. Selling 30% of the shares brings in ${fmt(cash)}; your businesses keep 70% of their cash flow, the rest goes to new shareholders.`,good:true,art:'trophy'};}});
  openModal({tone:'ft',eyebrow:'Prosperity Track · IPO',title:'Take the group public',art:art('chartup'),
    body:`<div class="facts">${fact('Businesses’ original capital',fmt(base))}${fact('Advisory & underwriting fees',fmt(fee),'neg')}${fact('Dice bonus',(bonus>0?'+':'')+bonus)}</div><p>Legal team (+1) keeps the books clean, a wide network (+1) and a golf membership (+1) attract big investors.</p>`,
    acts:[{label:`IPO, pay fees ${fmt(fee)}`,cls:'primary',disabled:p.cash<fee,fn:()=>{p.cash-=fee;go();}},{label:'Later',fn:endTurn}],bot:()=>p.cash>fee*3&&bonus>=1?(p.cash-=fee,go()):endTurn()});}
/* Khu công nghiệp: đúng luật thì chậm, chạy giấy phép thì đỏ đen */
function ftKCN(p,t){const i=p.ftPos,own=p.ftAssets.some(a=>a.idx===i);
  const add=(price,ramp,bribe)=>{p.cash-=price;p.ftAssets.push({idx:i,name:t.name,sector:'bds',cost:t.cost,cf:Math.round(t.cf*(ramp?.3:1)),cf0:t.cf,ramp:ramp?2:0,bribe:!!bribe});ftRecalc(p);};
  const legal=()=>{add(t.cost,true,false);log(`Invest ${t.name} ${fmt(t.cost)}, filing by the book (only 30% cash flow for the first 2 paydays)`,p);endTurn();};
  const bribe=()=>{const env=Math.round(t.cost*.1);p.cash-=env;chickSay('bribe',p);
    ftGamble(p,{eyebrow:'Bribe for the permit',title:'The envelope is handed over…',art:'scam',bonus:0,noLegacy:true,body:`<p>Paid ${fmt(env)} "grease money". Total 2–4: caught red-handed. 5 or more: it works, the project starts now and land is 20% cheaper.</p>`,
      outcome:R=>{if(R.sum<=4){p.jail=3;p.bribes=(p.bribes||0)+1;p.jailCount=num(p.jailCount)+1;moment('police','ARRESTED!',`${esc(p.name)} goes to prison for 3 turns`);chickSay('jail',p);const fine=Math.round(Math.max(0,p.cash)*.3);p.cash-=fine;addS(p,{rel:-25,happy:-25,luck:-15,legacy:-20},'Arrested for bribery');log(`Caught red-handed buying the permit for ${t.name}: lost the envelope ${fmt(env)}, fined ${fmt(fine)}, 3 turns in prison`,p);
          return {title:'ARRESTED!',text:`Lost the envelope ${fmt(env)}, fined ${fmt(fine)} and 3 turns in prison. The project is revoked.`,art:'police',lesson:'Bribery may work a few times, but one exposure costs you everything.'};}
        p.bribes=(p.bribes||0)+1;add(Math.round(t.cost*.8),false,true);log(`Bribe for the permit ${t.name} it works (envelope ${fmt(env)}), land 20% cheaper`,p);
        return {title:'It worked…',text:`Permit granted at once, land 20% cheaper: you pay only ${fmt(Math.round(t.cost*.8))}, full cash flow of ${fmt(t.cf)} from this payday. But the file will still be there when inspectors come.`,good:true,art:'garment'};}});};
  openModal({tone:'ft',eyebrow:'Prosperity Track · Industrial park',title:esc(t.name),art:art('garment'),
    body:`<p>Manufacturers are hunting for land. Huge cash flow, but land permits are the bottleneck.</p><div class="facts">${fact('Capital',fmt(t.cost))}${fact('Cash flow','+'+fmt(t.cf),'pos')}${fact('Yield',pct(t.cf/t.cost))}</div>
      <p><b>By the book:</b> pay the full ${fmt(t.cost)}; the first 2 paydays bring only 30% of the cash flow while permits are processed.<br><b>Bribe for the permit:</b> chi ${fmt(t.cost*.1)} in an envelope, then roll: 2–4 means arrest (≈17%), 3 turns in prison; if it works, land is 20% cheaper and runs at once. The next Inspection may expose you.</p>${own?'<p>You already own this park.</p>':''}`,
    acts:[{label:`By the book ${fmt(t.cost)}`,cls:'primary',disabled:own||p.cash<t.cost,fn:legal},{label:'Bribe for the permit',disabled:own||p.cash<t.cost*.9,fn:bribe},{label:'Skip',fn:endTurn}],
    bot:()=>own||p.cash<t.cost*1.5?endTurn():(BOT_LVL[p.botLvl||'normal'].spec>.6&&p.cash>=t.cost*.9?bribe():legal())});}
/* Thanh tra: hồ sơ cũ quay lại */
function ftInspect(p){const n=p.bribes||0;
  if(!n){addS(p,{luck:10},'Clean record');return openModal({tone:'ft',eyebrow:'Prosperity Track · Inspection',title:'Clean record',art:art('police'),body:'<p>Inspectors review all your projects: no violations. Your reputation grows, Luck +10.</p>',lesson:'Clean business, sound sleep.',acts:[{label:'Continue',cls:'primary',fn:endTurn}],bot:endTurn});}
  const lim=3+n*2;
  ftGamble(p,{eyebrow:'Prosperity Track · Inspection',title:'The inspectors knock on your door',art:'police',bonus:0,noLegacy:true,
    body:`<p>You have bought permits ${n} times. Dice total ≤ ${lim}: exposed (≈${pct([0,0,1,3,6,10,15,21,26,30,33,35,36][Math.min(12,lim)]/36,0)}).</p>`,
    outcome:R=>{if(R.sum>lim)return {title:'Got away… this time',text:'Nothing was found. But the file is still there.',good:true,art:'escape'};
      const lost=p.ftAssets.filter(a=>a.bribe);lost.forEach(a=>p.ftAssets.splice(p.ftAssets.indexOf(a),1));const fine=Math.round(Math.max(0,p.cash)*.5);p.cash-=fine;p.jail=p.ftGuard?2:4;p.bribes=0;p.jailCount=num(p.jailCount)+1;moment('police','PROSECUTED!',`${esc(p.name)} goes to prison for ${p.jail} turn`);chickSay('jail',p);
      addS(p,{rel:-30,happy:-25,luck:-20,legacy:-30},'Prosecuted');log(`Inspectors found bribery: confiscated ${lost.length} projects, fined ${fmt(fine)}, in prison ${p.jail} turn`,p);
      return {title:'PROSECUTED!',text:`Confiscated ${lost.length?lost.map(a=>esc(a.name)).join(', '):'the related assets'}, fined ${fmt(fine)}, in prison ${p.jail} turn${p.ftGuard?' (your lawyers reduced the sentence)':''}.`,art:'police',lesson:'Assets gained through bribery can always be taken back.'};}});}
/* Sân gôn: quan hệ là tài sản vô hình của người giàu */
function ftGolf(p){const fee=200*TR,club=2*TY;
  const play=()=>{p.cash-=fee;addS(p,{rel:10,happy:4},'Golf');
    ftGamble(p,{eyebrow:'Golf course',title:'18 holes with the tycoons',art:'skyline',bonus:relBonus(p),body:'<p>Total 10 or more: invited into an insider deal (buy a business at 70%). 7–9: new contacts, Connections +5. Under 7: just a round of golf.</p>',
      outcome:R=>{if(R.sum>=10){const free=FT.map((t,i)=>[t,i]).filter(([t,i])=>t.t==='biz'&&!G.players.some(q=>q.ftAssets&&q.ftAssets.some(a=>a.idx===i)));const pk=free.length?pick(free):null;
          if(pk&&p.cash>=pk[0].cost*.7){const [t,i]=pk,price=Math.round(t.cost*.7);p.cash-=price;p.ftAssets.push({idx:i,name:t.name,sector:t.sector,cost:price,cf:t.cf});log(`Insider deal on the golf course: bought ${t.name} price ${fmt(price)} (70%)`,p);
            return {title:'Insider deal!',text:`A tycoon hands over ${esc(t.name)} only ${fmt(price)} (70% of price). Cash flow +${fmt(t.cf)}.`,good:true,art:'buyer'};}
          addS(p,{rel:8});return {title:'Introduced to a big investor',text:'Connections +8. Your next IPO is more likely to succeed.',good:true};}
        if(R.sum>=7){addS(p,{rel:5});return {title:'Met a few more business owners',text:'Connections +5.',good:true};}
        return {title:'Just a round of golf',text:'A few bad holes and nobody talks business.',good:false};}});};
  const join=()=>{p.cash-=club;p.golfClub=true;addS(p,{rel:15,happy:6},'Golf membership');log(`Bought a golf club membership ${fmt(club)}`,p);endTurn();};
  openModal({tone:'ft',eyebrow:'Prosperity Track · Golf course',title:'Exclusive golf club',art:art('skyline'),
    body:`<p>Many big deals are closed on the golf course, not in the boardroom.</p><div class="facts">${fact('One round',fmt(fee))}${fact('Membership',p.golfClub?'Owned':fmt(club),'', 'Connections +15, +1 on IPO and golf dice, forever')}</div>`,
    acts:[{label:`Play a round ${fmt(fee)}`,cls:'primary',disabled:p.cash<fee,fn:play},...(p.golfClub?[]:[{label:`Membership ${fmt(club)}`,disabled:p.cash<club,fn:join}]),{label:'Don’t go',fn:endTurn}],
    bot:()=>p.cash>club*3&&!p.golfClub?join():p.cash>fee*10?play():endTurn()});}
function ftLanding(p){
  if(p.pendingItems&&p.pendingItems.length)return collReveal(p,()=>ftLanding(p));
  if(p.ftVentures&&p.ftVentures.some(v=>v.due))return ftReveal(p,()=>ftLanding(p));
  const t=FT[p.ftPos];
  if(t.t==='cf')return endTurn();
  if(t.t==='biz'){const own=p.ftAssets.some(a=>a.idx===p.ftPos);const go=()=>{ftFix(p);p.cash-=t.cost;p.ftAssets.push({idx:p.ftPos,name:t.name,sector:t.sector,cost:t.cost,cf:t.cf});ftRecalc(p);log(`Invest ${t.name} ${fmt(t.cost)}, +${fmt(t.cf)}`,p);sfx('cash');endTurn();};
    return openModal({tone:'ft',eyebrow:'Prosperity Track · Invest',title:t.name,art:art('skyline'),body:`<p>A large business seeks investors. Every Payday you receive extra profit.</p><div class="facts">${fact('Investable capital',fmt(t.cost))}${fact('Extra cash flow','+'+fmt(t.cf),'pos')}${fact('Yield',pct(t.cf/t.cost))}${fact('Goal progress',pct(t.cf/ftGoal(),0))}${fact('Sector',SECTORS[t.sector]||'')}</div>${own?'<p>You already own this business.</p>':p.cash<t.cost?'<div class="note">Not enough cash. There are no consumer loans on this track.</div>':''}`,
      acts:[{label:`Invest ${fmt(t.cost)}`,cls:'primary',disabled:own||p.cash<t.cost,fn:go},{label:'Skip',fn:endTurn}],bot:()=>!own&&p.cash>=t.cost?go():endTurn()});}
  if(t.t==='tech')return ftTech(p,t);
  if(t.t==='ipo')return ftIPO(p);
  if(t.t==='kcn')return ftKCN(p,t);
  if(t.t==='inspect')return ftInspect(p);
  if(t.t==='golf')return ftGolf(p);
  if(t.t==='fun')return ftFun(p);
  if(t.t==='legacy')return ftLegacy(p);
  if(['law','crash','fraud','lawsuit','audit','divorce'].includes(t.t))return ftHazard(p,t.t);
  if(t.t==='dream'){const d=G.dreams[t.slot],mine=t.slot===p.dream,dc=mine?dreamCost(p):d.c;const okL=S(p).legacy>=legacyNeed(),buy=()=>{p.cash-=dc;closeModal();renderHUD();win(p,`Dream purchased “${d.n}”, Legacy ${S(p).legacy}.`);};
    return openModal({tone:'ft',eyebrow:'Dream',title:esc(d.n),art:art(DREAM_ART[d.a||0]),body:`<p>Price ${fmt(dc)}${mine&&dc>d.c?` (base price ${fmt(d.c)} + an upkeep, tax and running fund worth 3 starting paydays)`:''}. ${mine?(p.cash>=dc?('This is your dream and you can afford it!'+(okL?'':` But your Legacy is only ${S(p).legacy}/${legacyNeed()}: the rich are only remembered for what they build; give more.`)):'This is your dream, but you can’t afford it yet.'):'This is someone else’s dream.'}</p>`,
      acts:[...(mine?[{label:`Buy the dream ${fmt(dc)}`,cls:'primary',disabled:p.cash<dc||!okL,fn:buy}]:[]),{label:mine?'Later':'Xong',fn:endTurn}],bot:()=>mine&&p.cash>=dc&&okL?buy():endTurn()});}
  if(t.t==='charity'){const big=Math.round(Math.max(0,p.cash)*.1/TY)*TY;const give=(amt,lg)=>{p.cash-=amt;addS(p,{luck:20,happy:8,legacy:lg},'Donate '+fmt(amt));log(`Charity ${fmt(amt)}: Legacy +${lg}`,p);endTurn();};
    if(big>TY)return openModal({tone:'charity',eyebrow:'Charity',title:'Community charity fund',art:art('charity'),body:`<p>The rich are remembered for what they give. Donate $400k: Luck +20, Legacy +8. Donating 10% of cash (${fmt(big)}): Luck +20, Legacy +20.</p>`,acts:[{label:`10% of cash · ${fmt(big)}`,cls:'primary',fn:()=>give(big,20)},{label:'Donate $400k',fn:()=>give(TY,8)},{label:'No',fn:endTurn}],bot:()=>give(big,20)});
    const giveOne=()=>give(TY,8);
    return openModal({tone:'charity',eyebrow:'Charity',title:'Community charity fund',art:art('charity'),body:'<p>Donate $400k to build a school for children in remote areas: Luck +20. When Luck reaches 80, your next roll’s total is doubled.</p>',
      acts:[{label:'Donate $400k',cls:'primary',disabled:p.cash<TY,fn:giveOne},{label:'No',fn:endTurn}],bot:()=>p.cash>3*TY?giveOne():endTurn()});}
  endTurn();
}

/* ================= setup ================= */
let draft=[],draftMode='easy',draftScen='normal',draftQuiz=true;
function profNet(pr){const p={salary:T(pr.sal),rent:T(pr.rent),living:T(pr.liv),childPer:T(pr.ch),kids:0,kidAges:[],loan:0,dep:0,parentCare:0,sides:[],schoolPrem:0,risk:0,assets:[],liabs:Object.values(pr.L).map(v=>({pay:T(v[1])}))};return calc(p).cashflow;}
function showSetup(resume){
  const s=$('#setup');s.hidden=false;
  if(!G||!G.dreams)G={dreams:[...DREAMS].sort(()=>Math.random()-.5).slice(0,4)};
  const dreams=G.dreams;
  if(!draft.length)setCount(2);
  const render=()=>{s.innerHTML=`<div class="setup-in"><span class="lbl" style="color:var(--gold);margin:0">A financial game · Global</span><div class="logo">Cash to <em>Freedom</em></div>
    <div class="mascot">${CHICKEN_SVG(1.4)}<p><b>Golden Rooster</b> hello! People say “a lame chicken circles the mill”: a whole life running around salary and bills. To escape the Grind Mill, you must know what is an asset and what is a liability. I’ll advise you, but only a few times.</p></div>
    <p class="lede">Two rounds: <b>Worker</b>, where you work, get 4 months of salary each turn and buy assets that create passive income; then <b>Prosperity Track</b>, where you invest big to reach your dream.</p>

    <span class="lbl">Ledger</span><div class="seg"><button class="${draftQuiz?'on':''}" data-quiz="1" style="font-family:var(--f-body);font-size:12px">On: classify assets, debts, income and expenses yourself</button><button class="${draftQuiz?'':'on'}" data-quiz="0" style="font-family:var(--f-body);font-size:12px">Off</button></div>
    <span class="lbl">Scenario</span><div class="seg">${Object.entries(SCENARIOS).map(([k,sc])=>`<button class="${draftScen===k?'on':''}" data-scen="${k}" style="font-family:var(--f-body);font-size:12px">${sc.n}</button>`).join('')}</div><p class="lede" style="margin-top:-8px;font-size:12px">${SCENARIOS[draftScen].d}</p>

    ${draft.map((d,i)=>{const pr=PROFS[d.prof],net=profNet(pr);return `<div class="pcard"><button class="avatar" data-char="${i}" aria-label="Choose zodiac and color">${badgeHTML(d.zod,d.col,62)}<span>SWAP</span></button><div style="min-width:0">
      <input id="pname${i}" value="${esc(d.name)}" maxlength="16" aria-label="Player name ${i+1}">
      <div class="meta"><button class="pill ${d.bot?'botpill':''}" data-bot="${i}">${d.bot?'Autoplay':'Player'} ⇄</button>${d.bot?`<button class="pill botpill" data-lvl="${i}">${BOT_LVL[d.botLvl].n} ↻</button>`:''}<button class="pill pickpill" data-prof="${i}">Career: <b>${pr.n}</b> ▾</button><span class="pill">${draftScen==='grad'?22:pr.age} y/o</span><span class="pill">Salary <b>${fmt(T(pr.sal))}</b></span><span class="pill">Surplus/month <b>${sgn(net)}</b></span><button class="pill pickpill" data-dream="${i}">Dream: <b>${esc(DREAMS[d.dreamId].n)}</b> ▾</button></div></div></div>`;}).join('')}
    <button class="btn primary" id="startBtn" style="width:100%;margin-top:10px">Start a new game</button>
    ${onlineReady()?'<button class="btn" id="onlineBtn" style="width:100%;margin-top:8px">Play online · find friends to play</button>':''}
    <div class="howto"><b>Quick how-to.</b> Each turn is 4 months: you get paid, pay expenses, then roll the dice. Tile <b>Opportunity</b> let you buy assets; every deal has a cash-flow and yield sheet. Tile <b>Mid-year bonus</b> and <b>Year-end bonus</b> extra money when passing. When passive income exceeds total expenses, you move to <b>Prosperity Track</b>. Tap <b>?</b> to see the full rules.</div></div>`;};
  render();

    else if(b.id==='onlineBtn'){showOnline();}
    else if(b.id==='resumeBtn'){G=resume;s.hidden=true;boardFromState();G.phase='busy';afterEvents(curP());}

      G.players=draft.map((d,i)=>newPlayer(i,d,PROFS[d.prof],d.name.trim()||`Player ${i+1}`,draftScen));
      G.players.forEach(p=>log(`Start ${Math.floor(p.age)} y/o: ${p.prof}, salary ${fmt(p.salary)}, cash ${fmt(p.cash)}`,p));draft=[];s.hidden=true;ensureAudio();boardFromState();
      G.phase='busy';afterEvents(curP());}
  };

function pickProf(i,done){const d=draft[i],inl=PROFS.map((pr,k)=>()=>{d.prof=k;closeViewer();done();});

  <h3>Two rounds</h3><ul><li><b>Round 1 – Worker</b> (inner ring): work, get paid, pay expenses, buy assets. Complete when <b>passive income exceeds total expenses</b> monthly.</li><li><b>Round 2 – Prosperity Track</b> (outer ring): wins by buying a dream or increasing Payday by ${fmt(ftGoal())}.</li></ul>
  <h3>Mode</h3><ul><li><b>Easy</b>: to learn the game. No inflation, better deals, cash <i>Hint</i> whether to buy or not, consumer loans at 1%/month.</li><li><b>Hard</b>: like real life. 3.5% inflation/years, uncertain raises, boom – freeze cycles, floating interest rates, expiring teaser rates, scams, illness, kids’ school and university, sick parents, retirement at 60 (pension 55%), game ends at age 70.</li></ul>

  <h3>Time and salary</h3><ul><li>Each turn = <b>4 months</b>. At the start of the turn you automatically get <b>4 months of salary</b>, pay taxes, insurance and all expenses; your payslip shows how much is left.</li><li>Corner tile <b>SALARY</b> is the payday mark. Tile <b>Mid-year bonus</b> and <b>Year-end bonus</b> pays a bonus when passing or landing here.</li><li>Each year: raises, inflation, kids grow a year older, new economic news.</li></ul>
  <h3>Tiles</h3><ul><li><b>Opportunity</b>: small or big opportunities. You can <b>give away</b> to someone else for a 5% fee, or <b>invite to co-invest 50/50</b>.</li><li><b>Market</b>: buyers pay the current market price, interest rates or stock prices change. Applies to everyone in round 1.</li><li><b>Doodad</b>: unexpected spending, illness, or <b>choice card</b> (friend’s wedding, lending money, master’s degree, buying a car, insurance…).</li><li><b>Charity</b>: donate 10% of income, Luck +15. When Luck reaches 80, your next dice roll is <b>double the dice</b> (used up 30 Luck points).</li><li><b>Baby</b>: up to 3 kids. Expenses rise but you get a family deduction.</li><li><b>Laid off</b>: skip 1 turn (Easy) or 2 turns (Hard), get only 60% unemployment benefit in the first turn.</li></ul>
  <h3>Money and debt</h3><ul><li><b>Borrow to buy assets</b>: choose loan ratio; payments use real interest rates and terms, the balance declines over time.</li><li><b>Consumer loan</b>: automatically when short of cash, in multiples of $4,000, limit 15 months of salary.</li><li><b>Bank savings</b>: 5% interest/year, counts as passive income, auto-withdrawn when short of cash.</li><li><b>Rental tax</b>: 10% of revenue when total rent exceeds $40,000/year.</li><li><b>Connections</b>: wedding gifts, lending to friends… give connection points; next Opportunity shows 2 deals.</li><li><b>Bankrupt</b>: when the credit limit is exhausted, assets are fire-sold at 50%; if still short, lose 2 turns and personal debt is halved.</li></ul>
  <h3>Ledger – the philosophy of the game</h3><ul><li>After every asset purchase or loan, you <b>drag and drop</b> each item into the right column: <b>Assets</b> (put money in your pocket), <b>Liabilities & Debt</b> (takes money out of your pocket), <b>Income</b>, <b>Expenses</b>.</li><li>Wrong placements bounce back with an explanation; you must place all correctly to continue. Correct on the first try earns +1 financial knowledge point; every 3 points earn +1 connection and +1 Golden Rooster question.</li><li>Once you reach financial freedom, you are considered to have mastered it: the ledger turns off. In later games, the same player name only sees it occasionally for review.</li><li>In Hard mode, the game doesn’t label "good deal/bad": you read cash flow and yield yourself and decide to buy, hold or sell.</li></ul>

  <h3>Golden Rooster – advisor</h3><ul><li>Tap <b>Ask the Golden Rooster</b> on the card to hear whether to buy, hold or sell; tap the chicken icon in the bottom bar for a financial checkup.</li><li>Questions are limited: Easy 10, Hard 3. Classify the ledger correctly 3 times to earn 1 more.</li><li>At the end, the Golden Rooster <b>PRO advice</b>: the strengths and weaknesses of your investing style.</li></ul>

  <p class="lesson">Prices, dividends and projects in the game are simulated for learning, not investment advice.</p></div>`});
}

/* ================= Ghi sổ: người chơi tự phân loại tài sản, tiêu sản, thu nhập, chi phí ================= */
const COLS={asset:{n:'Assets',d:'Puts money INTO your pocket',c:'#4fd18b'},liab:{n:'Liabilities & Debt',d:'Takes money OUT of your pocket',c:'#ff6b6b'},income:{n:'Income',d:'Monthly cash inflow',c:'#5aa9ff'},expense:{n:'Expenses',d:'Monthly cash outflow',c:'#e9b949'}};
function quizItemsForAsset(A,R){const L=[];
  if(A.type==='stock')return [{t:`${A.shares} stocks ${A.sym}`,ans:['asset'],why:'Dividend stocks are assets: they put money in your pocket.'},{t:`Dividend ${fmt(A.shares*STOCKS[A.sym].div*(1-DIV_TAX)/12)}/month`,ans:['income'],why:'Dividends are passive income.'}];
  if(A.type==='bond')return [{t:`${A.units} bond lot ${A.issuer}`,ans:['asset'],why:'Bonds paying regular interest are assets.'},{t:`Bond interest ${fmt(A.units*A.face*A.coupon*(1-BOND_TAX)/12)}/month`,ans:['income'],why:'Bond interest is passive income.'}];
  if(A.type==='gold')return [{t:`${A.qty} gold coin`,ans:['asset'],why:'Gold is an asset (holds value), even though it creates no cash flow.'}];
  L.push({t:`${A.name} (${fmt(A.price)})`,ans:['asset'],why:A.kind==='land'?'Land is an asset, but it creates no cash flow; profit only when sold at a good price.':'Rental or profitable business assets put money in your pocket.'});
  if(R.loan)L.push({t:`Bank loan ${fmt(R.loan)}`,ans:['liab'],why:'A loan is debt: you must repay principal and interest.'});
  if(A.type==='re'&&A.rent)L.push({t:`Rent received ${fmt(A.rent*(1-A.opex))}/month`,ans:['income'],why:'Rent is passive income.'});
  if(A.type==='biz'&&A.profit)L.push({t:`Business profit ${fmt(A.profit)}/month`,ans:['income'],why:'Profit from businesses you own is passive income.'});
  if(R.pmtM)L.push({t:`Bank installments ${fmt(R.pmtM)}/month`,ans:['expense'],why:'Monthly installments are cash outflow.'});
  return L;}
function quizItemsForLiab(name,down,bal,payM){const L=[{t:name,ans:['liab'],why:'Consumer goods lose value over time and cost money: that’s a liability, not an asset.'}];
  if(bal)L.push({t:`Installment ${fmt(bal)}`,ans:['liab'],why:'Installments are debt.'});if(payM)L.push({t:`Installments ${fmt(payM)}/month`,ans:['expense'],why:'Monthly payments are cash outflow.'});return L;}
function introItems(p){const L=[{t:`Salary ${fmt(p.salary)}/month`,ans:['income'],why:'Salary is active income: stop working and it stops.'},{t:`Living costs ${fmt(p.living)}/month`,ans:['expense'],why:'Food, utilities and transport are expenses.'}];
  if(p.rent)L.push({t:`Rent ${fmt(p.rent)}/month`,ans:['expense'],why:'Rent is a monthly expense.'});
  const h=p.liabs.find(l=>l.key==='home');if(h)L.push({t:'The home you live in (still owes the bank)',ans:['liab'],why:'The home you live in doesn’t put money in your pocket, it takes money out every month (installments, repairs), so it’s a liability.'});
  const m=p.liabs.find(l=>l.key==='moto'||l.key==='car');if(m)L.push({t:m.key==='car'?'The car on installments':'The scooter on installments',ans:['liab'],why:'A vehicle for commuting loses value and costs money: a liability.'});
  const c=p.liabs.find(l=>l.key==='card');if(c)L.push({t:`Credit card balance ${fmt(c.bal)}`,ans:['liab'],why:'Credit card balances are debt with very high interest.'});
  L.push({t:`Bank savings deposits`,ans:['asset'],why:'Interest-bearing deposits are assets.'});return L;}
/* người đã tự do tài chính (trong ván này hoặc ván trước) đã nắm khái niệm: bỏ hoặc giảm ghi sổ */
function mastered(p){try{return (JSON.parse(localStorage.getItem('dongtien3d.mastered')||'[]')).includes(p.name);}catch(e){return false;}}
function setMastered(p){try{const l=JSON.parse(localStorage.getItem('dongtien3d.mastered')||'[]');if(!l.includes(p.name)){l.push(p.name);localStorage.setItem('dongtien3d.mastered',JSON.stringify(l));}}catch(e){}}
function quizThen(p,items,cont){if(p.bot||!G.quiz||!items||!items.length||p.ft||p.freeAge)return cont();if(mastered(p)&&Math.random()>.2)return cont();ledgerQuiz(p,items,cont);}
function ledgerQuiz(p,items,cont,intro){
  /* phải xếp đúng hết mới được đi tiếp: khoản sai bị trả về hàng chờ kèm lời giải thích */
  const place=items.map(()=>null),locked=items.map(()=>false),wrong=new Set();let sel=null,tries=0,done=false;
  const render=()=>{const zones=Object.entries(COLS).map(([k,c])=>`<div class="lzone" data-zone="${k}" style="--zc:${c.c}"><b>${c.n}</b><small>${c.d}</small><div class="lz-in">${items.map((it,i)=>place[i]===k?chip(it,i):'').join('')}</div></div>`).join('');
    const pool=items.map((it,i)=>place[i]?'':chip(it,i)).join('');
    const left=items.filter((it,i)=>!locked[i]).length;
    const msg=done?`<div class="note" style="color:var(--text)"><b class="pos">Correct!</b> ${tries===1?'Correct on the first try: +1 financial knowledge point.':`You fixed it correctly after ${tries} checks.`}</div>`
      :tries?`<div class="note"><b class="neg">Left ${left} items misplaced.</b> Read the hint below, then drag it to the right column.<ul class="whys">${[...wrong].filter(i=>!locked[i]).map(i=>`<li class="neg">${esc(items[i].t)}: ${hintOf(items[i])}</li>`).join('')}</ul></div>`:'';
    openModal({tone:'payday',eyebrow:intro?'First lesson · Ledger':'Financial ledger',title:intro?`${esc(p.name)}, classify your financial situation`:'You just got a new item. Which column does it belong in?',
      body:`<p class="lesson" style="margin-top:0">${intro?'The rich buy assets. The poor and middle class buy liabilities they think are assets. ':''}Drag each card to the right column, or tap a card then tap a column. You must place all correctly to continue.</p>
      ${msg}<div class="lpool">${pool||(done?'':'<small style="color:var(--muted)">All placed. Tap Check.</small>')}</div><div class="lzones">${zones}</div>
      ${done?`<ul class="whys">${items.map(it=>`<li class="pos">${esc(it.t)} → <b>${COLS[it.ans[0]].n}</b>. ${it.why}</li>`).join('')}</ul>`:''}`,
      acts:done?[{label:'Continue',cls:'primary',fn:()=>{closeModal();cont();}}]:[{label:'Check',cls:'primary',disabled:place.some(x=>!x),fn:check}]});
    wire();};
  const hintOf=it=>it.why;
  const check=()=>{tries++;let allOk=true;items.forEach((it,i)=>{if(locked[i])return;if(it.ans.includes(place[i]))locked[i]=true;else{allOk=false;wrong.add(i);place[i]=null;}});
    if(tries===1){p.quizN=(p.quizN||0)+1;if(allOk){p.fq=(p.fq||0)+1;if(p.fq%3===0){p.net++;p.hints=hintsLeft(p)+1;toast(`${p.name}: good financial knowledge, +1 connection, +1 Golden Rooster question`,'pos');}if(p.fq>=10)p.ach.fq=p.ach.fq||G.turn;}}
    if(allOk){done=true;sfx('cash');log(`Ledger: complete after ${tries} checks`,p);}else sfx('pay');sel=null;render();};
  const chip=(it,i)=>`<button class="lchip ${sel===i?'sel':''} ${locked[i]?'ok':wrong.has(i)?'bad':''}" data-chip="${i}" ${locked[i]||done?'disabled':''}>${esc(it.t)}</button>`;
  const wire=()=>{const root=$('#modal .sheet');if(!root||done)return;
    root.querySelectorAll('.lzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.lchip'))return;if(sel!=null){place[sel]=z.dataset.zone;sel=null;render();}});
    root.querySelectorAll('.lchip:not([disabled])').forEach(c=>{const i=+c.dataset.chip;
      c.onpointerdown=e=>{e.preventDefault();const r=c.getBoundingClientRect(),ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';document.body.appendChild(ghost);
        let moved=false;const mv=ev=>{moved=moved||Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>6;ghost.style.left=(ev.clientX-r.width/2)+'px';ghost.style.top=(ev.clientY-20)+'px';
          root.querySelectorAll('.lzone').forEach(z=>z.classList.toggle('over',z===document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.lzone')));};
        const upf=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);ghost.remove();
          if(moved){const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.lzone');if(z){place[i]=z.dataset.zone;sel=null;}render();}
          else{if(place[i]){place[i]=null;sel=i;}else sel=sel===i?null:i;render();}};
        mv(e);addEventListener('pointermove',mv);addEventListener('pointerup',upf);};});};
  render();
}

const HINTS={easy:10,hard:3};
const CHICKEN_SVG=(s=1)=>`<svg viewBox="0 0 64 64" width="${44*s}" height="${44*s}" aria-hidden="true"><defs><radialGradient id="gch" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#d99a1e"/></radialGradient></defs><ellipse cx="34" cy="40" rx="20" ry="16" fill="url(#gch)"/><circle cx="20" cy="22" r="11" fill="url(#gch)"/><path d="M14 12 q3 -8 6 -1 q3 -8 6 0 q3 -6 4 2" fill="#e8423f"/><path d="M9 22 l-7 3 l7 3z" fill="#ff9f43"/><circle cx="17" cy="20" r="2" fill="#1b2a44"/><path d="M30 38 q10 -10 18 2 q-8 8 -18 -2z" fill="#e0a52a"/><path d="M50 30 q10 -6 10 6 q-6 -2 -10 2z" fill="#e8423f"/><path d="M28 55 v6 M38 55 v6" stroke="#ff9f43" stroke-width="3" stroke-linecap="round"/><path d="M12 30 q-2 6 3 6" fill="#e8423f"/></svg>`;
let adviceTitle=null;
function hintsLeft(p){if(p.pro)return 99;if(p.hints==null)p.hints=HINTS[G.mode]||3;return p.hints;}
function useHint(p){if(p.pro){chickenHop();sfx('cash');return true;}if(hintsLeft(p)<=0)return false;p.hints--;p.st=p.st||{};p.st.hint=(p.st.hint||0)+1;chickenHop();sfx('cash');return true;}
function adviceBox(html){return `<div class="advice">${CHICKEN_SVG(1)}<div><b>Golden Rooster:</b> ${html}</div></div>`;}
/* lời khuyên cho từng loại thẻ */
function adviseDeal(p,d){
  const cyc=G.cyc||{land:'normal',re:'normal',stock:'normal'};
  if(d.k==='scam')return 'This is <b>scam</b>. Promised 4–5% interest/month (50–60%/year) no real business can pay that. The money paid to you at first is just the money of those who joined later. Decline.';
  if(d.k==='side')return p.sides.length>=2?'You already have 2 side jobs.':tier(p)>=2?'You have decent capital now. Spend your time finding bigger opportunities rather than side jobs.':'Take it. At this stage capital is what you lack most. But remember: this is active income, use it to buy assets.';
  if(d.k==='gold'||d.k==='crypto')return `${d.k==='gold'?'Gold':'Bitcoin'} does not create cash flow, so it won’t help you escape the Grind Mill. Only buy with spare cash, at most 5–10% of your wealth, once you have an emergency fund and cash-flowing assets.`;
  if(d.k==='bond')return d.b.risk==='High'?`Interest ${pct(d.b.c)} high because the company is risky (real estate). If you buy, use only a small part of spare cash. Low-risk bonds yield ${pct(BONDS[0].c)} still better than savings ${pct(DEP_RATE,0)}.`:`Risk ${d.b.risk.toLowerCase()}, interest ${pct(d.b.c)} higher than savings ${pct(DEP_RATE,0)}. Good for parking spare cash while waiting for a big opportunity. Don’t take 18% consumer loans/years to buy 10% bonds/year.`;
  if(d.k==='stock'){const S=STOCKS[d.sym],dy=S.div/d.price,pe=d.price/S.eps,h=p.assets.find(a=>a.type==='stock'&&a.sym===d.sym);let t='';
    if(h){const g=d.price*(1-STK_FEE-STK_TAX)/h.cost-1;t+=g>=.3?`You’re in profit ${pct(g,0)} with ${d.sym}: <b>should take profit</b> to have capital to buy cash-flowing assets. `:g<-.2?`You’re at a loss ${pct(-g,0)}. If the business is still good (steady dividend), hold for a rebound; don’t panic sell. `:'Gain or loss not significant yet, you can hold. ';}
    if(d.sym==='HYPE')return t+'HYPE is a speculative stock, no profit, no dividends. Stay away.';
    t+=dy>=.05?`Dividend yield ${pct(dy)}/year, higher than savings: <b>can buy</b> to receive cash flow.`:d.price<=d.ref*.8?`Price below reference ${pct(1-d.price/d.ref,0)}${cyc.stock==='bust'?' while the market is frozen':''}: you could buy and wait to sell on a rebound.`:pe>20?`P/E ${trimNum(pe,1)} rather expensive, low dividend. Don’t buy now.`:'Fair price but not attractive. You can skip it.';
    return t+(p.loan?' Note: you have 18% consumer-loan debt/year, paying off debt first beats buying stocks.':'');}
  if(d.k==='prop'){const a=d.a;
    if(a.kind==='land')return `Land creates no cash flow and costs interest if borrowed. The land market is <b>${CYC_LABEL[cyc.land].toLowerCase()}</b>. ${cyc.land==='bust'?'A freeze is the time to buy cheap, if you have spare cash and can wait for years.':cyc.land==='boom'?'Booming: buying now risks buying the top.':'Only buy with spare cash, no loans.'}`;
    if(a.kind==='startup')return 'A startup may be a total loss or 10x. Only invest what you can afford to lose.';
    let best=null;for(const x of d.ltvs){const R=analyze(a,x),L=needLoan(p,Math.max(0,R.equity-p.dep));if(p.loan+L>loanCap(p))continue;const real=Math.min(R.cf,R.cfAfter)-L*clr(),coc=R.equity?real*12/R.equity:0;if(!best||real>best.real)best={x,real,coc,R,L};}
    if(!best)return 'You can’t afford this deal. Skip it and save more.';
    const teaser=a.teaser?` Teaser rate note: after ${a.teaser.months} months, cash flow still <b>${sgn(analyze(a,best.x).cfAfter)}</b>/month.`:'';
    if(best.real<=0)return `<b>Don’t buy.</b> At every loan level, real cash flow is negative (best ${sgn(best.real)}/month). This asset will take money out of your pocket every month.${teaser}`;

async function joinRoom(id,quiet){const ref=FB.db.collection('rooms').doc(id);

    roomData={id,...r};tx.update(ref,{members:[...r.members,ME.uid],seats:[...r.seats,mySeat()],updated:now()});});

async function startOnlineGame(){const r=roomData;const ids=[...new Set(r.seats.map(s=>s.dreamId))];while(ids.length<4){const k=Math.floor(Math.random()*DREAMS.length);if(!ids.includes(k))ids.push(k);}

const TURN_LIMIT=90,AFK_MAX=3;

function turnClock(){if(!isOnline()||!G.players||!curP()||!G.turnAt||curP().bot){if(turnPill)turnPill.hidden=true;return;}
  if(!turnPill){turnPill=document.createElement('div');turnPill.id='turnPill';turnPill.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 30px);z-index:60;padding:4px 12px;border-radius:999px;font:700 13px var(--f-mono,monospace);background:#0f1a2e;border:1px solid var(--line);color:#fff;pointer-events:none';document.body.appendChild(turnPill);}
  const left=Math.max(0,Math.ceil(TURN_LIMIT-(Date.now()-G.turnAt)/1000)),mine=iControl();turnPill.hidden=false;
  turnPill.textContent=`⏱ ${left}s · ${mine?'your turn':'turn: '+curP().name}`;turnPill.style.borderColor=left<=15?'#ff4d4d':'var(--line)';turnPill.style.color=left<=15?'#ffb3b3':'#fff';
  if(mine&&left<=10&&warned!==G.turnAt){warned=G.turnAt;toast('10 seconds left! When time runs out a bot plays this turn','neg');sfx('pay');}
  if(ME&&G.online.host===ME.uid&&!G.takeover&&left<=0&&Date.now()-G.turnAt>(TURN_LIMIT+4)*1000)takeover();}

  toast(p.tmpBot?`${p.name} ran out of time, a bot plays this turn`:`${p.name} ran out of time ${AFK_MAX} times, a bot plays from now on`,'neg');log(p.tmpBot?'Time’s up, a bot played this turn':'Timed out too often, a bot plays from now on',p);
  closeModal();closeViewer();if(G.phase==='roll'){save();roll(p.ft?(p.charity>0?3:2):(p.charity>0?2:1),true);}else endTurn();}

let sndMode='all';try{const m=localStorage.getItem('dongtien3d.snd');if(SND_MODES.includes(m))sndMode=m;}catch(e){}

function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}

/* ================= 3D: materials & models ================= */
const std=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.4,metalness:.15,...o});
const goldM=std('#e9b949',{metalness:.9,roughness:.25}),darkM=std('#14182a',{roughness:.5}),whiteM=std('#f4f1ea',{roughness:.5}),glassM=std('#9fd2ff',{metalness:.6,roughness:.1});
function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;return m;}
function heartShape(s){const h=new THREE.Shape();h.moveTo(0,-s*.9);h.bezierCurveTo(-s*1.1,-s*.2,-s*1.1,s*.6,-s*.5,s*.75);h.bezierCurveTo(-s*.2,s*.85,0,s*.6,0,s*.45);h.bezierCurveTo(0,s*.6,s*.2,s*.85,s*.5,s*.75);h.bezierCurveTo(s*1.1,s*.6,s*1.1,-s*.2,0,-s*.9);return h;}
function starShape(R,r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,rr=i%2?r:R;i?s.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):s.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}s.closePath();return s;}
const ext=(shape,d)=>{const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.015,bevelSize:.015,bevelSegments:2,curveSegments:10});g.center();return g;};
function coinTex(){return tex(256,256,(x,w,h)=>{const g=x.createRadialGradient(w*.4,h*.4,10,w/2,h/2,w*.6);g.addColorStop(0,'#ffe9a8');g.addColorStop(1,'#c99328');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#a87818';x.lineWidth=14;x.beginPath();x.arc(w/2,h/2,w*.4,0,7);x.stroke();x.fillStyle='#8a5f10';x.font='800 150px "Be Vietnam Pro",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('$',w/2,h/2+8);});}
let coinFaceM=null;
function bigCoin(r){const g=new THREE.CylinderGeometry(r,r,r*.22,40);return new THREE.Mesh(g,[goldM,coinFaceM,coinFaceM]);}

/* tile icons */
function makeIcon(type){
  const g=new THREE.Group();
  if(type==='opp'){g.add(mesh(ext(starShape(.2,.09),.07),std('#5ee39a',{emissive:'#1a6b40',emissiveIntensity:.4,metalness:.4})));}
  else if(type==='market'){const m=std('#6db4ff',{metalness:.4});[[.09,-.1],[.17,0],[.26,.1]].forEach(([h,x])=>g.add(mesh(new THREE.BoxGeometry(.075,h,.075),m,x,h/2-.13,0)));const ar=mesh(new THREE.ConeGeometry(.05,.09,4),goldM,.16,.12,0);ar.rotation.z=-.8;g.add(ar);}

function celebrateTile(p){if(!p)return;const [x,,z]=tileXYZ(p);let ic=null,bd=.6;icons.forEach(m=>{const d=Math.hypot(m.position.x-x,m.position.z-(z-.2));if(d<bd){bd=d;ic=m;}});if(!ic)return;
  const s0=ic.scale.x,y0=ic.userData.y0;ic.userData.busy=true;
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,2.6,24,1,true),beamMat.clone());beam.material.color.set(p.color||'#ffe08a');beam.position.set(x,1.2,z);scene.add(beam);
  const halo=typeof glow==='function'?glow(p.color||'#ffe08a',2.2,1):null;if(halo){halo.position.set(ic.position.x,y0+.3,ic.position.z);scene.add(halo);}
  const pl=new THREE.PointLight(p.color||'#ffe08a',1.6,2.6);pl.position.set(x,.9,z);scene.add(pl);
  tween(1500,k=>{const up=Math.sin(Math.min(1,k*1.4)*Math.PI);ic.position.y=y0+up*.45;ic.rotation.y+=.25*(1-k);const sc=s0*(1+up*.7);ic.scale.set(sc,sc,sc);

  .then(()=>{ic.scale.setScalar(s0);ic.position.y=y0;ic.userData.busy=false;scene.remove(beam);if(halo)scene.remove(halo);scene.remove(pl);});}

function roundedGeo(size,h,r){const a=size/2,s=new THREE.Shape();s.moveTo(-a+r,-a);s.lineTo(a-r,-a);s.quadraticCurveTo(a,-a,a,-a+r);s.lineTo(a,a-r);s.quadraticCurveTo(a,a,a-r,a);s.lineTo(-a+r,a);s.quadraticCurveTo(-a,a,-a,a-r);s.lineTo(-a,-a+r);s.quadraticCurveTo(-a,-a,-a+r,-a);
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:3,curveSegments:6});g.rotateX(-Math.PI/2);return g;}

function perim(N,i){const s=N-1,h=s/2,side=Math.floor(i/s),k=i%s;if(side===0)return [-h+k,h];if(side===1)return [h,h-k];if(side===2)return [h-k,-h];return [-h,-h+k];}
function shade(hex,f){const c=new THREE.Color(hex);c.multiplyScalar(f);return '#'+c.getHexString();}
function fitFont(x,text,weight,max,maxW,family){let s=max;do{x.font=`${weight} ${s}px ${family}`;s-=4;}while(x.measureText(text).width>maxW&&s>20);return s+4;}
function satur(hex,sat,light){const c=new THREE.Color(hex),h={};c.getHSL(h);c.setHSL(h.h,Math.min(1,h.s*sat),Math.min(.9,h.l*light));return '#'+c.getHexString();}
function tileTex(col,lines,sub,gold){return tex(512,512,(x,w,h)=>{

  x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(w*.5,h*.22,w*.36,0,7);x.fill();
  x.strokeStyle=gold?'rgba(255,215,120,.9)':'rgba(255,255,255,.4)';x.lineWidth=gold?14:9;x.strokeRect(18,18,w-36,h-36);

    x.fillStyle='#ffe28a';const s2=fitFont(x,sub,700,80,w-60,'"JetBrains Mono",monospace');x.fillText(sub,w/2,h*.86);}
  else{const sz=Math.min(...lines.map(t=>fitFont(x,t,800,lines.length>1?118:128,w-56,fam)));x.font=`800 ${sz}px ${fam}`;
    const y0=lines.length>1?h*.6:h*.72;lines.forEach((t,i)=>x.fillText(t,w/2,y0+i*sz*1.02));}
});}

  if(u.cloud){o.position.y=1.7+Math.sin(u.life*2)*.05;const pa=u.rain.geometry.attributes.position;for(let j=0;j<pa.count;j++){let y=pa.getY(j)-dt*2.2;if(y<-1.4)y=0;pa.setY(j,y);}pa.needsUpdate=true;o.children.forEach(ch=>{if(ch.material)ch.material.opacity=Math.min(.92,(1-k)*3);});}
  else if(u.spark){const pa=o.geometry.attributes.position;for(let j=0;j<pa.count;j++){u.vel[j].y-=4*dt;pa.setXYZ(j,pa.getX(j)+u.vel[j].x*dt,pa.getY(j)+u.vel[j].y*dt,pa.getZ(j)+u.vel[j].z*dt);}pa.needsUpdate=true;o.material.opacity=1-k;}
  else{o.position.y+=u.vy*dt;o.position.x+=Math.sin(u.life*3+u.sway)*dt*.5;o.rotation.x+=u.spin.x*dt;o.rotation.y+=u.spin.y*dt;if(o.position.y<.15){o.position.y=.15;u.vy=0;u.spin.multiplyScalar(.9);}o.material.opacity=Math.min(1,(1-k)*3);}
  if(k>=1){scene.remove(o);fxList.splice(i,1);}}}

  add(rm,[-.757,13.219,.717],0,[31.713,28.305,28.591]);
  [[[-10.906,2.009,1.846],-.195,[2.328,7.905,4.651]],[[-5.607,-.754,-.758],.994,[1.97,1.534,3.955]],[[6.167,.857,7.803],.561,[3.927,6.285,3.687]],[[-2.017,.018,6.124],.333,[2.002,4.566,2.064]],[[2.291,-.756,-2.621],-.286,[1.546,1.552,1.496]],[[-2.193,-.369,-5.547],.516,[3.875,3.487,2.986]]].forEach(([p,r,s])=>add(bm,p,r,s));
  const al=i=>{const m=new THREE.MeshBasicMaterial();m.color.setScalar(i);return m;};
  [[50,[-16.116,14.37,8.208],[.1,2.428,2.739]],[50,[-16.109,18.021,-8.207],[.1,2.425,2.751]],[17,[14.904,12.198,-1.832],[.15,4.265,6.331]],[43,[-.462,8.89,14.52],[4.38,5.441,.088]],[20,[3.235,11.486,-12.541],[2.5,2,.1]],[100,[0,20,0],[1,.1,1]]].forEach(([i,p,s])=>add(al(i),p,0,s));

  for(let k=0;k<6;k++){const cx=Math.random()*w,cy=Math.random()*h;for(let r=4;r<38;r+=5){x.strokeStyle='rgba(25,12,5,.12)';x.lineWidth=2;x.beginPath();x.ellipse(cx,cy,r*2.2,r,0,0,7);x.stroke();}}});

function glow(color,size,op=.7){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending}));s.scale.set(size,size,size);return s;}

  tween(2600,k=>{const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;theta=a.th+(th0-a.th)*e;phi=a.ph+(ph0-a.ph)*e;zoom=a.z+(z0-a.z)*e;});}

const rippleMat=new THREE.MeshBasicMaterial({color:'#fff6d8',transparent:true,opacity:.8,depthWrite:false});
function ripple(pos,color){const r=new THREE.Mesh(new THREE.TorusGeometry(.3,.02,8,40),rippleMat.clone());r.material.color.set(color||'#fff6d8');r.rotation.x=-Math.PI/2;r.position.set(pos.x,pos.y+.03,pos.z);scene.add(r);
  tween(650,k=>{const s=1+k*2.2;r.scale.set(s,s,s);r.material.opacity=.8*(1-k);}).then(()=>scene.remove(r));}
function flashTile(pos){let best=null,bd=.3;tileGroup.children.forEach(m=>{if(!m.userData.desc)return;const d=Math.hypot(m.position.x-pos.x,m.position.z-pos.z);if(d<bd){bd=d;best=m;}});
  if(!best||!Array.isArray(best.material))return;const mat=best.material[0];const e0=mat.emissive.clone(),i0=mat.emissiveIntensity;mat.emissive.set('#ffffff');
  tween(500,k=>{mat.emissiveIntensity=.55*(1-k);}).then(()=>{mat.emissive.copy(e0);mat.emissiveIntensity=i0;});}
const _hopTo=hopTo;
hopTo=function(p,big){const t=tokens.get(p.id);const from=t.position.clone();const [x,y,z]=tileXYZ(p);const to=new THREE.Vector3(x,y,z+.08);const hgt=big?1.6:.5;sfx('hop');
  return tween(big?750:260,k=>{t.position.lerpVectors(from,to,k);const s=Math.sin(k*Math.PI);t.position.y=from.y+(to.y-from.y)*k+s*hgt;
    const sq=k<.15?1-k*1.6:k>.85?1-(1-k)*1.6:1+s*.18;t.scale.set(.95*(2-sq)*.5+.95*.5,.95*sq,.95*(2-sq)*.5+.95*.5);}).then(()=>{t.scale.setScalar(.95);ripple(to,p.color);flashTile(to);});};
