# XcodeGen spec: `xcodegen generate` in this folder creates CashToFreedom.xcodeproj.
# The project file itself is not kept in git, so it never needs hand-merging.
# Build number = GitHub run number (set by .github/workflows/ios.yml), version = MARKETING_VERSION.
name: CashToFreedom
options:
  bundleIdPrefix: com.cashtofreedom
  # English is the fallback for every language other than Vietnamese.
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
targets:
  CashToFreedom:
    type: application
    platform: iOS
    sources:
      - path: CashToFreedom
        excludes:
          - www
      # The game itself (built by tools/build_web.py), copied as a folder so paths stay as they are.
      - path: CashToFreedom/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashtofreedom.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CashToFreedom/Info.plist
      properties:
        CFBundleDisplayName: Cash to Freedom
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.board-games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
