<title>Dòng Tiền 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D board, player bar on top, ledger HUD sheet at the bottom; cards slide up as sheets. Single dark "night bank" look with gold. */
:root{
  --ink:#0b1424; --panel:#13213a; --panel2:#1a2b49; --line:#2a3d62;
  --text:#eef2f8; --muted:#93a3c0; --gold:#e9b949; --money:#4fd18b; --danger:#ff6b6b;
  --opp:#2fae6e; --market:#3a86d4; --doodad:#e0566b; --payday:#e9b949; --charity:#9b6bdb; --baby:#f08fb8; --down:#7d8aa3; --ft:#d2a03a;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--money)} .neg{color:var(--danger)} .warn{color:var(--gold)}

#moment{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(circle,rgba(11,18,32,.55),rgba(5,9,18,.92));animation:mIn .35s ease-out}
#moment .mcard{width:min(86vw,380px);text-align:center;animation:mPop .6s cubic-bezier(.2,1.4,.4,1)}#moment .mart{border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 3px var(--gold)}
#moment h2{font:800 30px/1.15 'Bricolage Grotesque','Be Vietnam Pro',sans-serif;color:#ffe08a;margin:18px 0 6px;text-shadow:0 4px 18px rgba(233,185,73,.5)}#moment p{color:#dbe4f3;margin:0}
@keyframes mIn{from{opacity:0}to{opacity:1}}@keyframes mPop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
#chick{position:fixed;left:12px;top:34%;z-index:290;display:flex;gap:6px;align-items:flex-end;max-width:min(78vw,330px);pointer-events:none;animation:mPop .45s cubic-bezier(.2,1.4,.4,1)}
#chick .bub{background:#fff8dc;color:#2a1e05;border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
body.swan #app,body.swan canvas{animation:shake .12s linear 10}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}
#ticker.alert{background:#4a0a0a;border-bottom-color:#ff4d4d}
.bio{background:linear-gradient(160deg,#f7f0de,#e9dfc4);color:#2b2316;border-radius:14px;padding:12px 14px;margin:8px 0;font-family:'Be Vietnam Pro',sans-serif}.bio h4{margin:0 0 4px;font:800 15px/1.25 'Bricolage Grotesque','Be Vietnam Pro',sans-serif;color:#5a3d0c;text-transform:uppercase;letter-spacing:.04em}.bio p{color:#2b2316!important;margin:0;font-size:14px;line-height:1.5}
.mis{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}.mis b{min-width:20px}.mis.done{color:var(--money)}
#ticker{position:fixed;left:0;right:0;top:0;z-index:6;height:calc(env(safe-area-inset-top,0px) + 24px);padding-top:env(safe-area-inset-top,0px);overflow:hidden;background:#070d18;border-bottom:1px solid rgba(233,185,73,.35);font-size:12px;line-height:24px;white-space:nowrap}
#ticker[hidden]{display:none!important}#tickerIn{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}#ticker:active #tickerIn{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.tk{margin:0 6px}.tk b{font-weight:800;margin-right:5px;padding:1px 6px;border-radius:6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase}.tk.real b{background:#1d4ed8;color:#fff}.tk.mkt b{background:#0f766e;color:#fff}.tk.fun b{background:#b45309;color:#fff}.tk.rumor b{background:#7f1d1d;color:#ffd5d5}.tk.hot b{background:#e9b949;color:#1a1200}#tickerIn i{color:#e9b949;font-style:normal;margin:0 8px}
body.tk-on #topbar{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
#topbar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;z-index:5;background:linear-gradient(var(--ink),rgba(11,20,36,0))}
#topbar{flex-wrap:wrap}
.rankhead{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0 4px;font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--gold);text-transform:uppercase}
.rankhead span{display:inline-block;transition:transform .2s}
.rankhead.closed span{transform:rotate(-90deg)}
#rank{flex-basis:100%;background:rgba(19,33,58,.88);border:1px solid var(--line);border-radius:12px;padding:4px 8px 6px;max-height:36vh;overflow:auto;backdrop-filter:blur(4px)}
.rk{display:grid;grid-template-columns:14px 30px minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:3px 2px;text-align:left}
.rk+.rk{border-top:1px solid rgba(42,61,98,.6)}
.rk.on{background:rgba(233,185,73,.1)}
.rk.cols{padding:2px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rk.cols span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .n{font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.rk.top .n{color:var(--gold)}
.rk img{width:26px;height:26px;border-radius:50%;background:var(--ink);display:block}
.rk .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.rk .nm small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.mb{min-width:0}
.mb i{display:block;height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
.mb i b{display:block;height:100%;border-radius:3px;transition:width .6s}
.mb span{display:block;font-family:var(--f-num);font-size:9.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);max-width:560px;margin:0 auto}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who img{width:30px;height:30px;border-radius:50%;background:var(--ink);flex:none}
.who b{color:var(--text);font-size:16px;font-family:var(--f-display);font-weight:800}
.who .turn{margin-left:auto;font-family:var(--f-num);font-size:11px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.stat label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;font-family:var(--f-num);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{margin-top:10px}
.bar{height:8px;border-radius:99px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--money),var(--gold));border-radius:99px;transition:width .6s}
.progress p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;min-height:46px}
.btn.primary{flex:1;background:var(--gold);color:#1b1404;border-color:transparent;font-family:var(--f-display);font-size:17px}
.btn.green{background:var(--money);color:#06210f;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;border-radius:9px}

#modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;border-top:4px solid var(--tone,var(--gold));padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.band{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;z-index:1}
.band span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tone,var(--gold))}
.band .x{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;margin:2px 0 8px;text-wrap:balance}
.sheet p{line-height:1.55;color:#d3dbea;margin:0 0 10px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ledger td .acts{margin-top:6px;gap:6px}.ledger td .acts .btn{padding:6px 10px;font-size:12px}
.acts .btn{flex:1 1 140px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}
.fact{background:var(--ink);border-radius:10px;padding:8px 10px;border:1px solid var(--line);min-width:0}
.fact label{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fact b{font-family:var(--f-num);font-size:15px}
.fact small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.note{font-size:12px;color:var(--gold);background:rgba(233,185,73,.08);border:1px dashed rgba(233,185,73,.4);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.verdict{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:6px}
.v-good{background:rgba(79,209,139,.15);color:var(--money)} .v-ok{background:rgba(233,185,73,.15);color:var(--gold)} .v-bad{background:rgba(255,107,107,.15);color:var(--danger)}
.calc{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0}
.calc div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.calc div:last-child{border-bottom:0}
.calc span{color:var(--muted)} .calc b{font-family:var(--f-num);white-space:nowrap}
.calc .tot{font-weight:800} .calc .tot span{color:var(--text)}
.seg2{display:flex;gap:6px;margin:6px 0}
.seg2 button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink);font-weight:700;font-size:13px}
.seg2 button.on{background:var(--gold);color:#1b1404;border-color:transparent}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.row .grow{flex:1;min-width:0;font-size:13px;line-height:1.4}
.row .grow small{color:var(--muted);display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.stepper{display:flex;align-items:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.stepper .qty{font-family:var(--f-num);font-size:20px;min-width:90px;text-align:center}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:12px;display:block}
.tone-opp{--tone:var(--opp)} .tone-market{--tone:var(--market)} .tone-doodad{--tone:var(--doodad)} .tone-payday{--tone:var(--payday)}
.tone-charity{--tone:var(--charity)} .tone-baby{--tone:var(--baby)} .tone-downsized{--tone:var(--down)} .tone-ft{--tone:var(--ft)}

.ledger h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.ledger table{width:100%;border-collapse:collapse;font-size:13px}
.ledger td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger td:last-child{text-align:right;font-family:var(--f-num);white-space:nowrap;padding-left:8px}
.ledger td small{color:var(--muted);font-family:var(--f-body)}
.ledger tr.total td{font-weight:700;border-bottom:2px solid var(--line)}
.ledger .big{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.ledger .big b{font-family:var(--f-num);font-size:20px}
.spark{width:100%;height:90px;display:block;background:var(--ink);border-radius:10px;border:1px solid var(--line)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.pos{border-color:rgba(79,209,139,.6)} .toast.neg{border-color:rgba(255,107,107,.6)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#setup{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 80% at 50% 0%,#1d3157 0%,var(--ink) 60%);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.setup-in{max-width:520px;margin:0 auto}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:.92;letter-spacing:-.02em;margin:8px 0 6px}
.logo em{font-style:normal;color:var(--gold)}
.lede{color:var(--muted);line-height:1.55;margin:0 0 18px;max-width:52ch}
.seg{display:flex;gap:6px;margin:6px 0 16px}
.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-num);font-weight:700}
.seg button.on{background:var(--gold);color:#1b1404;border-color:transparent}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin-bottom:8px}
.avatar{width:76px;height:76px;border-radius:14px;background:var(--ink);border:1px solid var(--line);padding:0;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;display:block}
.avatar span{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(11,20,36,.8);padding:2px 0}
.pcard input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-weight:700}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px}
.pill b{font-family:var(--f-num)}
.chargrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.chargrid button{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px 2px 6px;font-size:11px;font-weight:700;min-width:0}
.chargrid button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.chargrid img{width:100%;aspect-ratio:1;display:block;max-width:100%}
.howto{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.6}
.howto b{color:var(--text)}
.artwrap{margin:4px -4px 10px;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.art{width:100%;height:auto;display:block;aspect-ratio:16/9;max-width:100%}
.story{font-style:italic;color:#e7ecf5!important;border-left:3px solid var(--tone,var(--gold));padding-left:10px}
.lesson{font-size:12px;color:var(--muted)!important;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;margin-top:10px!important}
.lesson b{color:var(--gold)}
.botpill{background:rgba(90,169,255,.15)!important;border-color:#5aa9ff!important;color:#bfe0ff}
#rollNum{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;text-align:center;font-family:var(--f-display);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6),0 0 40px rgba(233,185,73,.7)}
#rollNum b{display:block;font-size:110px;line-height:1;font-weight:800;color:var(--gold)}
#rollNum span{font-family:var(--f-num);font-size:18px}
#rollNum.pop{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.rules h3{font-family:var(--f-display);font-size:16px;margin:16px 0 6px;color:var(--gold)}
.rules li{margin:4px 0;line-height:1.5;color:#d3dbea}
.rules ul{padding-left:18px;margin:0}
.sheet.locked .acts button,.sheet.locked .stepper button,.sheet.locked .seg2 button,.sheet.locked .rows button{opacity:.3;pointer-events:none;filter:grayscale(.7)}
.botbar{display:flex;align-items:center;gap:8px;background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.5);color:#bfe0ff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.botbar i{width:8px;height:8px;border-radius:50%;background:#5aa9ff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#hud.locked .actions .btn{opacity:.3;filter:grayscale(.7)}
#hud.locked .who::after{content:"MÁY ĐANG CHƠI";margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#bfe0ff;background:rgba(90,169,255,.18);border-radius:99px;padding:3px 8px;flex:none}
#rank.locked .rk{pointer-events:none}
#viewer{position:fixed;inset:0;z-index:55;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.band .when{color:var(--muted)!important;letter-spacing:.04em!important;font-family:var(--f-num)}
.hint{font-size:13px;color:#d9f5e6!important;background:rgba(79,209,139,.1);border:1px solid rgba(79,209,139,.4);border-radius:10px;padding:8px 10px;margin-top:8px!important}
.hint b{color:var(--money)}
#paySlip{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:58;width:min(340px,calc(100% - 32px));background:#fffaf0;color:#1b2a44;border-radius:14px;padding:12px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5);font-size:13px;border-top:6px solid var(--gold)}
#paySlip.in{animation:slip .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slip{from{transform:translate(-50%,-30px) rotate(-3deg);opacity:0}}
.ps-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed #d8cdb4;padding-bottom:6px;margin-bottom:4px}
.ps-h span{font-size:11px;font-weight:800;letter-spacing:.1em;color:#8a6a45}
.ps-h b{font-family:var(--f-num);font-size:12px}
.ps-r{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.ps-r b{font-family:var(--f-num)}
.ps-r.tot{border-top:2px solid #1b2a44;margin-top:4px;padding-top:6px;font-weight:800;font-size:15px}
#paySlip .pos{color:#1d8a52} #paySlip .neg{color:#c23b4a}
#coinFly{position:fixed;inset:0;pointer-events:none;z-index:59}

let G=null;
const SAVE_KEY='dongtien3d.v4',STATE_V=4;
function save(){try{if(!G||!G.online)localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}if(typeof pushState==='function')pushState();}
function validState(s){return s&&s.v===STATE_V&&Array.isArray(s.players)&&s.players.length&&s.players.every(p=>'living' in p&&'age' in p);}
function sanitize(s){['turn','cur','stockIdx','rateAdj'].forEach(k=>s[k]=num(s[k]));if(!s.stockIdx)s.stockIdx=1;s.cyc=s.cyc||{land:'normal',re:'normal',stock:'normal'};
  s.players.forEach(p=>{['cash','loan','salary','rent','living','childPer','kids','pos','ftPos','ftCF','ftStart','ftBase','ftExp','ftLap','charity','skip','age','dep','cpi','net','parentCare'].forEach(k=>p[k]=num(p[k]));
  p.liabs=(p.liabs||[]).filter(l=>l).map(l=>({...l,bal:num(l.bal),pay:num(l.pay)}));p.assets=(p.assets||[]).filter(a=>a&&(a.type!=='stock'||STOCKS[a.sym]));
  p.assets.forEach(a=>['price','value','loan','pay','left','rent','opex','profit','equity','shares','cost','units','face','coupon','qty','rate','amount','paid','turns'].forEach(k=>{if(k in a)a[k]=num(a[k]);}));
  p.kidAges=(p.kidAges||[]).map(num);if(p.zod==null)p.zod=p.id%12;S(p);p.gift=num(p.gift);p.sides=p.sides||[];p.risk=num(p.risk);p.schoolPrem=num(p.schoolPrem);p.ach=p.ach||{};p.pref=p.pref||{};p.seenScenes=p.seenScenes||[];p.deals=p.deals||[];p.events=p.events||[];});return s;}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return validState(s)&&!s.online?sanitize(s):null}catch(e){return null}}
const curP=()=>G.players[G.cur];
const isBotTurn=()=>!!(G&&G.players&&curP()&&(curP().bot||(G.online&&typeof iControl==='function'&&!iControl())));

function assetCF(a){
  if(a.type==='re')return a.rent*(1-a.opex)-(a.left>0?a.pay:0);
  if(a.type==='biz')return a.profit-(a.left>0?a.pay:0);
  if(a.type==='stock')return a.shares*STOCKS[a.sym].div*(1-DIV_TAX)/12;
  if(a.type==='bond')return a.def?0:a.units*a.face*a.coupon*(1-BOND_TAX)/12;
  return 0;
}
function assetValue(a){
  if(a.type==='stock')return a.shares*STOCKS[a.sym].base*(G&&G.stockIdx||1);
  if(a.type==='bond')return a.units*a.face;
  if(a.type==='gold')return a.qty*GOLD_REF;
  if(a.type==='scam')return a.amount;
  if(a.type==='crypto')return a.qty*btcPrice();
  return num(a.value||a.price);
}
function kidCost(p,age){if(age>=22)return 0;let c=p.childPer;if(mode().life){if(age>=18)c+=5*TR*p.cpi;else if(age>=6)c+=1.5*TR*p.cpi;}return c;}
function calc(p,o={}){
  let passive=0,rentGross=0;for(const a of p.assets){passive+=num(assetCF(a));if(a.type==='re'&&a.kind!=='land')rentGross+=a.rent;}
  const rentTax=rentGross*12>RENT_TAX_TH?rentGross*RENT_TAX:0;
  const depInt=p.dep*DEP_RATE/12;passive+=depInt-rentTax;
  const kidsIn=p.kidAges.filter(k=>k<22);
  const sal=o.noSalary?p.salary*(o.benefit||0):p.salary;
  const {ins,tax}=netSalary(sal,kidsIn.length);
  const sp=p.spouse?netSalary(p.spouse,0):null,spouseNet=p.spouse?p.spouse-sp.ins-sp.tax:0;
  const liabPay=p.liabs.reduce((s,l)=>s+num(l.pay),0);
  const childExp=kidsIn.reduce((s,k)=>s+kidCost(p,k),0), loanPay=Math.round(p.loan*clr());
  const insPrem=p.hins?Math.round(p.salary*.015/1e4)*1e4:0;
  const totalExp=ins+tax+p.rent+p.living+liabPay+childExp+loanPay+insPrem+p.parentCare;
  const side=(o.noSalary?0:1)*p.sides.reduce((s,x)=>s+x.inc,0)+(p.gift||0);
  const income=sal+spouseNet+passive+side;
  return {passive,income,totalExp:totalExp+p.schoolPrem,cashflow:income-totalExp-p.schoolPrem,childExp,loanPay,liabPay,ins,tax,rentTax,depInt,spouseNet,insPrem,sal,side};
}
const TIERS={1:{n:'Cơm áo gạo tiền',d:'Làm thêm, kinh doanh nhỏ, phòng trọ, cổ phiếu, vàng, Bitcoin'},2:{n:'Tích lũy',d:'Mở khóa đầu tư lớn: chung cư, nhà đất, chuỗi cà phê, siêu thị mini, farm, góp vốn công ty'},3:{n:'Nhà đầu tư',d:'Mở khóa nhà phố, căn hộ dịch vụ, khách sạn mini, mua lại công ty'}};
const TIER_NW={2:500*TR,3:3*TY};
function investCap(p){let v=p.cash+p.dep;for(const a of p.assets)v+=assetValue(a)-num(a.loan);return v-p.loan;}
function tier(p){const nw=investCap(p);return nw>=TIER_NW[3]?3:nw>=TIER_NW[2]?2:1;}
const btcPrice=()=>Math.round(2*TY*(G&&G.btcIdx||1)/1e6)*1e6;
function netWorth(p){let v=p.cash+p.dep;for(const a of p.assets)v+=assetValue(a)-num(a.loan);v-=p.loan;for(const l of p.liabs)v-=l.bal;return v;}
function newPlayer(i,d,prof,name,scen){
  const p={id:i,name,color:d.col||COLORS[i],zod:d.zod!=null?d.zod:i%12,char:d.char,bot:!!d.bot,botLvl:d.botLvl||'normal',prof:prof.n,age:prof.age,salary:T(prof.sal),rent:T(prof.rent),living:T(prof.liv),childPer:T(prof.ch),kids:0,kidAges:[],liabs:[],loan:0,cash:0,dep:0,assets:[],
    pos:0,ft:false,ftPos:0,ftCF:0,ftStart:0,ftAssets:[],dream:d.dream,charity:0,skip:0,hist:[],won:false,out:false,retired:false,spouse:0,parentCare:0,hins:false,cpi:1,net:0,S:{happy:50,luck:50,health:60,kids:50,know:40,rel:40},gift:0,ach:{},deals:[],events:[],sides:[],risk:0,schoolPrem:0,pref:{},seenScenes:[]};
  for(const k in prof.L){const [b,pay]=prof.L[k];p.liabs.push({key:k,label:LIAB_LABEL[k],bal:T(b),pay:T(pay)});}
  let sav=T(prof.sav);
  if(scen==='grad'){p.age=22;sav=5*TR;p.liabs.push({key:'study',label:'Vay học phí đại học',bal:50*TR,pay:1*TR});}
  if(!p.bot&&isPro())proPerks(p);
  p.age0=p.age;p.sal0=p.salary;p.prof0=p.prof;p.missions=pickMissions();p.mDone=[];
  p.cash=sav+calc(p).cashflow;
  p.hist.push(snapHist(p));
  return p;
}
function snapHist(p){const c=calc(p);return {passive:p.ft?p.ftCF:c.passive,exp:p.ft?p.ftStart+ftGoal():c.totalExp,nw:netWorth(p),age:p.age};}
function log(text,p){G.log.unshift({t:G.turn,who:p?p.name:'',c:p?p.color:'',text});if(G.log.length>300)G.log.length=300;}
const loanCap=p=>Math.max(p.salary,20*TR)*15;

function needLoan(p,amt){return p.ft?0:Math.max(0,Math.ceil((amt-p.cash)/CL_STEP)*CL_STEP);}
function pay(p,amt,why){
  amt=num(amt);if(amt<=0)return;
  if(!p.ft&&p.cash<amt&&p.loan+needLoan(p,amt)>loanCap(p))liquidate(p,amt);
  if(!p.ft&&p.cash<amt&&p.dep>0){const w=Math.min(p.dep,amt-p.cash);p.dep-=w;p.cash+=w;}
  const need=needLoan(p,amt);
  if(need){p.loan+=need;p.cash+=need;p.st=p.st||{};p.st.loanMax=Math.max(p.st.loanMax||0,p.loan);if(Math.random()<.4)chickSay('autoLoan',p);toast(`${p.name} vay tiêu dùng tự động ${fmt(need)} (lãi ${fmt(need*clr())}/tháng)`,'neg');log(`Vay tiêu dùng ${fmt(need)} để trả: ${why}`,p);}
  p.cash-=amt;sfx('pay');
}
function liquidate(p,amt){
  const list=p.assets.slice().sort((a,b)=>assetCF(a)-assetCF(b));
  for(const a of list){if(p.cash+p.dep+Math.max(0,loanCap(p)-p.loan)>=amt)break;
    const v=Math.max(0,a.type==='scam'?0:a.type==='re'||a.type==='biz'?(assetValue(a)-a.loan)*.5:assetValue(a)*.5);
    p.assets.splice(p.assets.indexOf(a),1);p.cash+=v;p.deals.push({name:'Thanh lý gấp '+(a.name||a.type),pl:v-(a.equity||a.cost||0)});toast(`${p.name} thanh lý gấp ${assetLabel(a)}: chỉ thu ${fmt(v)}`,'neg');log(`Thanh lý gấp ${assetLabel(a)} được ${fmt(v)} (50% giá trị) vì hết hạn mức vay`,p);}
  if(p.cash+p.dep+Math.max(0,loanCap(p)-p.loan)<amt){
    p.bankrupt=(p.bankrupt||0)+1;p.skip=Math.max(p.skip,2);
    p.liabs.forEach(l=>{if(l.key!=='home'){l.bal=Math.round(l.bal/2);l.pay=Math.round(l.pay/2);}});
    toast(`${p.name} PHÁ SẢN: mất 2 lượt, nợ cá nhân được tái cơ cấu còn một nửa`,'neg');log('Phá sản: hết tài sản, vượt hạn mức vay. Mất 2 lượt, nợ cá nhân giảm một nửa.',p);}
}
function gain(p,amt){p.cash+=num(amt);if(amt>0)sfx('cash');}
function amortize(p){for(const a of p.assets){if(a.loan>0&&a.left>0){const int=a.loan*a.rate/12;a.loan=Math.max(0,a.loan-(a.pay-int));a.left--;
  if(a.teaserLeft>0){a.teaserLeft--;if(!a.teaserLeft){const old=a.pay;a.rate=a.floatRate+(G.rateAdj||0);a.pay=pmt(a.loan,a.rate,a.left/12);p.events.push({k:'teaser',name:a.name,old,pay:a.pay,rate:a.rate});}}
  if(a.left<=0||a.loan<1){a.loan=0;a.left=0;a.pay=0;}}}}

/* ================= dòng thời gian: mỗi lượt 4 tháng ================= */
function advanceTurn(p){
  if(p.ft||p.out)return null;
  const before=p.cash,unemp=p.skip>0;

function analyze(a,ltv){
  const loan=round1(a.price*ltv),fees=a.type==='re'?a.price*FEE_BUY_RE:0,equity=a.price-loan+fees;
  const rate=a.teaser?a.teaser.rate:a.rate,pmtM=pmt(loan,rate,a.term);
  const net=a.type==='re'?a.rent*(1-a.opex):a.profit;
  const cf=net-pmtM,coc=equity?cf*12/equity:0;
  const pmtAfter=a.teaser?pmt(loan*.95,a.floatRate+(G&&G.rateAdj||0),a.term-a.teaser.months/12):pmtM;
  return {loan,fees,equity,pmtM,net,cf,coc,gy:a.type==='re'&&a.price?a.rent*12/a.price:0,pmtAfter,cfAfter:net-pmtAfter};
}
function botPick(p,d){const L=BOT_LVL[p.botLvl||'normal'];const a=d.a;let best=null;
  for(const x of d.ltvs){const R=analyze(a,x),Ln=needLoan(p,R.equity);if(p.loan+Ln>loanCap(p))continue;if(Ln&&!L.useLoan)continue;const real=Math.min(R.cf,R.cfAfter)-Ln*clr(),coc=R.equity?real*12/R.equity:0;
    if(a.kind==='land'||a.kind==='startup'){if(p.cash>R.equity*3&&Math.random()<L.spec)best={x,real:0};continue;}
    if(real>0&&coc>=L.coc&&(!best||real>best.real))best={x,real};}
  return best?best.x:null;}
function botHousekeeping(p){if(p.ft){ftFix(p);if(!p.ftGuard&&p.ftStart>=4*TY)p.ftGuard=true;return;}
  if(p.ft)return;const c=calc(p),cushion=c.totalExp*(mode().life?6:3);
  while(p.loan>=CL_STEP&&p.cash-CL_STEP>c.totalExp*2){p.loan-=CL_STEP;p.cash-=CL_STEP;}
  p.liabs.slice().sort((a,b)=>b.pay/b.bal-a.pay/a.bal).forEach(l=>{if(p.cash-l.bal>cushion*1.5){p.cash-=l.bal;p.liabs.splice(p.liabs.indexOf(l),1);}});
  if(mode().insurance&&!p.hins&&p.cash>c.totalExp*3)p.hins=true;
}

/* ================= bảng tài chính ================= */
function assetLabel(a){
  if(a.type==='stock')return `${a.sym} · ${a.shares.toLocaleString('vi-VN')} cp`;
  if(a.type==='bond')return `TP ${a.issuer} · ${a.units} lô${a.def?' (vỡ nợ)':''}`;
  if(a.type==='gold')return `Vàng nhẫn · ${a.qty} chỉ`;
  if(a.type==='scam')return `${a.name} (cam kết ${pct(a.promise)}/tháng)`;
  return a.name+(a.share?` (${pct(a.share,0)})`:'');
}
/* ================= Giao dịch tức thì: mua bán, vay, trả nợ bất cứ lúc nào ================= */
/* Ngoài đời giao dịch lúc nào cũng được, chỉ là giá bao nhiêu. Bán ngay cho môi giới/ngân hàng rẻ hơn
   giá người mua trên thẻ Thị trường; mua ngay trên sàn đắt hơn giá trên thẻ Cơ hội. */
const QUICK={re:{boom:.97,normal:.9,bust:.8},biz:.7,gold:.97,crypto:.98,bond:.95,buy:1.02,goldBuy:1.03};
let armed=null;
const reCyc=a=>(G.cyc&&G.cyc[a.kind==='land'?'land':'re'])||'normal';
function quickQuote(a){let price,net,basis;
  if(a.type==='re'){price=round1(assetValue(a)*QUICK.re[reCyc(a)]);net=price-a.loan-price*TAX_SELL_RE;basis=a.equity||0;}
  else if(a.type==='biz'){if(a.kind==='startup')return null;price=round1(assetValue(a)*QUICK.biz);net=price-a.loan;basis=a.equity||0;}
  else if(a.type==='stock'){price=Math.round(a.shares*STOCKS[a.sym].base*(G.stockIdx||1));net=price*(1-STK_FEE-STK_TAX);basis=a.shares*a.cost;}
  else if(a.type==='gold'){price=Math.round(a.qty*GOLD_REF*QUICK.gold);net=price;basis=a.cost;}
  else if(a.type==='crypto'){price=Math.round(a.qty*btcPrice()*QUICK.crypto);net=price;basis=a.cost;}
  else if(a.type==='bond'){price=Math.round(a.units*a.face*(a.def?.4:QUICK.bond));net=price;basis=a.units*a.face;}
  else return null;
  net=Math.round(net);return {price,net,basis,profit:net-basis};}
function quickSell(p,a){const Q=quickQuote(a);if(!Q)return;
  if(Q.net<0&&p.cash<-Q.net)return toast(`Cần ${fmt(-Q.net)} tiền mặt để tất toán khoản vay khi bán`,'neg');
  p.assets.splice(p.assets.indexOf(a),1);p.cash+=Q.net;sfx(Q.net>0?'cash':'pay');
  p.deals.push({name:'Bán ngay '+assetLabel(a),pl:Q.profit});if(Q.profit<0)chickSay('lossSell',p);
  toast(`Bán ngay ${assetLabel(a)}: nhận ${fmt(Q.net)} (${Q.profit>=0?'lãi':'lỗ'} ${fmt(Math.abs(Q.profit))})`,Q.profit>=0?'pos':'neg');
  log(`Bán ngay ${assetLabel(a)} giá ${fmt(Q.price)}, nhận về ${fmt(Q.net)} (${Q.profit>=0?'lãi':'lỗ'} ${fmt(Math.abs(Q.profit))})`,p);}
function prepay(p,a,amt){amt=Math.min(amt,a.loan,p.cash);if(amt<=0)return;a.loan-=amt;p.cash-=amt;
  if(a.loan<1){a.loan=0;a.left=0;a.pay=0;}else a.pay=pmt(a.loan,a.rate,a.left/12);
  sfx('pay');log(`Trả bớt nợ vay ${a.name}: ${fmt(amt)}, góp còn ${fmt(a.pay)}/tháng`,p);toast(`Trả bớt ${fmt(amt)}: góp còn ${fmt(a.pay)}/tháng`,'pos');}
const equityRoom=a=>Math.max(0,Math.floor((assetValue(a)*(a.type==='biz'||a.kind==='land'?.5:.7)-a.loan)/(10*TR))*10*TR);
function equityLoan(p,a,amt){if(amt<=0)return;const r=Math.max(.06,.1+(G.rateAdj||0));
  a.rate=(a.loan*(a.rate||r)+amt*r)/(a.loan+amt);a.loan+=amt;a.left=Math.max(a.left||0,15*12);a.teaserLeft=0;a.pay=pmt(a.loan,a.rate,a.left/12);p.cash+=amt;sfx('cash');
  log(`Vay thế chấp ${a.name}: ${fmt(amt)} (lãi ${pct(r)}/năm), góp ${fmt(a.pay)}/tháng`,p);toast(`Vay thế chấp ${fmt(amt)}: góp ${fmt(a.pay)}/tháng`,'neg');}
function payDown(p,i,amt){const l=p.liabs[i];amt=Math.min(amt,l.bal,p.cash);if(amt<=0)return;const k=(l.bal-amt)/l.bal;p.cash-=amt;l.bal-=amt;l.pay=Math.round(l.pay*k);
  if(l.bal<1)p.liabs.splice(i,1);sfx('pay');log(`Trả bớt ${l.label}: ${fmt(amt)}`,p);toast(`Trả bớt ${l.label}: chi phí còn ${fmt(l.pay)}/tháng`,'pos');}
const stockAsk=sym=>Math.round(STOCKS[sym].base*(G.stockIdx||1)*QUICK.buy/100)*100;
function quickBuy(p,kind,sym,n){
  if(kind==='stock'){const px=stockAsk(sym),total=Math.round(n*px*(1+STK_FEE));if(p.cash<total)return;p.cash-=total;
    const h=p.assets.find(a=>a.type==='stock'&&a.sym===sym);if(h){h.cost=(h.cost*h.shares+total)/(h.shares+n);h.shares+=n;}else p.assets.push({type:'stock',sym,shares:n,cost:total/n});
    log(`Mua ngay ${n} cp ${sym} @ ${fmtD(px)} = ${fmt(total)}`,p);}
  else if(kind==='gold'){const total=Math.round(n*GOLD_REF*QUICK.goldBuy);if(p.cash<total)return;p.cash-=total;const g=p.assets.find(a=>a.type==='gold');if(g){g.qty+=n;g.cost+=total;}else p.assets.push({type:'gold',qty:n,cost:total});log(`Mua ngay ${n} chỉ vàng ${fmt(total)}`,p);}
  else if(kind==='crypto'){const total=Math.round(n*btcPrice()*QUICK.buy);if(p.cash<total)return;p.cash-=total;const h=p.assets.find(a=>a.type==='crypto');if(h){h.qty+=n;h.cost+=total;}else p.assets.push({type:'crypto',qty:n,cost:total});log(`Mua ngay ${trimNum(n,2)} BTC ${fmt(total)}`,p);}
  sfx('pay');}
/* Hỏi mua tài sản của người chơi khác theo giá thị trường × k. Người mua nhận luôn khoản vay còn lại. */
const offerFor=(a,k)=>round1(assetValue(a)*k);
function botAccepts(q,a,offer){const Q=quickQuote(a),r=offer/Math.max(1,assetValue(a)),cf=assetCF(a),gain=offer-num(a.loan)-(Q?Q.basis:0);
  return r>=1.25||(r>=1.1&&(cf<=0||gain>(Q?Q.basis:0)*.2))||(r>=1&&cf<0);}
function tradeAsset(buyer,seller,a,offer){const loan=num(a.loan),fee=a.type==='re'?Math.round(offer*FEE_BUY_RE):0,pay=offer-loan+fee,get=Math.round(offer-loan-(a.type==='re'?offer*TAX_SELL_RE:0));
  if(buyer.cash<pay)return toast(`Cần ${fmt(pay)} tiền mặt (giá ${fmt(offer)} − dư nợ ${fmt(loan)}${fee?' + phí 1%':''})`,'neg');
  if(get<0&&seller.cash<-get)return toast(`${seller.name} không đủ tiền tất toán khoản vay`,'neg');
  const ok=seller.bot?botAccepts(seller,a,offer):confirm(`${seller.name} ơi, ${buyer.name} muốn mua ${assetLabel(a)} giá ${fmt(offer)}.\nBạn nhận về ${fmt(get)} (đã trừ dư nợ${a.type==='re'?' và thuế 2%':''}). Đồng ý bán?`);
  if(!ok){toast(`${seller.name} từ chối bán ${assetLabel(a)} giá ${fmt(offer)}`,'neg');log(`Hỏi mua ${assetLabel(a)} của ${seller.name} giá ${fmt(offer)}: bị từ chối`,buyer);return;}
  const Q=quickQuote(a);seller.assets.splice(seller.assets.indexOf(a),1);seller.cash+=get;seller.deals.push({name:'Bán cho '+buyer.name+': '+assetLabel(a),pl:get-(Q?Q.basis:0)});
  buyer.cash-=pay;if(a.type==='re'||a.type==='biz'){a.price=offer;a.value=offer;a.equity=pay;}else if(a.type==='gold'||a.type==='crypto')a.cost=pay;buyer.assets.push(a);sfx('cash');
  toast(`${buyer.name} mua ${assetLabel(a)} của ${seller.name} giá ${fmt(offer)}`,'pos');
  log(`Mua ${assetLabel(a)} của ${seller.name} giá ${fmt(offer)}: trả ${fmt(pay)}, nhận nợ vay ${fmt(loan)}`,buyer);log(`Bán ${assetLabel(a)} cho ${buyer.name} giá ${fmt(offer)}, nhận về ${fmt(get)}`,seller);}

function drawSpark(p){
  const cv=$('#spark');if(!cv)return;const dpr=Math.min(devicePixelRatio,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);const H=[...p.hist,snapHist(p)].map(d=>({passive:num(d.passive),exp:num(d.exp)}));
  const max=Math.max(1,...H.map(d=>Math.max(d.passive,d.exp)))*1.1,n=H.length,pad=8;
  const X=i=>pad+(n<2?0:i*(w-2*pad)/(n-1)),Y=v=>h-pad-Math.max(0,v)/max*(h-2*pad);
  x.strokeStyle='rgba(147,163,192,.18)';x.lineWidth=1;for(let g=1;g<4;g++){x.beginPath();x.moveTo(0,h*g/4);x.lineTo(w,h*g/4);x.stroke();}
  const ln=(key,col,fill)=>{x.beginPath();H.forEach((d,i)=>i?x.lineTo(X(i),Y(d[key])):x.moveTo(X(i),Y(d[key])));x.strokeStyle=col;x.lineWidth=2;x.stroke();
    if(fill){x.lineTo(X(n-1),h-pad);x.lineTo(X(0),h-pad);x.closePath();x.fillStyle=fill;x.fill();}
    x.beginPath();x.arc(X(n-1),Y(H[n-1][key]),3.5,0,7);x.fillStyle=col;x.fill();};

/* ================= turn flow ================= */
function startTurn(){
  const p=curP();G.phase='busy';if(isOnline()){G.turnAt=Date.now();G.takeover=0;}renderHUD();focusOn(p);save();
  const seq=[];
  if(G.news&&!G.news.seen)seq.push(done=>showNews(done));
  if(G.swan&&!G.swan.seen)seq.push(done=>showSwan(done));
  if(!p.ft&&!p.out){const unemp=p.skip>0,c=calc(p,{noSalary:unemp,benefit:unemp&&p.benefitLeft>0?mode().benefit:0});const r=advanceTurn(p);if(r)showPaySlip(p,c,r);log(`Lương ${mpt()} tháng: ${sgn(r.delta)}`,p);renderHUD();}
  else if(p.ft){p.age+=mpt()/12;}
  seq.push(done=>runEvents(p,done));
  const next=()=>{if(seq.length){seq.shift()(next);return;}afterEvents(p);};
  setTimeout(next,p.ft?50:900);
}
function afterEvents(p){
  if(p.out){nextTurn();return;}
  if(p.jail>0){p.jail--;toast(`${p.name} đang ngồi tù, mất lượt (còn ${p.jail})`,'neg');log('Ngồi tù, mất một lượt',p);renderHUD();setTimeout(nextTurn,1400);return;}
  if(p.skip>0){p.skip--;toast(`${p.name} đang thất nghiệp, nghỉ lượt này (còn ${p.skip})`,'neg');log('Thất nghiệp, nghỉ một lượt',p);renderHUD();setTimeout(nextTurn,1400);return;}
  if(!p.bot&&G.quiz&&!p.introDone&&mastered(p))p.introDone=true;
  if(!p.bot&&G.quiz&&!p.introDone){p.introDone=true;return ledgerQuiz(p,introItems(p),()=>afterEvents(p),true);}
  if(p.bot&&iControl())botHousekeeping(p);
  G.phase='roll';renderHUD();save();
  if(p.bot&&iControl()){const nd=p.ft?2:1;botLater(()=>roll(p.charity>0?nd+1:nd,true),900,()=>G&&curP()===p&&G.phase==='roll');}
}
function showNews(done){G.news.seen=true;openModal({tone:'market',eyebrow:`Bản tin kinh tế năm ${G.news.year}`,title:`Chào năm ${G.news.year}!`,art:art('news',{year:G.news.year}),body:G.news.lines.map(l=>`<p>${l}</p>`).join(''),lesson:'Chu kỳ thị trường ảnh hưởng tới giá mua bán tài sản trong cả năm. Mua khi đóng băng, bán khi sốt nóng.',acts:[{label:'Tiếp tục',cls:'primary',fn:()=>{closeModal();done();}}],bot:()=>{closeModal();done();}});}
const LUCK_X2=80;
async function roll(n,byBot){
  if(G.phase!=='roll')return;const p=curP();if(isBotTurn()&&!byBot)return;G.phase='busy';renderHUD();ensureAudio();
  const vals=Array.from({length:n},()=>1+Math.floor(Math.random()*6));
  if(p.charity>0)p.charity--;
  sfx('dice');await animDice(vals);collRoll(p,vals);diceTalk(p,vals);
  let sum=vals.reduce((a,b)=>a+b,0);const lucky=S(p).luck>=LUCK_X2;if(lucky){sum*=2;addS(p,{luck:-30},'Dùng may mắn nhân đôi xúc xắc');}p.lastRoll=sum;showRoll(vals,sum);if(lucky)$('#rollNum').innerHTML=`<b>${sum}</b><span>${vals.join(' + ')} × 2 · may mắn</span>`;if(lucky&&!p.bot)quoteToast('May mắn gõ cửa: điểm xúc xắc nhân đôi!');
  await moveSteps(p,sum);

}
function bonus(p,kind,landed){const M=mode(),r=rf(...(kind==='tet'?M.tetBonus:M.midBonus)),amt=Math.round(p.salary*r/1e5)*1e5;
  if(p.retired||p.skip>0){toast(`${p.name} không có thưởng (${p.retired?'đã nghỉ hưu':'đang thất nghiệp'})`);return 0;}
  p.cash+=amt;log(`${kind==='tet'?'Thưởng Tết':'Thưởng giữa năm'} ${fmt(amt)} (${trimNum(r,1)} tháng lương)`,p);
  if(!landed){toast(`${p.name} · ${kind==='tet'?'Thưởng Tết':'Thưởng giữa năm'}: +${fmt(amt)}`,'pos');jingle(kind==='tet'?'tet':'payday');}
  renderHUD();return amt;}
async function moveSteps(p,steps){
  for(let s=0;s<steps;s++){
    if(p.ft){p.ftPos=(p.ftPos+1)%FT.length;await hopTo(p);if(FT[p.ftPos].t==='cf'){ftPayday(p);if(!p.ft)break;}}
    else{p.pos=(p.pos+1)%BOARD.length;await hopTo(p);const t=BOARD[p.pos];if(s<steps-1&&(t==='midbonus'||t==='tetbonus'))bonus(p,t==='tetbonus'?'tet':'mid',false);}
  }
  sfx('land');arrangeTokens();if(typeof celebrateTile==='function')celebrateTile(p);
}
function endTurn(){
  closeModal();const p=curP();missionsCheck();const c=calc(p);
  [...G.players].forEach(q=>checkAch(q).forEach(k=>{toast(`${q.name} đạt thành tích: ${ACH[k].n}`,'pos');log(`Thành tích: ${ACH[k].n}`,q);}));
  if(!p.ft&&!p.out&&c.passive>c.totalExp&&!(needPaywall(p)&&p.ftWait&&G.turn-p.ftWait<4*G.players.length)){
    sfx('win');coinRain(40);
    const ftc=Math.max(TY,Math.round(c.passive*200/(10*TR))*10*TR);
    const go=async()=>{closeModal();p.ft=true;p.freeAge=p.age;addS(p,{happy:20},'Tự do tài chính');moment('escape','TỰ DO TÀI CHÍNH!',`${esc(p.name)} thoát Vòng Cối Xay lúc ${Math.floor(p.age)} tuổi`);chickSay('freedom',p);if(!p.bot){setMastered(p);if(G.quiz)toast(`${p.name} đã nắm vững tài sản và tiêu sản: từ nay không cần ghi sổ nữa`,'pos');}p.ftCF=ftc;p.ftStart=ftc;p.ftBase=ftc;p.ftLap=0;p.ftVentures=[];p.ftAssets=[];p.cash+=ftc;p.ftPos=0;checkAch(p);log(`Tự do tài chính lúc ${Math.floor(p.age)} tuổi! Ngày lĩnh lương ${fmt(ftc)}`,p);await hopTo(p,true);arrangeTokens();ftChooseLifestyle(p,nextTurn);};
    openModal({tone:'ft',eyebrow:'Hoàn thành vòng Người lao động',title:`${esc(p.name)} tự do tài chính lúc ${Math.floor(p.age)} tuổi!`,art:art('escape'),quote:QUOTES.ctx.free,
      body:`<p>Thu nhập thụ động <b class="num pos">${fmt(c.passive)}</b>/tháng đã vượt tổng chi phí <b class="num">${fmt(c.totalExp)}</b>. Không còn phải đi làm vì tiền.</p><div class="facts">${fact('Ngày lĩnh lương mới',fmt(ftc),'pos','= thu nhập thụ động × 200')}${fact('Mục tiêu thắng',fmt(ftc+ftGoal()))}</div><p>Ở Vòng Thịnh Vượng (vòng ngoài), mua được giấc mơ “${esc(G.dreams[p.dream].n)}” hoặc tăng ngày lĩnh lương thêm ${fmt(ftGoal())} để thắng. Cẩn thận: chi tiêu phình to, kiện tụng, thuế, khủng hoảng và kèo mạo hiểm có thể đẩy bạn về lại Vòng Cối Xay.</p>`,
      acts:[{label:'Vào Vòng Thịnh Vượng',cls:'primary',fn:()=>needPaywall(p)?showPaywall(p,go):go()}],bot:go});
    return;
  }
  if(p.ft&&p.ftCF>=p.ftStart+ftGoal()&&!p.won){if(S(p).legacy>=legacyNeed()){win(p,`Ngày lĩnh lương đạt ${fmt(p.ftCF)}, Di sản ${S(p).legacy}.`);return;}if(!p.legacyHint){p.legacyHint=1;toast(`${p.name} đủ dòng tiền nhưng Di sản mới ${S(p).legacy}/${legacyNeed()}: hãy làm từ thiện, xây công trình để đời`,'neg');}}
  nextTurn();
}
function nextTurn(){
  if(G&&G.players)G.players.forEach(q=>{if(q.tmpBot){q.bot=false;q.tmpBot=false;}});
  const p=curP();p.hist.push(snapHist(p));if(p.hist.length>120)p.hist.shift();
  if(!G.players.some(q=>!q.won&&!q.out)){save();showSummary();return;}
  let i=G.cur;do{i=(i+1)%G.players.length;if(i===0){G.turn++;const m0=G.month;G.month+=mpt();if(Math.floor(G.month/12)>Math.floor(m0/12))newYear();}}while(G.players[i].won||G.players[i].out);
  G.cur=i;if(isOnline()&&!iControl()){G.phase='await';save();renderHUD();return;}startTurn();
}
function win(p,why){
  p.won=true;checkAch(p);sfx('win');coinRain(120);moment('trophy','CHIẾN THẮNG!',`${esc(p.name)} chạm tới giấc mơ lúc ${Math.floor(p.age)} tuổi`);log(`CHIẾN THẮNG lúc ${Math.floor(p.age)} tuổi! ${why}`,p);save();
  const left=G.players.filter(q=>!q.won&&!q.out).length;
  openModal({tone:'ft',eyebrow:'Chiến thắng',title:`${esc(p.name)} thắng ván này lúc ${Math.floor(p.age)} tuổi!`,art:art('trophy'),quote:QUOTES.ctx.win,body:`<p>${esc(why)} Từ ${p.prof} trở thành nhà đầu tư tự do.</p>`,
    acts:[{label:'Xem tổng kết',fn:()=>showSummary()},...(left?[{label:'Người khác chơi tiếp',fn:()=>{closeModal();nextTurn();}}]:[]),{label:'Ván mới',cls:'primary',fn:()=>{closeModal();G={dreams:G.dreams};draft=[];showSetup();}}]});
  renderHUD();
}

    if(kv<35){const need=80*TR;pay(p,need,'vốn cho con');addS(p,{happy:-8},'Con cần hỗ trợ');return info({tone:'downsized',title:'Con ra trường, chưa có việc',art:'fired',story:`Con loay hoay chưa tìm được việc, xin bố mẹ ${fmt(need)} để học thêm nghề và trang trải.`,quote:'Con hư tại mẹ, cháu hư tại bà… thôi lần sau chăm con nhiều hơn!',lesson:'Thiếu thời gian cho con lúc nhỏ có thể thành chi phí lớn khi con lớn.'});}}

/* ================= vòng Người lao động: các ô ================= */
function landing(p){
  const t=BOARD[p.pos];
  if(t==='opp')return cardOpp(p);
  if(t==='market')return cardMarket(p);
  if(t==='doodad')return cardDoodad(p);
  if(t==='charity')return cardCharity(p);
  if(t==='baby')return cardBaby(p);
  if(t==='downsized')return cardDown(p);
  if(t==='free')return cardFree(p);
  if(t==='midbonus'||t==='tetbonus'){const tet=t==='tetbonus',amt=bonus(p,tet?'tet':'mid',true);
    return openModal({tone:'payday',eyebrow:'Thưởng',title:tet?'Thưởng Tết – lương tháng 13':'Thưởng giữa năm',art:art(tet?'tet':'promo'),story:tet?`Công ty tất niên ở ${pick(['nhà hàng tiệc cưới','resort Vũng Tàu','hội trường công ty'])}. Phong bì thưởng Tết dày hơn bạn nghĩ.`:'Phòng nhân sự gửi email kết quả đánh giá giữa năm.',
      body:`<div class="facts">${fact('Tiền thưởng',amt?'+'+fmt(amt):'0đ',amt?'pos':'')}${fact('Bằng',trimNum(amt/Math.max(1,p.salary),1)+' tháng lương')}</div>`,lesson:'Tiền thưởng là cơ hội tốt để trả nợ xấu hoặc đầu tư, thay vì nâng cấp chi tiêu.',acts:[{label:'Tuyệt!',cls:'primary',fn:endTurn}],bot:endTurn});}
  if(t==='salary'){toast(`${p.name} dừng ở mốc Lương`);}
  endTurn();
}
function cardOpp(p){
  const go=big=>{if(p.net>0){p.net--;const a=big?drawBig():drawSmall(),b=big?drawBig():drawSmall();return chooseOf(p,[a,b]);}showDeal(p,big?drawBig():drawSmall());};
  const tr=tier(p);
  openModal({tone:'opp',eyebrow:`Cơ hội · Giai đoạn ${TIERS[tr].n}`,title:'Chọn loại thương vụ',art:art('opp'),body:`<p>Bạn có <b class="num">${fmt(p.cash)}</b> tiền mặt${p.dep?` và ${fmt(p.dep)} tiết kiệm`:''}, hạn mức vay tiêu dùng còn <b class="num">${fmt(Math.max(0,loanCap(p)-p.loan))}</b>.</p><p><b>Nhỏ:</b> cổ phiếu, trái phiếu, vàng, phòng trọ, ki-ốt, kinh doanh nhỏ (vốn vài chục triệu).<br><b>Lớn:</b> ${tr>=2?TIERS[tr].d+'.':`<span class="warn">Đang khóa.</span> Vốn đầu tư từ ${fmt(TIER_NW[2])} mới được giới thiệu chung cư, nhà đất, chuỗi cà phê, siêu thị mini, farm, góp vốn công ty.`}</p>${p.net>0?`<div class="note">Bạn có ${p.net} điểm quan hệ: lần này được xem 2 thương vụ và chọn cái tốt hơn.</div>`:''}`,
    hint:p.cash<300*TR?'Vốn còn ít, cơ hội nhỏ dễ mua hơn.':'Vốn đã khá, hãy xem cơ hội lớn.',advice:()=>tr<2?`Vốn đầu tư của bạn dưới ${fmt(TIER_NW[2])}: chọn cơ hội nhỏ. Ưu tiên kinh doanh nhỏ và phòng trọ có lợi suất cao; tránh vay tiêu dùng 18%/năm để đầu tư.`:p.cash>400*TR?'Bạn đủ vốn cho cơ hội lớn, nơi dòng tiền mỗi lần mua lớn hơn nhiều.':'Tiền mặt chưa đủ cho cơ hội lớn (thường cần vài trăm triệu vốn). Chọn cơ hội nhỏ.',acts:[{label:'Cơ hội nhỏ',cls:'green',fn:()=>go(false)},{label:tr>=2?'Cơ hội lớn':'Cơ hội lớn (khóa)',cls:'primary',disabled:tr<2,fn:()=>go(true)}],bot:()=>go(tr>=2&&p.cash>400*TR)});
}
function dealBrief(d){if(d.k==='prop'){const R=analyze(d.a,d.ltvs[d.ltvs.length-1]);return `${fmt(d.a.price)} · dòng tiền ${sgn(R.cf)}/th · lợi suất ${pct(R.coc)}`;}if(d.k==='stock')return `Giá ${fmtD(d.price)}/cp`;if(d.k==='bond')return `Lãi ${pct(d.b.c)}/năm`;if(d.k==='gold')return `${fmt(d.each)}/chỉ`;if(d.k==='scam')return `Cam kết ${pct(d.promise)}/tháng`;return '';}
function chooseOf(p,ds){const inl=ds.map(d=>()=>showDeal(p,d));
  openModal({tone:'opp',eyebrow:'Cơ hội · Bạn bè giới thiệu',title:'Chọn 1 trong 2 thương vụ',art:art('opp'),inl,body:`<div class="rows">${ds.map((d,i)=>`<div class="row"><div class="grow"><b>${esc(d.title)}</b><small>${dealBrief(d)}</small></div><button class="btn sm green" data-i="${i}">Xem</button></div>`).join('')}</div>`,bot:()=>showDeal(p,ds.slice().sort((a,b)=>bestCoc(b)-bestCoc(a))[0])});}
function holdersOf(pred){const r=[];G.players.forEach(q=>{if(!q.ft&&!q.out)q.assets.forEach(a=>{if(pred(a))r.push([q,a]);});});return r;}
function stepperHTML(btn,qty,unit,steps){return `<div class="stepper">${steps.filter(s=>s<0).map(s=>btn(String(s),()=>qty(Math.max(0,qty()+s)))).join('')}<span class="qty">${qty().toLocaleString('vi-VN')}${unit}</span>${steps.filter(s=>s>0).map(s=>btn('+'+s,()=>qty(qty()+s))).join('')}</div>`;}
function loanNote(p,amt){const L=needLoan(p,Math.max(0,amt-p.dep));if(!L)return amt>p.cash&&p.dep?`<div class="note">Sẽ rút ${fmt(Math.min(p.dep,amt-p.cash))} từ tiết kiệm.</div>`:'';const over=p.loan+L>loanCap(p);
  return `<div class="note">${over?`<b class="neg">Vượt hạn mức vay tiêu dùng (${fmt(loanCap(p))}).</b> Ngân hàng không cho vay thêm ${fmt(L)}.`:`Thiếu tiền: ${p.dep?'rút hết tiết kiệm và ':''}vay tiêu dùng ${fmt(L)}, lãi ${fmt(L*clr())}/tháng (${pct(clr()*12,0)}/năm).`}</div>`;}
const canAfford=(p,amt)=>p.loan+needLoan(p,Math.max(0,amt-p.dep))<=loanCap(p);

function showDeal(p,d){if(d.k==='proad')return proAdCard(p);
  if(d.k==='stock')return dealStock(p,d);
  if(d.k==='bond')return dealBond(p,d);
  if(d.k==='gold')return dealGold(p,d);
  if(d.k==='scam')return dealScam(p,d);
  if(d.k==='side')return dealSide(p,d);
  if(d.k==='crypto')return dealCrypto(p,d);
  if(d.k==='sdiv'||d.k==='delist'){const hs=holdersOf(a=>a.type==='stock'&&a.sym===d.sym);
    hs.forEach(([q,a])=>{if(d.k==='delist'){q.assets.splice(q.assets.indexOf(a),1);q.deals.push({name:'Cổ phiếu DBX hủy niêm yết',pl:-a.shares*a.cost});log(`DBX hủy niêm yết: mất ${a.shares} cp (vốn ${fmt(a.shares*a.cost)})`,q);}else{const add=Math.floor(a.shares*d.ratio);a.cost=a.cost*a.shares/(a.shares+add);a.shares+=add;log(`${d.sym} chia cổ tức cổ phiếu: +${add} cp`,q);}});
    return openModal({tone:'opp',eyebrow:'Sự kiện chứng khoán',title:d.title,art:art(d.art,{sym:d.sym}),body:`<p>${d.text}</p><p>${hs.length?'Đã tự động điều chỉnh cho: '+hs.map(([q])=>esc(q.name)).join(', ')+'.':'Không ai đang giữ cổ phiếu này.'}</p>`,lesson:LESSON.stock,acts:[{label:'Xong',cls:'primary',fn:endTurn}],bot:endTurn});}
  return dealProp(p,d);
}
function dealSide(p,d){
  const take=()=>{p.sides.push({name:d.name,inc:d.inc});if(!p.bot)quoteToast(QUOTES.ctx.sideJob);log(`Làm thêm: ${d.name} +${fmt(d.inc)}/tháng`,p);quizThen(p,[{t:`Thu nhập làm thêm ${fmt(d.inc)}/tháng`,ans:['income'],why:'Làm thêm là thu nhập CHỦ ĐỘNG: ngừng làm là mất. Nó giúp tích lũy vốn nhưng không tính là thu nhập thụ động để thoát vòng cối xay.'}],endTurn);};
  openModal({tone:'opp',eyebrow:'Làm thêm',title:d.title,art:art(d.art),story:d.text,body:`<div class="facts">${fact('Thu nhập thêm','+'+fmt(d.inc)+'/tháng','pos')}${fact('Loại thu nhập','Chủ động','warn','không tính vào thu nhập thụ động')}</div><p>Bạn đang có ${p.sides.length}/2 việc làm thêm. Tối đa 2 việc vì thời gian có hạn.</p>`,
    advice:()=>adviseDeal(p,d),lesson:'Làm thêm giúp có vốn ban đầu. Nhưng thời gian có hạn, muốn tự do phải biến vốn đó thành tài sản.',acts:[{label:'Nhận việc',cls:'primary',disabled:p.sides.length>=2||p.retired,fn:take},{label:'Bỏ qua',fn:endTurn}],bot:()=>p.sides.length<2&&tier(p)<3&&!p.retired?take():endTurn()});
}
function dealCrypto(p,d){
  let qty=.01;
  const buy=()=>{const total=Math.round(qty*d.price);pay(p,total,'Bitcoin');const h=p.assets.find(a=>a.type==='crypto');if(h){h.qty+=qty;h.cost+=total;}else p.assets.push({type:'crypto',qty,cost:total});log(`Mua ${trimNum(qty,2)} BTC ${fmt(total)}`,p);quizThen(p,[{t:`${trimNum(qty,2)} Bitcoin`,ans:['asset'],why:'Bitcoin là tài sản đầu cơ: không tạo dòng tiền, chỉ lời khi bán giá cao hơn.'}],endTurn);};
  const render=()=>{const inl=[],btn=(l,fn,cls='')=>{inl.push(()=>{fn();render();});return `<button class="btn sm ${cls}" data-i="${inl.length-1}">${l}</button>`;};const total=Math.round(qty*d.price),ok=canAfford(p,total);
    const rows=holdersOf(a=>a.type==='crypto').map(([q,a])=>{const v=a.qty*d.price,pl=v-a.cost;return `<div class="row"><span class="dot" style="background:${q.color}"></span><div class="grow">${esc(q.name)}: ${trimNum(a.qty,2)} BTC<small>Bán nhận ${fmt(v)} · <span class="${pl>=0?'pos':'neg'}">${pl>=0?'lãi':'lỗ'} ${fmt(Math.abs(pl))}</span></small></div>${q.bot?'':btn('Bán hết',()=>{q.assets.splice(q.assets.indexOf(a),1);gain(q,v);q.deals.push({name:'Bán Bitcoin',pl});log(`Bán ${trimNum(a.qty,2)} BTC nhận ${fmt(v)}`,q);renderHUD();},'green')}</div>`;}).join('');
    openModal({tone:'opp',eyebrow:'Cơ hội nhỏ · Tiền số',title:d.title,inl,art:art('chartup',{sym:'BTC'}),story:d.text,hint:'Chỉ nên bỏ vào tiền số số tiền bạn chấp nhận mất hết.',
      body:`<span class="lbl">Số Bitcoin</span>${stepperHTML(btn,v=>v===undefined?Math.round(qty*100):(qty=Math.max(1,v)/100),' × 0,01 BTC',[-10,-1,1,10])}<div class="calc">${line('Tổng tiền',fmt(total),'',1)}${afterLine(p,total)}${line('Dòng tiền','0đ')}</div>${loanNote(p,total)}${rows?`<span class="lbl">Người đang giữ Bitcoin có thể bán</span><div class="rows">${rows}</div>`:''}`,
      advice:()=>adviseDeal(p,d),acts:[{label:`Mua ${trimNum(qty,2)} BTC`,cls:'primary',disabled:!ok,fn:buy},{label:'Bỏ qua',fn:endTurn}],bot:()=>{if(p.botLvl==='risky'&&p.cash>200*TR){qty=.02;buy();}else endTurn();}});};
  render();
}
function dealScam(p,d){
  const inv=amt=>{p.st=p.st||{};p.st.scam=1;chickSay('scam',p);if(!p.bot)quoteToast(QUOTES.ctx.scamYes);pay(p,amt,d.name);p.assets.push({type:'scam',name:d.name,amount:amt,promise:d.promise,paid:0,turns:rnd(1,3)});log(`Góp ${fmt(amt)} vào ${d.name}`,p);endTurn();};
  const no=()=>{p.st=p.st||{};p.st.scamNo=1;if(!p.bot)quoteToast(QUOTES.ctx.scamNo);p.ach.noscam=p.ach.noscam||G.turn;log('Từ chối lời mời đầu tư đáng ngờ',p);endTurn();};
  openModal({tone:'opp',eyebrow:'Cơ hội nhỏ · ?',title:d.title,art:art('scam'),story:d.text,body:`<div class="facts">${fact('Lãi cam kết',pct(d.promise)+'/tháng','pos',pct(d.promise*12,0)+'/năm')}${fact('Giấy phép','Không có','neg')}</div>`,
    hint:'Lãi suất cam kết quá cao so với gửi tiết kiệm 5%/năm là dấu hiệu lừa đảo.',advice:()=>adviseDeal(p,d),acts:[{label:'Góp 20 tr',fn:()=>inv(20*TR)},{label:'Góp 50 tr',fn:()=>inv(50*TR)},{label:'Từ chối',cls:'primary',fn:no}],bot:()=>p.botLvl==='risky'&&Math.random()<.3?inv(20*TR):no()});
}
function dealStock(p,d){
  const S=STOCKS[d.sym];let qty=Math.max(100,Math.min(5000,Math.floor(p.cash*.25/d.price/100)*100));
  const sellNet=a=>a.shares*d.price*(1-STK_FEE-STK_TAX);
  const doSell=(q,a)=>{const v=sellNet(a),pl=v-a.shares*a.cost;q.assets.splice(q.assets.indexOf(a),1);gain(q,v);q.deals.push({name:`Bán ${a.shares} cp ${d.sym}`,pl});toast(`${q.name} bán ${a.shares} ${d.sym}: ${pl>=0?'lãi':'lỗ'} ${fmt(Math.abs(pl))}`,pl>=0?'pos':'neg');log(`Bán ${a.shares} cp ${d.sym} @ ${fmtD(d.price)}, nhận ${fmt(v)}`,q);renderHUD();};
  holdersOf(a=>a.type==='stock'&&a.sym===d.sym).forEach(([q,a])=>{if(botWantsSell(q,a,sellNet(a),a.shares*a.cost))doSell(q,a);});
  const buy=()=>{const gross=qty*d.price,total=gross*(1+STK_FEE);pay(p,total,`${qty} cp ${d.sym}`);const h=p.assets.find(a=>a.type==='stock'&&a.sym===d.sym);
    if(h){h.cost=(h.cost*h.shares+total)/(h.shares+qty);h.shares+=qty;}else p.assets.push({type:'stock',sym:d.sym,shares:qty,cost:total/qty});
    log(`Mua ${qty} cp ${d.sym} @ ${fmtD(d.price)} = ${fmt(total)}`,p);quizThen(p,quizItemsForAsset({type:'stock',sym:d.sym,shares:qty},{}),endTurn);};
  const good=S.div/d.price>=.05||d.price<=d.ref*.8;
  const botDo=()=>{const q=Math.floor(Math.min(p.cash*BOT_LVL[p.botLvl||'normal'].stk,200*TR)/d.price/100)*100;if(good&&q>0&&d.sym!=='DBX'){qty=q;buy();}else endTurn();};
  const render=()=>{const inl=[],btn=(l,fn,cls='')=>{inl.push(()=>{fn();render();});return `<button class="btn sm ${cls}" data-i="${inl.length-1}">${l}</button>`;};
    const gross=qty*d.price,fee=gross*STK_FEE,total=gross+fee,divM=qty*S.div*(1-DIV_TAX)/12;
    const pe=d.price/S.eps,dy=S.div/d.price;
    const sellers=holdersOf(a=>a.type==='stock'&&a.sym===d.sym).map(([q,a])=>{const v=sellNet(a),pl=v-a.shares*a.cost;
      return `<div class="row"><span class="dot" style="background:${q.color}"></span><div class="grow">${esc(q.name)}: ${a.shares.toLocaleString('vi-VN')} cp, giá vốn ${fmtD(a.cost)}<small>Bán nhận ${fmt(v)} (sau phí, thuế) · <span class="${pl>=0?'pos':'neg'}">${pl>=0?'lãi':'lỗ'} ${fmt(Math.abs(pl))}</span></small></div>${q.bot?'<small style="color:var(--muted)">máy giữ</small>':btn('Bán hết',()=>doSell(q,a),'green')}</div>`;}).join('');
    const ok=canAfford(p,total);
    openModal({tone:'opp',eyebrow:'Cơ hội nhỏ · Cổ phiếu',title:d.title,inl,art:art('stock',{sym:d.sym,up:d.price>=d.ref,tag:(d.price>=d.ref?'+':'')+pct(d.price/d.ref-1)}),story:d.story,lesson:LESSON.stock,
      hint:good?`Giá đang hấp dẫn (${dy>=.05?'cổ tức cao':'thấp hơn giá tham chiếu'}), có thể mua một phần.`:'Giá chưa hấp dẫn, có thể bỏ qua hoặc bán nếu đang giữ có lãi.',
      body:`<p>${S.n}. Giá tham chiếu năm nay khoảng ${fmtD(d.ref)} (thị trường ${CYC_LABEL[G.cyc.stock].toLowerCase()}). <small style="color:var(--muted)">Số liệu giả lập, không phải khuyến nghị đầu tư.</small></p>
      <div class="facts">${fact('P/E',S.eps>0?trimNum(pe,1)+' lần':'—',pe>25?'neg':pe<10?'pos':'','EPS '+fmtD(S.eps))}${fact('Cổ tức tiền mặt',fmtD(S.div)+'/năm',dy>.05?'pos':'','Tỷ suất '+pct(dy))}</div>
      <span class="lbl">Số cổ phiếu (lô 100)</span>${stepperHTML(btn,v=>v===undefined?qty:(qty=v),' cp',[-1000,-100,100,1000])}
      <div class="calc">${line('Giá trị khớp',fmt(gross))}${line('Phí môi giới 0,15%',fmt(fee))}${line('Tổng phải trả',fmt(total),'',1)}${afterLine(p,total)}${line('Cổ tức nhận/tháng (sau thuế 5%)',sgn(divM),'pos')}${line('Tỷ trọng so với tiền mặt',pct(total/Math.max(1,p.cash+p.dep),0),total>(p.cash+p.dep)*.5?'warn':'')}</div>${loanNote(p,total)}
      ${sellers?`<span class="lbl">Người đang giữ ${d.sym} có thể bán ở giá này</span><div class="rows">${sellers}</div>`:''}`,
      advice:()=>adviseDeal(p,d),acts:[{label:`Mua ${qty.toLocaleString('vi-VN')} cp`,cls:'primary',disabled:!qty||!ok,fn:buy},{label:'Bỏ qua',fn:endTurn}],bot:botDo});};
  render();
}
function dealBond(p,d){
  const b=d.b,face=10*TR;let units=Math.max(1,Math.min(10,Math.floor(p.cash/face)));
  const buy=()=>{const total=units*face;pay(p,total,'trái phiếu');const h=p.assets.find(a=>a.type==='bond'&&a.issuer===b.n&&!a.def);if(h)h.units+=units;else p.assets.push({type:'bond',issuer:b.n,units,face,coupon:b.c,def:false});log(`Mua ${units} lô TP ${b.n} (${fmt(total)})`,p);quizThen(p,quizItemsForAsset({type:'bond',issuer:b.n,units,face,coupon:b.c},{}),endTurn);};
  const render=()=>{const inl=[],btn=(l,fn)=>{inl.push(()=>{fn();render();});return `<button class="btn sm" data-i="${inl.length-1}">${l}</button>`;};
    const total=units*face,m=total*b.c*(1-BOND_TAX)/12,ok=canAfford(p,total);
    openModal({tone:'opp',eyebrow:'Cơ hội nhỏ · Trái phiếu',title:d.title,inl,art:art('bond',{issuer:b.n,rate:pct(b.c)}),story:d.story,hint:b.risk==='Cao'?'Lãi cao vì rủi ro cao, chỉ nên mua ít.':'Rủi ro vừa phải, hợp để giữ tiền nhàn rỗi.',body:`<p>Trái phiếu doanh nghiệp kỳ hạn 3 năm, trả lãi hằng tháng. Lãi càng cao thì rủi ro chậm trả càng lớn.</p>
      <div class="facts">${fact('Lãi suất',pct(b.c)+'/năm','pos')}${fact('Rủi ro',b.risk,b.risk==='Cao'?'neg':b.risk==='Thấp'?'pos':'warn')}</div>
      <span class="lbl">Số lô (10 tr/lô)</span>${stepperHTML(btn,v=>v===undefined?units:(units=Math.max(1,v)),' lô',[-5,-1,1,5])}
      <div class="calc">${line('Tổng đầu tư',fmt(total),'',1)}${afterLine(p,total)}${line('Lãi nhận/tháng (sau thuế 5%)',sgn(m),'pos')}${line('So với gửi tiết kiệm 5%/năm',sgn(m-total*DEP_RATE/12))}</div>${loanNote(p,total)}`,
      advice:()=>adviseDeal(p,d),acts:[{label:`Mua ${units} lô`,cls:'primary',disabled:!ok,fn:buy},{label:'Bỏ qua',fn:endTurn}],
      bot:()=>{const u=Math.min(20,Math.floor(p.cash*.25/face));if(b.risk!=='Cao'&&u>0){units=u;buy();}else endTurn();}});};
  render();
}
function dealGold(p,d){
  let qty=1;
  const buy=()=>{const total=qty*d.each;pay(p,total,'vàng');const g=p.assets.find(a=>a.type==='gold');if(g){g.qty+=qty;g.cost+=total;}else p.assets.push({type:'gold',qty,cost:total});log(`Mua ${qty} chỉ vàng ${fmt(total)}`,p);quizThen(p,quizItemsForAsset({type:'gold',qty},{}),endTurn);};
  const render=()=>{const inl=[],btn=(l,fn)=>{inl.push(()=>{fn();render();});return `<button class="btn sm" data-i="${inl.length-1}">${l}</button>`;};const total=qty*d.each,ok=canAfford(p,total);
    openModal({tone:'opp',eyebrow:'Cơ hội nhỏ · Vàng',title:d.title,inl,art:art('gold'),hint:'Vàng giữ giá chống lạm phát nhưng không tạo dòng tiền, không giúp thoát vòng cối xay.',body:`<p>${d.text}</p><span class="lbl">Số chỉ</span>${stepperHTML(btn,v=>v===undefined?qty:(qty=Math.max(1,v)),' chỉ',[-5,-1,1,5])}<div class="calc">${line('Tổng tiền',fmt(total),'',1)}${afterLine(p,total)}${line('Dòng tiền','0đ')}</div>${loanNote(p,total)}`,
      advice:()=>adviseDeal(p,d),acts:[{label:`Mua ${qty} chỉ`,cls:'primary',disabled:!ok,fn:buy},{label:'Bỏ qua',fn:endTurn}],bot:()=>{if(p.cash>500*TR&&d.each<150e5){qty=5;buy();}else endTurn();}});};
  render();
}
/* mua tài sản (có thể là phần góp vốn) */
function buyAsset(p,a,ltv,share=1,fee=0,from=null){
  const A=share<1?{...a,price:a.price*share,value:(a.value||a.price)*share,rent:(a.rent||0)*share,profit:(a.profit||0)*share,share}:a;
  const R=analyze(A,ltv);pay(p,R.equity+fee,A.name);p.st=p.st||{};p.st.buys=(p.st.buys||0)+1;if(Math.min(R.cf,R.cfAfter)<0)p.st.neg=(p.st.neg||0)+1;if(fee&&from){from.cash+=fee;log(`Nhận phí nhượng thương vụ ${fmt(fee)} từ ${p.name}`,from);}
  const as={...A,loan:R.loan,pay:R.pmtM,left:R.loan?A.term*12:0,equity:R.equity+fee};if(A.teaser&&R.loan){as.rate=A.teaser.rate;as.teaserLeft=A.teaser.months;}delete as.teaser;
  p.assets.push(as);log(`Mua ${A.name}${share<1?' (góp '+pct(share,0)+')':''} ${fmt(A.price)}: vốn ${fmt(R.equity)}, vay ${fmt(R.loan)}, dòng tiền ${sgn(R.cf)}`,p);toast(`${p.name}: thu nhập thụ động ${sgn(R.cf)}/tháng`,R.cf>=0?'pos':'neg');return R;}
function dealProp(p,d,opt={}){
  const a=d.a;let ltv=d.ltvs[d.ltvs.length-1];const fee=opt.fee||0;flashSetup(p,d,opt);
  const buy=()=>{flashDone(d);const c=G.cyc[a.kind==='land'?'land':'re'];if(a.type==='re'&&c==='boom')chickSay('boomBuy',p);else if(a.type==='re'&&c==='bust')chickSay('bustBuy',p);
    const go=A=>{const R=buyAsset(p,A||a,ltv,1,fee,opt.from);quizThen(p,quizItemsForAsset(A||a,R),endTurn);};fee?go(null):bidWar(p,d,ltv,go);};
  const partners=G.players.filter(q=>q!==p&&!q.ft&&!q.out&&!q.won);
  const share=()=>{const inl=[],rows=partners.map(q=>{const nf=Math.round(analyze(a,ltv).equity*.05/1e5)*1e5;
      inl.push(()=>transfer(q,nf));inl.push(()=>coinvest(q));
      return `<div class="row"><span class="dot" style="background:${q.color}"></span><div class="grow">${esc(q.name)}${q.bot?' (máy)':''}<small>Tiền mặt ${fmt(q.cash)}</small></div><button class="btn sm" data-i="${inl.length-2}">Nhường (phí ${fmt(nf)})</button><button class="btn sm green" data-i="${inl.length-1}">Góp 50/50</button></div>`;}).join('');
    openModal({tone:'opp',eyebrow:'Hợp tác',title:'Nhường hoặc rủ góp vốn',inl,art:art('opp'),body:`<p><b>Nhường:</b> người kia mua toàn bộ, trả bạn 5% vốn làm phí môi giới.<br><b>Góp 50/50:</b> mỗi người bỏ một nửa vốn, nhận một nửa dòng tiền và một nửa giá trị khi bán.</p><div class="rows">${rows}</div>`,acts:[{label:'Quay lại',fn:render}]});};
  const transfer=(q,nf)=>{if(q.bot){const x=botPick(q,d);if(x!=null&&q.cash>nf){buyAsset(q,a,x,1,nf,p);toast(`${q.name} nhận thương vụ, bạn được ${fmt(nf)}`,'pos');}else toast(`${q.name} từ chối thương vụ`,'neg');endTurn();return;}
    openModal({tone:'opp',eyebrow:`Đưa máy cho ${esc(q.name)}`,title:`${esc(q.name)} có nhận thương vụ không?`,body:`<p>${esc(p.name)} nhường lại <b>${esc(a.name)}</b>, phí ${fmt(nf)}.</p>`,acts:[{label:'Xem chi tiết và quyết định',cls:'primary',fn:()=>dealProp(q,d,{fee:nf,from:p,noShare:1})},{label:'Từ chối',fn:endTurn}]});};
  const coinvest=q=>{const half={...d,a:{...a,price:a.price/2,value:a.price/2,rent:(a.rent||0)/2,profit:(a.profit||0)/2}};

  const go=()=>{addS(p,{happy:-10},'Mất việc');p.skip=M.downSkip;p.benefitLeft=1;log(`Mất việc: nghỉ ${M.downSkip} lượt, trợ cấp thất nghiệp ${pct(M.benefit,0)} lương trong lượt đầu`,p);endTurn();};
  openModal({tone:'downsized',eyebrow:'Mất việc',title:'Công ty cắt giảm nhân sự',art:art('fired'),quote:pick([QUOTES.ctx.down,'Đen thôi, đỏ quên đi!','Cửa này đóng, cửa khác sẽ mở!']),story:`${pick(['Công ty mất đơn hàng xuất khẩu lớn.','Phòng bạn bị thay bằng phần mềm AI.','Công ty sáp nhập, cắt giảm 30% nhân sự.'])} Bạn ôm thùng đồ ra về trong buổi chiều mưa.`,lesson:LESSON.down,
    body:`<p>Bạn nghỉ <b>${M.downSkip} lượt</b> (${M.downSkip*mpt()} tháng) để tìm việc. Lượt đầu nhận trợ cấp thất nghiệp ${pct(M.benefit,0)} lương${M.downSkip>1?', lượt sau không có lương':''}. Chi phí vẫn phải trả đều; thu nhập thụ động và tiết kiệm sẽ đỡ cho bạn.</p><div class="facts">${fact('Chi phí mỗi tháng',fmt(calc(p).totalExp),'neg')}${fact('Quỹ khẩn cấp',trimNum((p.cash+p.dep)/Math.max(1,calc(p).totalExp),1)+' tháng')}</div>`,
    acts:[{label:'Bắt đầu tìm việc',cls:'primary',fn:go}],bot:go});
}

/* ================= Vòng Thịnh Vượng ================= */
/* ================= Vòng Thịnh Vượng: cuộc sống thật của người giàu ================= */
/* Tự do tài chính chưa phải là đích: chi tiêu phình to theo tài sản, người giàu là mục tiêu của kiện tụng, thuế,
   lừa đảo; kèo lớn phần đông mất trắng. Ai giữ lối sống vừa phải, có đội pháp chế, đa dạng hóa và
   thẩm định kỹ thì mới đi tiếp được. Hết tiền thì bán tháo, rồi có thể rơi lại Vòng Cối Xay. */
const LIFESTYLE={simple:{n:'Giản dị',r:.2,stat:{happy:-5,rel:-5},d:'Chi tiêu 20% ngày lĩnh lương. Ít người biết bạn giàu.'},
  comfort:{n:'Thoải mái',r:.35,stat:{happy:5},d:'Chi tiêu 35%: nhà đẹp, du lịch, trường tốt cho con.'},
  lavish:{n:'Xa hoa',r:.6,stat:{happy:12,rel:15},d:'Chi tiêu 60%: biệt thự, siêu xe, tiệc tùng. Quan hệ rộng, kèo mạo hiểm tốt hơn.'}};
const FT_INFL=.05,GUARD=.05,DD_FEE=.05;
const VOUT=[0,.5,2,4,10],VOUT_TABLE=[0,0,0,0,.5,.5,1,2,3,4,10];
function ftFix(p){p.jail=num(p.jail);p.bribes=num(p.bribes);const own=(p.ftAssets||[]).reduce((s,a)=>s+num(a.cf),0);if(!Number.isFinite(p.ftBase)||p.ftBase<=0&&p.ftCF>own)p.ftBase=p.ftCF-own;
  if(!p.ftExp)p.ftExp=Math.round(p.ftStart*.35/1e6)*1e6;p.ftLap=num(p.ftLap);p.ftVentures=p.ftVentures||[];p.ftAssets=p.ftAssets||[];}
function ftRecalc(p){p.ftCF=Math.max(0,Math.round(p.ftBase+p.ftAssets.reduce((s,a)=>s+a.cf,0)));}
const guardFee=p=>p.ftGuard?Math.round(p.ftStart*GUARD/1e6)*1e6:0;
const ftNet=p=>p.ftCF-p.ftExp-guardFee(p);
const dreamCost=p=>{const d=G.dreams[p.dream];return d.c+(p.ft?3*p.ftStart:0);};
function ventureOdds(p,dd){const w=dd?[38,22,25,10,5]:[50,20,18,8,4];if(S(p).know>=70){w[0]-=5;w[2]+=5;}if(S(p).rel>=70){w[0]-=4;w[3]+=4;}if(G.ftCredit>0){w[0]+=10;w[2]-=10;}return w.map(x=>Math.max(0,x));}
function ftPayday(p){ftFix(p);const fee=guardFee(p),net=ftNet(p);p.cash+=net;p.ftLap++;
  toast(`Ngày lĩnh lương: ${fmt(p.ftCF)} − chi tiêu ${fmt(p.ftExp)}${fee?` − pháp chế ${fmt(fee)}`:''} = ${sgn(net)}`,net>=0?'pos':'neg');
  log(`Ngày lĩnh lương ${fmt(p.ftCF)}, chi tiêu lối sống ${fmt(p.ftExp)}${fee?`, pháp chế ${fmt(fee)}`:''}: ${sgn(net)}`,p);
  p.ftVentures.forEach(v=>{if(v.lap<p.ftLap)v.due=true;});
  p.ftAssets.forEach(a=>{if(a.ramp>0){a.ramp--;if(!a.ramp){a.cf=a.cf0;toast(`${a.name} đủ thủ tục: dòng tiền +${fmt(a.cf)}`,'pos');}}});ftRecalc(p);
  if(G.ftCredit>0)G.ftCredit--;
  p.ftExp=Math.round(p.ftExp*(1+FT_INFL)/1e6)*1e6;
  addS(p,{happy:-6},'Áp lực điều hành');if(S(p).happy<30){const cut=Math.round(Math.max(0,net)*.1);p.cash-=cut;addS(p,{health:-8},'Kiệt sức');chickSay('burnout',p);toast(`${p.name} kiệt sức: mất ${fmt(cut)} và Sức khỏe −8. Hãy dành thời gian giải trí!`,'neg');log(`Kiệt sức: mất ${fmt(cut)}`,p);}
  if(p.cash<0)ftDistress(p);renderHUD();}
/* thiếu tiền: bán tháo doanh nghiệp 50% giá; vẫn thiếu thì mất tự do tài chính */
function ftDistress(p){
  p.ftAssets.slice().sort((a,b)=>a.cf/a.cost-b.cf/b.cost).forEach(a=>{if(p.cash>=0)return;const v=Math.round(a.cost*.5);p.ftAssets.splice(p.ftAssets.indexOf(a),1);p.cash+=v;
    p.deals.push({name:'Bán tháo '+a.name,pl:v-a.cost});toast(`Bán tháo ${a.name}: chỉ thu ${fmt(v)}`,'neg');log(`Thiếu tiền, bán tháo ${a.name} được ${fmt(v)} (50% vốn)`,p);});
  ftRecalc(p);if(p.cash>=0)return;
  p.ft=false;p.ftFell=(p.ftFell||0)+1;p.cash=0;p.ftAssets=[];p.ftVentures=[];p.pos=0;
  const rich=p.assets.slice().sort((a,b)=>assetCF(b)-assetCF(a));for(const a of rich){const c=calc(p);if(c.passive<=c.totalExp)break;p.assets.splice(p.assets.indexOf(a),1);}
  addS(p,{happy:-25,luck:-10},'Mất tự do tài chính');moment('fired','Trắng tay!',`${esc(p.name)} rơi lại Vòng Cối Xay`);chickSay('distress',p);
  toast(`${p.name} cạn tiền, ngân hàng phát mãi tài sản: rơi lại Vòng Cối Xay!`,'neg');log('Cạn tiền ở Vòng Thịnh Vượng: phát mãi tài sản, rơi lại Vòng Cối Xay',p);
  if(typeof hopTo==='function')hopTo(p,true).then(arrangeTokens);}
function ftChooseLifestyle(p,done){const pick=k=>{const L=LIFESTYLE[k];p.ftStyle=k;p.ftExp=Math.round(p.ftStart*L.r/1e6)*1e6;addS(p,L.stat,'Lối sống '+L.n);log(`Chọn lối sống ${L.n}: chi tiêu ${fmt(p.ftExp)} mỗi ngày lĩnh lương`,p);closeModal();done();};
  openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Lối sống',title:'Giàu rồi, sống thế nào?',art:art('villa'),
    body:`<p>Người giàu ngoài đời mất tự do tài chính phần nhiều vì chi tiêu phình to theo tài sản. Chi tiêu tăng thêm ${pct(FT_INFL,0)} mỗi ngày lĩnh lương.</p><div class="rows">${Object.entries(LIFESTYLE).map(([k,L])=>`<div class="row"><div class="grow"><b>${L.n}</b> · ${fmt(Math.round(p.ftStart*L.r/1e6)*1e6)}/ngày lĩnh lương<small>${L.d}</small></div></div>`).join('')}</div>`,
    lesson:'Những người giữ được tài sản qua nhiều thế hệ thường sống dưới mức thu nhập và tái đầu tư phần còn lại.',
    acts:Object.entries(LIFESTYLE).map(([k,L])=>({label:L.n,cls:k==='simple'?'primary':'',fn:()=>pick(k)})),bot:()=>pick('comfort')});}
function ftVenture(p,t){let dd=!!p.ftGuard;const render=()=>{const w=ventureOdds(p,dd),tot=w.reduce((a,b)=>a+b,0);
  const stakes=[TY,3*TY,10*TY],go=st=>{const fee=dd?Math.round(st*DD_FEE):0;p.cash-=st+fee;p.ftVentures.push({name:t.name,stake:st,dd,lap:p.ftLap});log(`Góp ${fmt(st)} vào ${t.name}${dd?` (thẩm định ${fmt(fee)})`:''}`,p);sfx('pay');endTurn();};
  openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Kèo mạo hiểm',title:esc(t.name),art:art(t.art),
    body:`<p>Tiền góp vào sẽ được chốt ở ngày lĩnh lương tới. Ngoài đời, đa số khoản đầu tư mạo hiểm mất trắng; lợi nhuận đến từ số ít kèo nhân nhiều lần.</p><div class="facts">${VOUT.map((m,i)=>fact(m?'×'+trimNum(m,1):'Mất trắng',pct(w[i]/tot,0),m>=2?'pos':m?'':'neg')).join('')}</div>
      <p>${dd?`Đã thẩm định kỹ (phí ${pct(DD_FEE,0)} số tiền góp): bớt kèo mất trắng.`:'Chưa thẩm định: dễ gặp kèo "đẹp trên giấy".'}${S(p).know>=70?' Hiểu biết đầu tư cao giúp lọc kèo tốt.':''}${G.ftCredit>0?' <span class="neg">Tín dụng đang bị siết: kèo dễ hỏng hơn.</span>':''}</p>`,
    acts:[...stakes.map(st=>({label:`Góp ${fmt(st)}`,cls:st===TY?'primary':'',disabled:p.cash<st*(1+(dd?DD_FEE:0)),fn:()=>go(st)})),{label:dd?'Bỏ thẩm định':`Thẩm định kỹ (+${pct(DD_FEE,0)})`,fn:()=>{dd=!dd;render();}},{label:'Bỏ qua',fn:endTurn}],
    bot:()=>{dd=true;p.cash>4*TY*(1+DD_FEE)?go(TY):endTurn();}});};render();}
function ftHit(p,kind){const g=!!p.ftGuard,know=S(p).know>=70;
  if(kind==='law'){const laws=[
    {t:'Luật thuế bất động sản mới',x:'Nhà nước đánh thuế người sở hữu nhiều bất động sản. Dòng tiền ngành Bất động sản của mọi người giảm.',f:()=>G.players.filter(q=>q.ft).forEach(q=>{q.ftAssets.filter(a=>a.sector==='bds').forEach(a=>a.cf=Math.round(a.cf*(q.ftGuard?.9:.75)));ftRecalc(q);})},
    {t:'Thuế lãi vốn trên tài sản lớn',x:`Bạn phải nộp ${g?'5%':'10%'} tiền mặt.`,f:()=>{p.cash-=Math.round(p.cash*(g?.05:.1));}},
    {t:'Ngân hàng siết tín dụng',x:'Trong 2 ngày lĩnh lương tới, kèo mạo hiểm dễ mất trắng hơn. Kèo đang chờ của bạn mất một nửa giá trị.',f:()=>{G.ftCredit=2;if(!g)p.ftVentures.forEach(v=>v.stake=Math.round(v.stake/2));}},
    {t:'Ưu đãi chuyển đổi số',x:'Doanh nghiệp Công nghệ và Giáo dục được giảm thuế: dòng tiền tăng 30%.',f:()=>G.players.filter(q=>q.ft).forEach(q=>{q.ftAssets.filter(a=>a.sector==='cn'||a.sector==='gd').forEach(a=>a.cf=Math.round(a.cf*1.3));ftRecalc(q);})},
    {t:'Siết quy định thực phẩm',x:'Ngành Ăn uống phải đầu tư lại bếp và giấy phép: dòng tiền giảm.',f:()=>G.players.filter(q=>q.ft).forEach(q=>{q.ftAssets.filter(a=>a.sector==='fnb').forEach(a=>a.cf=Math.round(a.cf*(q.ftGuard?.9:.7)));ftRecalc(q);})}];
    return pick(laws);}
  if(kind==='crash'){const sec=pick(Object.keys(SECTORS));return {t:`Khủng hoảng ngành ${SECTORS[sec]}`,x:`Ngành ${SECTORS[sec]} sụt giảm: dòng tiền doanh nghiệp ngành này của mọi người giảm 40%, danh mục gốc giảm 5%.`,sec,
    f:()=>G.players.filter(q=>q.ft).forEach(q=>{q.ftAssets.filter(a=>a.sector===sec).forEach(a=>a.cf=Math.round(a.cf*.6));if(q===p)q.ftBase=Math.round(q.ftBase*.95);ftRecalc(q);})};}
  if(kind==='fraud'){const big=p.ftAssets.slice().sort((a,b)=>b.cf-a.cf)[0];
    if(!big){const r=g?.1:.2;return {t:'Bị lừa góp vốn',x:`Một "cơ hội độc quyền" hóa ra là lừa đảo: mất ${pct(r,0)} tiền mặt.`,f:()=>{p.cash-=Math.round(p.cash*r);}};}
    const keep=g?.7:know?.5:0;return {t:'Giám đốc điều hành gian lận',x:`Người quản lý ${big.name} rút ruột công ty. ${g?'Đội pháp chế phát hiện sớm: chỉ mất 30% dòng tiền.':know?'Bạn đọc báo cáo kỹ nên phát hiện sớm: mất một nửa dòng tiền.':'Bạn mất trắng doanh nghiệp này.'}`,
      f:()=>{if(keep)big.cf=Math.round(big.cf*keep);else p.ftAssets.splice(p.ftAssets.indexOf(big),1);ftRecalc(p);}};}
  if(kind==='lawsuit'){const f=1/Math.max(1,p.lastRoll||2)*(g?.5:1);return {t:'Bị kiện',x:`Đối tác kiện vi phạm hợp đồng. Mất 1/x tiền mặt, x = ${p.lastRoll||2}.${g?' Luật sư giúp giảm một nửa.':''}`,f:()=>{p.cash-=Math.round(p.cash*f);}};}
  if(kind==='audit'){const f=g?.15:.5;return {t:'Kiểm toán thuế',x:g?'Có kế toán thuế chuyên nghiệp: chỉ truy thu 15% tiền mặt.':'Cơ quan thuế truy thu và phạt chậm nộp: mất một nửa tiền mặt.',f:()=>{p.cash-=Math.round(p.cash*f);}};}
  if(kind==='divorce'){const f=!p.spouse?0:S(p).happy>=75?.1:g?.3:.5;return {t:'Ly hôn',x:!p.spouse?'Bạn độc thân: không bị ảnh hưởng.':S(p).happy>=75?'Gia đình hạnh phúc nên hai người hòa giải: chỉ tốn 10% tiền mặt cho chuyến đi hâm nóng tình cảm.':g?'Có hợp đồng tiền hôn nhân: mất 30% tiền mặt.':'Chia tài sản sau ly hôn: mất một nửa tiền mặt.',f:()=>{p.cash-=Math.round(p.cash*f);if(f>=.3)addS(p,{happy:-15},'Ly hôn');}};}}
function ftHazard(p,kind){const H=ftHit(p,kind),before=p.cash,cf0=p.ftCF;
  const go=()=>{H.f();ftRecalc(p);sfx('pay');log(`${H.t}: tiền mặt ${sgn(p.cash-before)}${p.ftCF!==cf0?`, ngày lĩnh lương ${sgn(p.ftCF-cf0)}`:''}`,p);
    if(kind==='crash'){const deals=FT.filter((t,i)=>t.t==='biz'&&t.sector===H.sec&&!G.players.some(q=>q.ftAssets&&q.ftAssets.some(a=>a.idx===i)));const t=deals[0];
      if(t){const i=FT.indexOf(t),price=Math.round(t.cost*.5),cf=Math.round(t.cf*.6),buy=()=>{p.cash-=price;p.ftAssets.push({idx:i,name:t.name,sector:t.sector,cost:price,cf});ftRecalc(p);log(`Mua đáy ${t.name} giá ${fmt(price)} (50%)`,p);endTurn();};
        return openModal({tone:'ft',eyebrow:'Khủng hoảng · Cơ hội',title:`Mua đáy ${esc(t.name)}`,art:art('buyer'),body:`<p>Chủ doanh nghiệp cần tiền gấp, bán bằng một nửa giá. Dòng tiền đang giảm còn ${fmt(cf)} nhưng có thể hồi.</p><div class="facts">${fact('Giá',fmt(price))}${fact('Dòng tiền','+'+fmt(cf),'pos')}${fact('Lợi suất',pct(cf/price))}</div>`,
          lesson:'Người có sẵn tiền mặt khi khủng hoảng thường là người giàu lên nhanh nhất.',acts:[{label:`Mua ${fmt(price)}`,cls:'primary',disabled:p.cash<price,fn:buy},{label:'Bỏ qua',fn:endTurn}],bot:()=>p.cash>=price*2?buy():endTurn()});}}
    if(p.cash<0)ftDistress(p);endTurn();};
  openModal({tone:'doodad',eyebrow:'Vòng Thịnh Vượng · '+FT_INFO[kind].lines.join(' '),title:H.t,art:art(kind==='crash'?'chartdown':kind==='law'?'audit':kind==='fraud'?'scam':kind==='lawsuit'?'court':kind),
    body:`<p>${H.x}</p>${p.ftGuard?'':'<p class="lesson">Có đội pháp chế và thuế (trong báo cáo tài chính) thì những rủi ro này nhẹ hơn nhiều.</p>'}`,acts:[{label:'Chấp nhận',cls:'primary',fn:go}],bot:go});}

let chickT=0;
function chickSay(k,p,v){if(!G||!G.players||(p&&p.bot&&Math.random()<.7))return;const L=GA[k];if(!L)return;let el=$('#chick');if(el)el.remove();el=document.createElement('div');el.id='chick';

const FLASH_S=()=>((G&&G.mode)==='hard'?12:20);
function flashSetup(p,d,opt){if(d.flash!==undefined)return;d.flash=!p.bot&&!isOnline()&&!opt.fee&&!opt.noShare&&Math.random()<.22;
  if(!d.flash)return;d.a.price=round1(d.a.price*.85);d.a.value=d.a.price;d.flashEnd=Date.now()+FLASH_S()*1000;chickSay('flash',p);
  d.flashTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((d.flashEnd-Date.now())/1000)),el=document.getElementById('flashT');if(el)el.textContent=left;
    if(left<=0){clearInterval(d.flashTimer);if(!d.done){d.done=1;closeModal();toast('Hết giờ: cơ hội chớp nhoáng đã về tay người khác','neg');log(`Chần chừ, mất cơ hội ${d.a.name}`,p);endTurn();}}},250);}
const flashDone=d=>{d.done=1;if(d.flashTimer)clearInterval(d.flashTimer);};
/* 3. Tranh mua: người khác có tiền được trả giá cao hơn 10% một lần */
function bidWar(p,d,ltv,proceed){const a=d.a;if(isOnline()||d.bid||d.k!=='prop')return proceed(null);d.bid=1;
  const price2=round1(a.price*1.1),a2={...a,price:price2,value:price2},R2=analyze(a2,ltv);
  const rivals=G.players.filter(q=>q!==p&&!q.ft&&!q.out&&!q.won&&q.cash>=R2.equity*1.05&&a.price>=200*TR);
  let rival=null;for(const q of rivals){if(q.bot){if(botPick(q,{...d,a:a2})!=null&&Math.random()<.45){rival=q;break;}}
    else if(confirm(`${q.name} ơi! ${p.name} sắp mua “${a.name}” giá ${fmt(a.price)}.\nBạn có muốn trả cao hơn 10% (${fmt(price2)}) để giành không?`)){rival=q;break;}}
  if(!rival)return proceed(null);chickSay('outbid',p);log(`${rival.name} trả giá ${fmt(price2)} để tranh mua ${a.name}`,rival);
  const give=()=>{const x=rival.bot?(botPick(rival,{...d,a:a2})??ltv):ltv;closeModal();buyAsset(rival,a2,x);toast(`${rival.name} giành được ${a.name} với giá ${fmt(price2)}`,'neg');log(`Nhường ${a.name} cho ${rival.name}`,p);endTurn();};
  const match=()=>{closeModal();proceed(a2);};
  const ok2=canAfford(p,R2.equity);
  openModal({tone:'opp',eyebrow:'Tranh mua',title:`${esc(rival.name)} trả giá cao hơn!`,art:art('buyer'),
    body:`<p><b>${esc(rival.name)}</b> trả <b class="num">${fmt(price2)}</b> (+10%) để giành <b>${esc(a.name)}</b>. Bạn theo giá hay nhường?</p><div class="facts">${fact('Giá mới',fmt(price2))}${fact('Vốn tự bỏ',fmt(R2.equity))}${fact('Dòng tiền',sgn(R2.cf)+'/th',R2.cf>=0?'pos':'neg')}${fact('Lợi suất',pct(R2.coc),R2.coc>=.1?'pos':'warn')}</div>`,
    lesson:'Khi nhiều người cùng muốn một tài sản, giá sẽ lên. Đừng để cảm xúc “phải thắng” làm bạn trả quá đắt.',
    acts:[{label:`Theo giá ${fmt(price2)}`,cls:'primary',disabled:!ok2,fn:match},{label:'Nhường',fn:give}],bot:()=>ok2&&R2.coc>=.1?match():give()});}

function pickMissions(){return Object.keys(MISSIONS).sort(()=>Math.random()-.5).slice(0,3);}
function missionsCheck(){G.players.forEach(p=>{if(!p.missions)p.missions=pickMissions();p.mDone=p.mDone||[];
  p.missions.forEach(k=>{if(p.mDone.includes(k)||!MISSIONS[k].f(p))return;p.mDone.push(k);const it=collGive(p,1,'hoàn thành nhiệm vụ');if(!p.ft)p.pendingItems=[];
