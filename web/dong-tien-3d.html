/* Khu công nghiệp: đúng luật thì chậm, chạy giấy phép thì đỏ đen */
function ftKCN(p,t){const i=p.ftPos,own=p.ftAssets.some(a=>a.idx===i);
  const add=(price,ramp,bribe)=>{p.cash-=price;p.ftAssets.push({idx:i,name:t.name,sector:'bds',cost:t.cost,cf:Math.round(t.cf*(ramp?.3:1)),cf0:t.cf,ramp:ramp?2:0,bribe:!!bribe});ftRecalc(p);};
  const legal=()=>{add(t.cost,true,false);log(`Đầu tư ${t.name} ${fmt(t.cost)}, làm hồ sơ đúng luật (2 kỳ đầu chỉ 30% dòng tiền)`,p);endTurn();};
  const bribe=()=>{const env=Math.round(t.cost*.1);p.cash-=env;chickSay('bribe',p);
    ftGamble(p,{eyebrow:'Chạy giấy phép',title:'Phong bì đã trao…',art:'scam',bonus:0,noLegacy:true,body:`<p>Đã chi ${fmt(env)} "phí bôi trơn". Tổng 2–4: bị bắt quả tang. 5 trở lên: trót lọt, dự án chạy ngay, giá đất rẻ hơn 20%.</p>`,
      outcome:R=>{if(R.sum<=4){p.jail=3;p.bribes=(p.bribes||0)+1;p.jailCount=num(p.jailCount)+1;moment('police','BỊ BẮT!',`${esc(p.name)} vào tù 3 lượt`);chickSay('jail',p);const fine=Math.round(Math.max(0,p.cash)*.3);p.cash-=fine;addS(p,{rel:-25,happy:-25,luck:-15,legacy:-20},'Bị bắt vì hối lộ');log(`Bị bắt quả tang khi chạy giấy phép ${t.name}: mất phong bì ${fmt(env)}, phạt ${fmt(fine)}, ngồi tù 3 lượt`,p);
          return {title:'BỊ BẮT!',text:`Mất phong bì ${fmt(env)}, nộp phạt ${fmt(fine)} và ngồi tù 3 lượt. Dự án bị thu hồi.`,art:'police',lesson:'Hối lộ có thể trót lọt vài lần, nhưng chỉ một lần lộ là mất tất cả.'};}
        p.bribes=(p.bribes||0)+1;add(Math.round(t.cost*.8),false,true);log(`Chạy giấy phép ${t.name} trót lọt (phong bì ${fmt(env)}), giá đất giảm 20%`,p);
        return {title:'Trót lọt…',text:`Giấy phép có ngay, giá đất giảm 20%: chỉ trả ${fmt(Math.round(t.cost*.8))}, dòng tiền đủ ${fmt(t.cf)} từ kỳ này. Nhưng hồ sơ này sẽ còn đó khi thanh tra tới.`,good:true,art:'garment'};}});};
  openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Khu công nghiệp',title:esc(t.name),art:art('garment'),
    body:`<p>Các tập đoàn sản xuất đang tìm đất. Dòng tiền khủng, nhưng giấy phép đất đai là điểm nghẽn.</p><div class="facts">${fact('Vốn',fmt(t.cost))}${fact('Dòng tiền','+'+fmt(t.cf),'pos')}${fact('Lợi suất',pct(t.cf/t.cost))}</div>
      <p><b>Đúng luật:</b> trả đủ ${fmt(t.cost)}; 2 ngày lĩnh lương đầu chỉ được 30% dòng tiền vì chờ thủ tục.<br><b>Chạy giấy phép:</b> chi ${fmt(t.cost*.1)} phong bì rồi tung xúc xắc: 2–4 bị bắt (≈17%), ngồi tù 3 lượt; trót lọt thì đất rẻ 20%, chạy ngay. Lần sau gặp Thanh tra sẽ dễ bị lộ.</p>${own?'<p>Bạn đã sở hữu khu này.</p>':''}`,
    acts:[{label:`Đúng luật ${fmt(t.cost)}`,cls:'primary',disabled:own||p.cash<t.cost,fn:legal},{label:'Chạy giấy phép',disabled:own||p.cash<t.cost*.9,fn:bribe},{label:'Bỏ qua',fn:endTurn}],
    bot:()=>own||p.cash<t.cost*1.5?endTurn():(BOT_LVL[p.botLvl||'normal'].spec>.6&&p.cash>=t.cost*.9?bribe():legal())});}
/* Thanh tra: hồ sơ cũ quay lại */
function ftInspect(p){const n=p.bribes||0;
  if(!n){addS(p,{luck:10},'Hồ sơ sạch');return openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Thanh tra',title:'Hồ sơ sạch',art:art('police'),body:'<p>Đoàn thanh tra rà soát toàn bộ dự án của bạn: không có sai phạm. Uy tín tăng, May mắn +10.</p>',lesson:'Làm ăn sạch thì ngủ ngon.',acts:[{label:'Tiếp tục',cls:'primary',fn:endTurn}],bot:endTurn});}
  const lim=3+n*2;
  ftGamble(p,{eyebrow:'Vòng Thịnh Vượng · Thanh tra',title:'Đoàn thanh tra tới gõ cửa',art:'police',bonus:0,noLegacy:true,
    body:`<p>Bạn từng chạy giấy phép ${n} lần. Tổng xúc xắc ≤ ${lim}: bị lộ (≈${pct([0,0,1,3,6,10,15,21,26,30,33,35,36][Math.min(12,lim)]/36,0)}).</p>`,
    outcome:R=>{if(R.sum>lim)return {title:'Thoát… lần này',text:'Hồ sơ không bị phát hiện. Nhưng nó vẫn nằm đó.',good:true,art:'escape'};
      const lost=p.ftAssets.filter(a=>a.bribe);lost.forEach(a=>p.ftAssets.splice(p.ftAssets.indexOf(a),1));const fine=Math.round(Math.max(0,p.cash)*.5);p.cash-=fine;p.jail=p.ftGuard?2:4;p.bribes=0;p.jailCount=num(p.jailCount)+1;moment('police','BỊ KHỞI TỐ!',`${esc(p.name)} vào tù ${p.jail} lượt`);chickSay('jail',p);
      addS(p,{rel:-30,happy:-25,luck:-20,legacy:-30},'Bị khởi tố');log(`Thanh tra phát hiện hối lộ: tịch thu ${lost.length} dự án, phạt ${fmt(fine)}, ngồi tù ${p.jail} lượt`,p);
      return {title:'BỊ KHỞI TỐ!',text:`Tịch thu ${lost.length?lost.map(a=>esc(a.name)).join(', '):'các khoản liên quan'}, phạt ${fmt(fine)}, ngồi tù ${p.jail} lượt${p.ftGuard?' (luật sư giúp giảm án)':''}.`,art:'police',lesson:'Tài sản có được nhờ hối lộ luôn có thể bị lấy lại.'};}});}
/* Sân gôn: quan hệ là tài sản vô hình của người giàu */
function ftGolf(p){const fee=200*TR,club=2*TY;
  const play=()=>{p.cash-=fee;addS(p,{rel:10,happy:4},'Chơi gôn');
    ftGamble(p,{eyebrow:'Sân gôn',title:'Một vòng 18 lỗ với các chủ tập đoàn',art:'skyline',bonus:relBonus(p),body:'<p>Tổng 10 trở lên: được rủ vào kèo nội bộ (mua doanh nghiệp giá 70%). 7–9: quen thêm người, Quan hệ +5. Dưới 7: chỉ là một trận gôn.</p>',
      outcome:R=>{if(R.sum>=10){const free=FT.map((t,i)=>[t,i]).filter(([t,i])=>t.t==='biz'&&!G.players.some(q=>q.ftAssets&&q.ftAssets.some(a=>a.idx===i)));const pk=free.length?pick(free):null;
          if(pk&&p.cash>=pk[0].cost*.7){const [t,i]=pk,price=Math.round(t.cost*.7);p.cash-=price;p.ftAssets.push({idx:i,name:t.name,sector:t.sector,cost:price,cf:t.cf});log(`Kèo nội bộ trên sân gôn: mua ${t.name} giá ${fmt(price)} (70%)`,p);
            return {title:'Kèo nội bộ!',text:`Một chủ tập đoàn nhượng lại ${esc(t.name)} chỉ ${fmt(price)} (70% giá). Dòng tiền +${fmt(t.cf)}.`,good:true,art:'buyer'};}
          addS(p,{rel:8});return {title:'Được giới thiệu nhà đầu tư lớn',text:'Quan hệ +8. Lần IPO tới dễ thành công hơn.',good:true};}
        if(R.sum>=7){addS(p,{rel:5});return {title:'Quen thêm vài chủ doanh nghiệp',text:'Quan hệ +5.',good:true};}
        return {title:'Chỉ là một trận gôn',text:'Đánh hỏng vài lỗ, không ai bàn chuyện làm ăn.',good:false};}});};
  const join=()=>{p.cash-=club;p.golfClub=true;addS(p,{rel:15,happy:6},'Thẻ hội viên gôn');log(`Mua thẻ hội viên sân gôn ${fmt(club)}`,p);endTurn();};
  openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Sân gôn',title:'Câu lạc bộ gôn thượng lưu',art:art('skyline'),
    body:`<p>Nhiều thương vụ lớn được chốt trên sân gôn chứ không phải trong phòng họp.</p><div class="facts">${fact('Một trận',fmt(fee))}${fact('Thẻ hội viên',p.golfClub?'Đã có':fmt(club),'', 'Quan hệ +15, +1 xúc xắc IPO và gôn mãi mãi')}</div>`,
    acts:[{label:`Chơi một trận ${fmt(fee)}`,cls:'primary',disabled:p.cash<fee,fn:play},...(p.golfClub?[]:[{label:`Thẻ hội viên ${fmt(club)}`,disabled:p.cash<club,fn:join}]),{label:'Không đi',fn:endTurn}],
    bot:()=>p.cash>club*3&&!p.golfClub?join():p.cash>fee*10?play():endTurn()});}
function ftLanding(p){
  if(p.pendingItems&&p.pendingItems.length)return collReveal(p,()=>ftLanding(p));
  if(p.ftVentures&&p.ftVentures.some(v=>v.due))return ftReveal(p,()=>ftLanding(p));
  const t=FT[p.ftPos];
  if(t.t==='cf')return endTurn();
  if(t.t==='biz'){const own=p.ftAssets.some(a=>a.idx===p.ftPos);const go=()=>{ftFix(p);p.cash-=t.cost;p.ftAssets.push({idx:p.ftPos,name:t.name,sector:t.sector,cost:t.cost,cf:t.cf});ftRecalc(p);log(`Đầu tư ${t.name} ${fmt(t.cost)}, +${fmt(t.cf)}`,p);sfx('cash');endTurn();};
    return openModal({tone:'ft',eyebrow:'Vòng Thịnh Vượng · Đầu tư',title:t.name,art:art('skyline'),body:`<p>Doanh nghiệp quy mô lớn tìm nhà đầu tư. Mỗi ngày lĩnh lương bạn nhận thêm lợi nhuận.</p><div class="facts">${fact('Vốn đầu tư',fmt(t.cost))}${fact('Dòng tiền thêm','+'+fmt(t.cf),'pos')}${fact('Lợi suất',pct(t.cf/t.cost))}${fact('Tiến độ mục tiêu',pct(t.cf/ftGoal(),0))}${fact('Ngành',SECTORS[t.sector]||'')}</div>${own?'<p>Bạn đã sở hữu doanh nghiệp này.</p>':p.cash<t.cost?'<div class="note">Không đủ tiền mặt. Ở vòng này không có vay tiêu dùng.</div>':''}`,
      acts:[{label:`Đầu tư ${fmt(t.cost)}`,cls:'primary',disabled:own||p.cash<t.cost,fn:go},{label:'Bỏ qua',fn:endTurn}],bot:()=>!own&&p.cash>=t.cost?go():endTurn()});}
  if(t.t==='tech')return ftTech(p,t);
  if(t.t==='ipo')return ftIPO(p);
  if(t.t==='kcn')return ftKCN(p,t);
  if(t.t==='inspect')return ftInspect(p);
  if(t.t==='golf')return ftGolf(p);
  if(t.t==='fun')return ftFun(p);
  if(t.t==='legacy')return ftLegacy(p);
  if(['law','crash','fraud','lawsuit','audit','divorce'].includes(t.t))return ftHazard(p,t.t);
  if(t.t==='dream'){const d=G.dreams[t.slot],mine=t.slot===p.dream,dc=mine?dreamCost(p):d.c;const okL=S(p).legacy>=legacyNeed(),buy=()=>{p.cash-=dc;closeModal();renderHUD();win(p,`Đã mua giấc mơ “${d.n}”, Di sản ${S(p).legacy}.`);};
    return openModal({tone:'ft',eyebrow:'Giấc mơ',title:esc(d.n),art:art(DREAM_ART[d.a||0]),body:`<p>Giá ${fmt(dc)}${mine&&dc>d.c?` (giá gốc ${fmt(d.c)} + quỹ duy trì, thuế và vận hành bằng 3 ngày lĩnh lương khởi điểm)`:''}. ${mine?(p.cash>=dc?('Đây là giấc mơ của bạn và bạn đủ tiền!'+(okL?'':` Nhưng Di sản mới ${S(p).legacy}/${legacyNeed()}: người giàu chỉ được nhớ đến khi để lại công trình, hãy cống hiến thêm.`)):'Đây là giấc mơ của bạn, nhưng chưa đủ tiền.'):'Đây là giấc mơ của người khác.'}</p>`,
      acts:[...(mine?[{label:`Mua giấc mơ ${fmt(dc)}`,cls:'primary',disabled:p.cash<dc||!okL,fn:buy}]:[]),{label:mine?'Để sau':'Xong',fn:endTurn}],bot:()=>mine&&p.cash>=dc&&okL?buy():endTurn()});}
  if(t.t==='charity'){const big=Math.round(Math.max(0,p.cash)*.1/TY)*TY;const give=(amt,lg)=>{p.cash-=amt;addS(p,{luck:20,happy:8,legacy:lg},'Quyên góp '+fmt(amt));log(`Từ thiện ${fmt(amt)}: Di sản +${lg}`,p);endTurn();};
    if(big>TY)return openModal({tone:'charity',eyebrow:'Từ thiện',title:'Quỹ từ thiện cộng đồng',art:art('charity'),body:`<p>Người giàu được nhớ đến vì những gì họ cho đi. Quyên góp 1 tỷ: May mắn +20, Di sản +8. Quyên góp 10% tiền mặt (${fmt(big)}): May mắn +20, Di sản +20.</p>`,acts:[{label:`10% tiền mặt · ${fmt(big)}`,cls:'primary',fn:()=>give(big,20)},{label:'Quyên góp 1 tỷ',fn:()=>give(TY,8)},{label:'Không',fn:endTurn}],bot:()=>give(big,20)});
    const giveOne=()=>give(TY,8);
    return openModal({tone:'charity',eyebrow:'Từ thiện',title:'Quỹ từ thiện cộng đồng',art:art('charity'),body:'<p>Quyên góp 1 tỷ để xây trường cho trẻ em vùng cao: May mắn +20. Khi May mắn đạt 80, lần tung kế tiếp được nhân đôi điểm.</p>',
      acts:[{label:'Quyên góp 1 tỷ',cls:'primary',disabled:p.cash<TY,fn:giveOne},{label:'Không',fn:endTurn}],bot:()=>p.cash>3*TY?giveOne():endTurn()});}
  endTurn();
}

/* ================= setup ================= */
let draft=[],draftMode='easy',draftScen='normal',draftQuiz=true;
function profNet(pr){const p={salary:T(pr.sal),rent:T(pr.rent),living:T(pr.liv),childPer:T(pr.ch),kids:0,kidAges:[],loan:0,dep:0,parentCare:0,sides:[],schoolPrem:0,risk:0,assets:[],liabs:Object.values(pr.L).map(v=>({pay:T(v[1])}))};return calc(p).cashflow;}
function showSetup(resume){
  const s=$('#setup');s.hidden=false;
  if(!G||!G.dreams)G={dreams:[...DREAMS].sort(()=>Math.random()-.5).slice(0,4)};
  const dreams=G.dreams;
  if(!draft.length)setCount(2);
  const render=()=>{s.innerHTML=`<div class="setup-in"><span class="lbl" style="color:var(--gold);margin:0">Trò chơi tài chính · Việt Nam</span><div class="logo">Dòng Tiền<em> 3D</em></div>
    <div class="mascot">${CHICKEN_SVG(1.4)}<p><b>Gà Vàng</b> chào bạn! Người ta hay nói “gà què ăn quẩn cối xay”: cả đời chạy quanh lương và hóa đơn. Muốn thoát vòng cối xay, bạn phải biết đâu là tài sản, đâu là tiêu sản. Tôi sẽ cố vấn, nhưng chỉ vài lần thôi.</p></div>
    <p class="lede">Hai vòng chơi: <b>Người lao động</b>, nơi bạn đi làm, nhận lương 4 tháng mỗi lượt và mua tài sản tạo thu nhập thụ động; rồi <b>Vòng Thịnh Vượng</b>, nơi bạn đầu tư lớn để chạm tới giấc mơ.</p>
    ${resume?`<button class="btn primary" id="resumeBtn" style="width:100%;margin-bottom:16px">Tiếp tục ván đang chơi (${MODES[resume.mode].n}, năm ${START_YEAR+Math.floor((resume.month||0)/12)})</button>`:''}
    <span class="lbl">Chế độ chơi</span><div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode ${draftMode===k?'on':''}" data-mode="${k}"><b>${m.n}</b><span>${m.sub}</span><small>${k==='easy'?'Không lạm phát, thương vụ tốt hơn, có gợi ý nên mua hay không. Thắng khoảng 33–40 tuổi.':'Lạm phát, lừa đảo, con cái đi học, bố mẹ ốm, lãi suất ưu đãi, chu kỳ thị trường, nghỉ hưu ở 60. Chỉ người am hiểu đầu tư (và chút may mắn) mới sang vòng 2 trước 50 tuổi.'}</small></button>`).join('')}</div>
    <span class="lbl">Ghi sổ</span><div class="seg"><button class="${draftQuiz?'on':''}" data-quiz="1" style="font-family:var(--f-body);font-size:12px">Bật: tự phân loại tài sản, nợ, thu nhập, chi phí</button><button class="${draftQuiz?'':'on'}" data-quiz="0" style="font-family:var(--f-body);font-size:12px">Tắt</button></div>
    <span class="lbl">Kịch bản</span><div class="seg">${Object.entries(SCENARIOS).map(([k,sc])=>`<button class="${draftScen===k?'on':''}" data-scen="${k}" style="font-family:var(--f-body);font-size:12px">${sc.n}</button>`).join('')}</div><p class="lede" style="margin-top:-8px;font-size:12px">${SCENARIOS[draftScen].d}</p>
    <span class="lbl">Số người chơi</span><div class="seg">${[1,2,3,4,5,6].map(n=>`<button class="${draft.length===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
    ${draft.map((d,i)=>{const pr=PROFS[d.prof],net=profNet(pr);return `<div class="pcard"><button class="avatar" data-char="${i}" aria-label="Chọn con giáp và màu">${badgeHTML(d.zod,d.col,62)}<span>ĐỔI</span></button><div style="min-width:0">
      <input id="pname${i}" value="${esc(d.name)}" maxlength="16" aria-label="Tên người chơi ${i+1}">
      <div class="meta"><button class="pill ${d.bot?'botpill':''}" data-bot="${i}">${d.bot?'Máy tự chơi':'Người chơi'} ⇄</button>${d.bot?`<button class="pill botpill" data-lvl="${i}">${BOT_LVL[d.botLvl].n} ↻</button>`:''}<button class="pill pickpill" data-prof="${i}">Nghề: <b>${pr.n}</b> ▾</button><span class="pill">${draftScen==='grad'?22:pr.age} tuổi</span><span class="pill">Lương <b>${fmt(T(pr.sal))}</b></span><span class="pill">Dư/tháng <b>${sgn(net)}</b></span><button class="pill pickpill" data-dream="${i}">Ước mơ: <b>${esc(DREAMS[d.dreamId].n)}</b> ▾</button></div></div></div>`;}).join('')}
    <button class="btn primary" id="startBtn" style="width:100%;margin-top:10px">Bắt đầu ván mới</button>
    ${onlineReady()?'<button class="btn" id="onlineBtn" style="width:100%;margin-top:8px">Chơi trực tuyến · tìm bạn chơi</button>':''}
    <div class="howto"><b>Cách chơi nhanh.</b> Mỗi lượt là 4 tháng: bạn nhận lương, trả chi phí, rồi tung xúc xắc. Ô <b>Cơ hội</b> cho bạn mua tài sản; mỗi thương vụ có bảng tính dòng tiền và lợi suất. Ô <b>Thưởng giữa năm</b> và <b>Thưởng Tết</b> cho thêm tiền khi đi qua. Khi thu nhập thụ động lớn hơn tổng chi phí, bạn sang <b>Vòng Thịnh Vượng</b>. Bấm <b>?</b> để xem luật đầy đủ.</div></div>`;};
  render();
  s.onclick=e=>{const b=e.target.closest('button');if(!b)return;syncNames();
    if(b.dataset.n){setCount(+b.dataset.n);render();}
    else if(b.dataset.mode){draftMode=b.dataset.mode;render();}
    else if(b.dataset.quiz){draftQuiz=b.dataset.quiz==='1';render();}
    else if(b.dataset.scen){draftScen=b.dataset.scen;render();}
    else if(b.dataset.bot){const i=+b.dataset.bot,d=draft[i];d.bot=!d.bot;if(d.bot&&/^Người chơi \d+$/.test(d.name))d.name=BOT_NAMES[i];else if(!d.bot&&BOT_NAMES.includes(d.name))d.name=`Người chơi ${i+1}`;render();}
    else if(b.dataset.lvl){const d=draft[+b.dataset.lvl],ks=Object.keys(BOT_LVL);d.botLvl=ks[(ks.indexOf(d.botLvl)+1)%ks.length];render();}
    else if(b.dataset.prof){pickProf(+b.dataset.prof,render);}
    else if(b.dataset.dream){pickDream(+b.dataset.dream,render);}
    else if(b.dataset.char){const k=+b.dataset.char;avatarPicker(draft[k],v=>{Object.assign(draft[k],v);render();},k);}
    else if(b.id==='onlineBtn'){showOnline();}

      G.players=draft.map((d,i)=>newPlayer(i,d,PROFS[d.prof],d.name.trim()||`Người chơi ${i+1}`,draftScen));
      G.players.forEach(p=>log(`Bắt đầu ${Math.floor(p.age)} tuổi: ${p.prof}, lương ${fmt(p.salary)}, tiền mặt ${fmt(p.cash)}`,p));draft=[];s.hidden=true;ensureAudio();boardFromState();
      G.phase='busy';afterEvents(curP());}
  };
}

function showRules(){
  openViewer({tone:'payday',key:'rules',eyebrow:'Luật chơi',title:'Dòng Tiền 3D chơi thế nào?',body:`<div class="rules">
  <h3>Hai vòng chơi</h3><ul><li><b>Vòng 1 – Người lao động</b> (vòng trong): đi làm, nhận lương, trả chi phí, mua tài sản. Hoàn thành khi <b>thu nhập thụ động lớn hơn tổng chi phí</b> hằng tháng.</li><li><b>Vòng 2 – Vòng Thịnh Vượng</b> (vòng ngoài): thắng khi mua được giấc mơ hoặc tăng ngày lĩnh lương thêm ${fmt(ftGoal())}.</li></ul>
  <h3>Chế độ</h3><ul><li><b>Dễ</b>: để tập chơi. Không lạm phát, thương vụ tốt hơn, có dòng <i>Gợi ý</i> nên mua hay không, vay tiêu dùng 1%/tháng.</li><li><b>Khó</b>: như cuộc đời. Lạm phát 3,5%/năm, tăng lương không chắc chắn, chu kỳ sốt nóng – đóng băng, lãi suất thả nổi, ưu đãi lãi suất hết hạn, lừa đảo, ốm đau, con đi học và đại học, bố mẹ ốm, nghỉ hưu ở 60 tuổi (lương hưu 55%), dừng cuộc chơi ở 70 tuổi.</li></ul>
  <h3>Ba giai đoạn tài chính</h3><ul><li><b>Cơm áo gạo tiền</b> (vốn đầu tư dưới ${fmt(TIER_NW[2])}): làm thêm, kinh doanh nhỏ, phòng trọ, cổ phiếu, vàng, Bitcoin.</li><li><b>Tích lũy</b> (từ ${fmt(TIER_NW[2])}): mở khóa cơ hội lớn như chung cư, nhà đất, chuỗi cà phê, siêu thị mini, farm, góp vốn công ty. Cũng xuất hiện cám dỗ như mua ô tô, trường quốc tế, resort.</li><li><b>Nhà đầu tư</b> (từ ${fmt(TIER_NW[3])}): nhà phố, căn hộ dịch vụ, khách sạn mini, mua lại công ty.</li><li>Chọn phương án <b>rẻ</b> (trường công, du lịch bụi…) tích <b>điểm rủi ro</b>: sau này ốm đau dễ xảy ra hơn và tốn hơn. Chọn phương án <b>đắt</b> cho <b>điểm quan hệ</b>: được xem nhiều cơ hội hơn.</li><li><b>Làm thêm</b> là thu nhập chủ động, tối đa 2 việc, không tính vào thu nhập thụ động.</li></ul>
  <h3>Thời gian và lương</h3><ul><li>Mỗi lượt = <b>4 tháng</b>. Đầu lượt bạn tự động nhận <b>lương 4 tháng</b>, trả thuế, bảo hiểm và mọi chi phí; phiếu lương cho biết còn lại bao nhiêu.</li><li>Ô góc <b>LƯƠNG</b> là mốc nhận lương. Ô <b>Thưởng giữa năm</b> và <b>Thưởng Tết</b> cho thưởng khi đi qua hoặc dừng lại.</li><li>Mỗi năm: tăng lương, lạm phát, con lớn thêm một tuổi, bản tin kinh tế mới.</li></ul>
  <h3>Các ô</h3><ul><li><b>Cơ hội</b>: cơ hội nhỏ hoặc lớn. Có thể <b>nhường</b> cho người khác lấy phí 5%, hoặc <b>rủ góp vốn 50/50</b>.</li><li><b>Thị trường</b>: người mua trả giá theo giá thị trường hiện tại, lãi suất hoặc giá cổ phiếu thay đổi. Áp dụng cho mọi người ở vòng 1.</li><li><b>Tiêu xài</b>: chi tiêu bất ngờ, ốm đau, hoặc <b>thẻ lựa chọn</b> (đám cưới bạn, cho mượn tiền, học thạc sĩ, mua ô tô, bảo hiểm…).</li><li><b>Từ thiện</b>: góp 10% thu nhập, May mắn +15. Khi May mắn đạt 80, lần tung xúc xắc kế tiếp được <b>nhân đôi điểm</b> (dùng hết 30 điểm May mắn).</li><li><b>Em bé</b>: tối đa 3 con. Chi phí tăng nhưng được giảm trừ gia cảnh.</li><li><b>Mất việc</b>: nghỉ 1 lượt (Dễ) hoặc 2 lượt (Khó), chỉ nhận trợ cấp thất nghiệp 60% lương trong lượt đầu.</li></ul>
  <h3>Tiền và nợ</h3><ul><li><b>Vay mua tài sản</b>: chọn tỷ lệ vay; trả góp tính theo lãi suất và kỳ hạn thật, dư nợ giảm dần.</li><li><b>Vay tiêu dùng</b>: tự động khi thiếu tiền, bội số 10 tr, hạn mức 15 tháng lương.</li><li><b>Tiết kiệm ngân hàng</b>: lãi 5%/năm, tính là thu nhập thụ động, tự rút khi thiếu tiền.</li><li><b>Thuế cho thuê</b>: 10% doanh thu khi tổng tiền thuê vượt 100 tr/năm.</li><li><b>Quan hệ</b>: mừng cưới bạn, cho bạn mượn tiền… cho điểm quan hệ; lần tới gặp Cơ hội được xem 2 thương vụ.</li><li><b>Phá sản</b>: hết hạn mức vay thì tài sản bị thanh lý gấp còn 50%; vẫn thiếu thì mất 2 lượt, nợ cá nhân giảm một nửa.</li></ul>
  <h3>Ghi sổ – triết lý của trò chơi</h3><ul><li>Sau mỗi lần mua tài sản hay vay nợ, bạn tự <b>kéo thả</b> từng khoản vào đúng cột: <b>Tài sản</b> (đưa tiền vào túi), <b>Tiêu sản & Nợ</b> (lấy tiền ra khỏi túi), <b>Thu nhập</b>, <b>Chi phí</b>.</li><li>Xếp sai thì thẻ bị trả về kèm lời giải thích; phải xếp đúng hết mới được đi tiếp. Đúng ngay lần đầu được +1 điểm hiểu biết tài chính; mỗi 3 điểm được +1 quan hệ và +1 lượt hỏi Gà Vàng.</li><li>Khi đã tự do tài chính một lần, bạn được coi là đã nắm vững: phần ghi sổ sẽ tắt. Ở các ván sau, cùng tên người chơi chỉ thỉnh thoảng gặp lại để ôn.</li><li>Ở chế độ Khó, game không gắn nhãn "thương vụ tốt/xấu": bạn tự đọc dòng tiền, lợi suất và quyết định mua, giữ hay bán.</li></ul>
  <h3>Chỉ số cuộc sống – Gieo gì gặt nấy</h3><ul><li>6 chỉ số từ 0–100: <b>Hạnh phúc, May mắn, Sức khỏe, Con cái, Hiểu biết đầu tư, Quan hệ</b>.</li><li>Lựa chọn hôm nay đổi chỉ số, chỉ số đổi xác suất ngày mai: May mắn cao gặp thương vụ tốt và có thể thoát mất việc; Quan hệ cao được giới thiệu bất động sản tốt; Hiểu biết cao gặp cổ phiếu giá rẻ; Sức khỏe cao ít ốm; Con cái được chăm thì lớn lên báo hiếu.</li><li>Cưới vợ/chồng: có thêm lương nhưng sinh hoạt phí tăng 80%, Hạnh phúc +20, May mắn +10. Độc thân: tiết kiệm hơn nhưng kém vui, kém may.</li><li>Ô <b>Thời gian rảnh</b>: chọn chăm con, đọc tin tài chính, cà phê với bạn, làm thêm, tập thể dục hay nghỉ ngơi.</li></ul>
  <h3>Gà Vàng – cố vấn</h3><ul><li>Bấm <b>Hỏi Gà Vàng</b> trên thẻ để nghe phân tích nên mua, giữ hay bán; bấm biểu tượng gà ở thanh dưới để khám sức khỏe tài chính.</li><li>Số lượt hỏi có hạn: Dễ 10 lượt, Khó 3 lượt. Ghi sổ đúng 3 lần được thêm 1 lượt.</li><li>Cuối ván, Gà Vàng <b>tư vấn PRO</b>: điểm mạnh và điểm yếu trong cách đầu tư của bạn.</li></ul>
  <h3>Máy chơi</h3><ul><li>Ba tính cách: <b>Thận trọng</b> (không vay tiêu dùng, chỉ mua thương vụ lợi suất ≥15%), <b>Cân bằng</b>, <b>Liều lĩnh</b> (chấp nhận lợi suất thấp, thích đầu cơ đất).</li></ul>
  <p class="lesson">Giá, cổ tức và dự án trong game là số liệu giả lập để học, không phải khuyến nghị đầu tư.</p></div>`});
}

/* ================= Ghi sổ: người chơi tự phân loại tài sản, tiêu sản, thu nhập, chi phí ================= */
const COLS={asset:{n:'Tài sản',d:'Đưa tiền VÀO túi bạn',c:'#4fd18b'},liab:{n:'Tiêu sản & Nợ',d:'Lấy tiền RA khỏi túi bạn',c:'#ff6b6b'},income:{n:'Thu nhập',d:'Dòng tiền vào mỗi tháng',c:'#5aa9ff'},expense:{n:'Chi phí',d:'Dòng tiền ra mỗi tháng',c:'#e9b949'}};
function quizItemsForAsset(A,R){const L=[];
  if(A.type==='stock')return [{t:`${A.shares} cổ phiếu ${A.sym}`,ans:['asset'],why:'Cổ phiếu trả cổ tức là tài sản: nó đưa tiền vào túi bạn.'},{t:`Cổ tức ${fmt(A.shares*STOCKS[A.sym].div*(1-DIV_TAX)/12)}/tháng`,ans:['income'],why:'Cổ tức là thu nhập thụ động.'}];
  if(A.type==='bond')return [{t:`${A.units} lô trái phiếu ${A.issuer}`,ans:['asset'],why:'Trái phiếu trả lãi định kỳ là tài sản.'},{t:`Lãi trái phiếu ${fmt(A.units*A.face*A.coupon*(1-BOND_TAX)/12)}/tháng`,ans:['income'],why:'Lãi trái phiếu là thu nhập thụ động.'}];
  if(A.type==='gold')return [{t:`${A.qty} chỉ vàng`,ans:['asset'],why:'Vàng là tài sản (giữ giá trị), dù không tạo dòng tiền.'}];
  L.push({t:`${A.name} (${fmt(A.price)})`,ans:['asset'],why:A.kind==='land'?'Đất là tài sản, nhưng không tạo dòng tiền; chỉ lời khi bán được giá.':'Tài sản cho thuê hoặc kinh doanh có lãi đưa tiền vào túi bạn.'});
  if(R.loan)L.push({t:`Khoản vay ngân hàng ${fmt(R.loan)}`,ans:['liab'],why:'Khoản vay là nợ: bạn phải trả gốc và lãi.'});
  if(A.type==='re'&&A.rent)L.push({t:`Tiền thuê nhận được ${fmt(A.rent*(1-A.opex))}/tháng`,ans:['income'],why:'Tiền thuê là thu nhập thụ động.'});
  if(A.type==='biz'&&A.profit)L.push({t:`Lợi nhuận kinh doanh ${fmt(A.profit)}/tháng`,ans:['income'],why:'Lợi nhuận từ doanh nghiệp bạn sở hữu là thu nhập thụ động.'});
  if(R.pmtM)L.push({t:`Trả góp ngân hàng ${fmt(R.pmtM)}/tháng`,ans:['expense'],why:'Tiền trả góp hằng tháng là dòng tiền ra.'});
  return L;}
function quizItemsForLiab(name,down,bal,payM){const L=[{t:name,ans:['liab'],why:'Món đồ tiêu dùng mất giá theo thời gian và tốn tiền: đó là tiêu sản, không phải tài sản.'}];
  if(bal)L.push({t:`Khoản trả góp ${fmt(bal)}`,ans:['liab'],why:'Khoản trả góp là nợ.'});if(payM)L.push({t:`Trả góp ${fmt(payM)}/tháng`,ans:['expense'],why:'Mỗi tháng phải trả là dòng tiền ra.'});return L;}
function introItems(p){const L=[{t:`Lương ${fmt(p.salary)}/tháng`,ans:['income'],why:'Lương là thu nhập chủ động: ngừng làm là ngừng có.'},{t:`Sinh hoạt phí ${fmt(p.living)}/tháng`,ans:['expense'],why:'Ăn uống, điện nước, đi lại là chi phí.'}];
  if(p.rent)L.push({t:`Tiền thuê nhà ${fmt(p.rent)}/tháng`,ans:['expense'],why:'Tiền thuê nhà là chi phí hằng tháng.'});
  const h=p.liabs.find(l=>l.key==='home');if(h)L.push({t:'Căn nhà bạn đang ở (còn vay ngân hàng)',ans:['liab'],why:'Nhà để ở không đưa tiền vào túi bạn, mà còn lấy tiền ra mỗi tháng (trả góp, sửa chữa), nên nó là tiêu sản.'});
  const m=p.liabs.find(l=>l.key==='moto'||l.key==='car');if(m)L.push({t:m.key==='car'?'Chiếc ô tô đang trả góp':'Chiếc xe máy đang trả góp',ans:['liab'],why:'Xe để đi lại mất giá theo thời gian và tốn tiền: tiêu sản.'});
  const c=p.liabs.find(l=>l.key==='card');if(c)L.push({t:`Dư nợ thẻ tín dụng ${fmt(c.bal)}`,ans:['liab'],why:'Dư nợ thẻ tín dụng là nợ, lãi rất cao.'});
  L.push({t:`Tiền tiết kiệm gửi ngân hàng`,ans:['asset'],why:'Tiền gửi có lãi là tài sản.'});return L;}
/* người đã tự do tài chính (trong ván này hoặc ván trước) đã nắm khái niệm: bỏ hoặc giảm ghi sổ */
function mastered(p){try{return (JSON.parse(localStorage.getItem('dongtien3d.mastered')||'[]')).includes(p.name);}catch(e){return false;}}
function setMastered(p){try{const l=JSON.parse(localStorage.getItem('dongtien3d.mastered')||'[]');if(!l.includes(p.name)){l.push(p.name);localStorage.setItem('dongtien3d.mastered',JSON.stringify(l));}}catch(e){}}
function quizThen(p,items,cont){if(p.bot||!G.quiz||!items||!items.length||p.ft||p.freeAge)return cont();if(mastered(p)&&Math.random()>.2)return cont();ledgerQuiz(p,items,cont);}
function ledgerQuiz(p,items,cont,intro){
  /* phải xếp đúng hết mới được đi tiếp: khoản sai bị trả về hàng chờ kèm lời giải thích */
  const place=items.map(()=>null),locked=items.map(()=>false),wrong=new Set();let sel=null,tries=0,done=false;
  const render=()=>{const zones=Object.entries(COLS).map(([k,c])=>`<div class="lzone" data-zone="${k}" style="--zc:${c.c}"><b>${c.n}</b><small>${c.d}</small><div class="lz-in">${items.map((it,i)=>place[i]===k?chip(it,i):'').join('')}</div></div>`).join('');
    const pool=items.map((it,i)=>place[i]?'':chip(it,i)).join('');
    const left=items.filter((it,i)=>!locked[i]).length;
    const msg=done?`<div class="note" style="color:var(--text)"><b class="pos">Chính xác!</b> ${tries===1?'Đúng ngay lần đầu: +1 điểm hiểu biết tài chính.':`Bạn đã sửa đúng sau ${tries} lần kiểm tra.`}</div>`
      :tries?`<div class="note"><b class="neg">Còn ${left} khoản xếp sai.</b> Đọc gợi ý bên dưới rồi kéo lại vào đúng cột.<ul class="whys">${[...wrong].filter(i=>!locked[i]).map(i=>`<li class="neg">${esc(items[i].t)}: ${hintOf(items[i])}</li>`).join('')}</ul></div>`:'';
    openModal({tone:'payday',eyebrow:intro?'Bài học đầu tiên · Ghi sổ':'Ghi sổ tài chính',title:intro?`${esc(p.name)}, hãy phân loại tình hình tài chính của bạn`:'Bạn vừa có thêm khoản mục. Xếp vào đúng cột nào?',
      body:`<p class="lesson" style="margin-top:0">${intro?'Người giàu mua tài sản. Người nghèo và trung lưu mua tiêu sản mà tưởng là tài sản. ':''}Kéo từng thẻ vào đúng cột, hoặc chạm thẻ rồi chạm cột. Phải xếp đúng hết mới đi tiếp được.</p>
      ${msg}<div class="lpool">${pool||(done?'':'<small style="color:var(--muted)">Đã xếp hết. Bấm Kiểm tra.</small>')}</div><div class="lzones">${zones}</div>
      ${done?`<ul class="whys">${items.map(it=>`<li class="pos">${esc(it.t)} → <b>${COLS[it.ans[0]].n}</b>. ${it.why}</li>`).join('')}</ul>`:''}`,
      acts:done?[{label:'Tiếp tục',cls:'primary',fn:()=>{closeModal();cont();}}]:[{label:'Kiểm tra',cls:'primary',disabled:place.some(x=>!x),fn:check}]});
    wire();};
  const hintOf=it=>it.why;
  const check=()=>{tries++;let allOk=true;items.forEach((it,i)=>{if(locked[i])return;if(it.ans.includes(place[i]))locked[i]=true;else{allOk=false;wrong.add(i);place[i]=null;}});
    if(tries===1){p.quizN=(p.quizN||0)+1;if(allOk){p.fq=(p.fq||0)+1;if(p.fq%3===0){p.net++;p.hints=hintsLeft(p)+1;toast(`${p.name}: hiểu biết tài chính tốt, +1 quan hệ, +1 lượt hỏi Gà Vàng`,'pos');}if(p.fq>=10)p.ach.fq=p.ach.fq||G.turn;}}
    if(allOk){done=true;sfx('cash');log(`Ghi sổ: hoàn thành sau ${tries} lần kiểm tra`,p);}else sfx('pay');sel=null;render();};
  const chip=(it,i)=>`<button class="lchip ${sel===i?'sel':''} ${locked[i]?'ok':wrong.has(i)?'bad':''}" data-chip="${i}" ${locked[i]||done?'disabled':''}>${esc(it.t)}</button>`;
  const wire=()=>{const root=$('#modal .sheet');if(!root||done)return;
    root.querySelectorAll('.lzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.lchip'))return;if(sel!=null){place[sel]=z.dataset.zone;sel=null;render();}});
    root.querySelectorAll('.lchip:not([disabled])').forEach(c=>{const i=+c.dataset.chip;
      c.onpointerdown=e=>{e.preventDefault();const r=c.getBoundingClientRect(),ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';document.body.appendChild(ghost);
        let moved=false;const mv=ev=>{moved=moved||Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>6;ghost.style.left=(ev.clientX-r.width/2)+'px';ghost.style.top=(ev.clientY-20)+'px';
          root.querySelectorAll('.lzone').forEach(z=>z.classList.toggle('over',z===document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.lzone')));};
        const upf=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',upf);ghost.remove();
          if(moved){const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.lzone');if(z){place[i]=z.dataset.zone;sel=null;}render();}
          else{if(place[i]){place[i]=null;sel=i;}else sel=sel===i?null:i;render();}};
        mv(e);addEventListener('pointermove',mv);addEventListener('pointerup',upf);};});};
  render();
}

/* ================= Gà Vàng: cố vấn có giới hạn số lần hỏi ================= */
const HINTS={easy:10,hard:3};
const CHICKEN_SVG=(s=1)=>`<svg viewBox="0 0 64 64" width="${44*s}" height="${44*s}" aria-hidden="true"><defs><radialGradient id="gch" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#d99a1e"/></radialGradient></defs><ellipse cx="34" cy="40" rx="20" ry="16" fill="url(#gch)"/><circle cx="20" cy="22" r="11" fill="url(#gch)"/><path d="M14 12 q3 -8 6 -1 q3 -8 6 0 q3 -6 4 2" fill="#e8423f"/><path d="M9 22 l-7 3 l7 3z" fill="#ff9f43"/><circle cx="17" cy="20" r="2" fill="#1b2a44"/><path d="M30 38 q10 -10 18 2 q-8 8 -18 -2z" fill="#e0a52a"/><path d="M50 30 q10 -6 10 6 q-6 -2 -10 2z" fill="#e8423f"/><path d="M28 55 v6 M38 55 v6" stroke="#ff9f43" stroke-width="3" stroke-linecap="round"/><path d="M12 30 q-2 6 3 6" fill="#e8423f"/></svg>`;
let adviceTitle=null;
function hintsLeft(p){if(p.pro)return 99;if(p.hints==null)p.hints=HINTS[G.mode]||3;return p.hints;}
function useHint(p){if(p.pro){chickenHop();sfx('cash');return true;}if(hintsLeft(p)<=0)return false;p.hints--;p.st=p.st||{};p.st.hint=(p.st.hint||0)+1;chickenHop();sfx('cash');return true;}
function adviceBox(html){return `<div class="advice">${CHICKEN_SVG(1)}<div><b>Gà Vàng:</b> ${html}</div></div>`;}
/* lời khuyên cho từng loại thẻ */
function adviseDeal(p,d){
  const cyc=G.cyc||{land:'normal',re:'normal',stock:'normal'};
  if(d.k==='scam')return 'Đây là <b>lừa đảo</b>. Lãi cam kết 4–5%/tháng (50–60%/năm) không doanh nghiệp thật nào trả nổi. Tiền trả cho bạn lúc đầu chính là tiền của người vào sau. Từ chối.';
  if(d.k==='side')return p.sides.length>=2?'Bạn đã đủ 2 việc làm thêm.':tier(p)>=2?'Bạn đã có vốn khá. Thời gian của bạn nên dành để tìm cơ hội lớn hơn là làm thêm.':'Nên nhận. Ở giai đoạn này vốn là thứ bạn thiếu nhất. Nhưng nhớ: đây là thu nhập chủ động, phải dùng nó để mua tài sản.';
  if(d.k==='gold'||d.k==='crypto')return `${d.k==='gold'?'Vàng':'Bitcoin'} không tạo dòng tiền nên không giúp bạn thoát vòng cối xay. Chỉ nên mua bằng tiền nhàn rỗi, tối đa 5–10% tài sản, khi bạn đã có quỹ khẩn cấp và tài sản tạo dòng tiền.`;
  if(d.k==='bond')return d.b.risk==='Cao'?`Lãi ${pct(d.b.c)} cao vì doanh nghiệp rủi ro (bất động sản). Nếu mua, chỉ dùng phần nhỏ tiền nhàn rỗi. Trái phiếu rủi ro thấp lãi ${pct(BONDS[0].c)} vẫn hơn gửi tiết kiệm ${pct(DEP_RATE,0)}.`:`Rủi ro ${d.b.risk.toLowerCase()}, lãi ${pct(d.b.c)} cao hơn tiết kiệm ${pct(DEP_RATE,0)}. Hợp để giữ tiền nhàn rỗi trong lúc chờ cơ hội lớn. Đừng vay tiêu dùng 18%/năm để mua trái phiếu 10%/năm.`;
  if(d.k==='stock'){const S=STOCKS[d.sym],dy=S.div/d.price,pe=d.price/S.eps,h=p.assets.find(a=>a.type==='stock'&&a.sym===d.sym);let t='';
    if(h){const g=d.price*(1-STK_FEE-STK_TAX)/h.cost-1;t+=g>=.3?`Bạn đang lãi ${pct(g,0)} với ${d.sym}: <b>nên chốt lời</b> để có vốn mua tài sản tạo dòng tiền. `:g<-.2?`Bạn đang lỗ ${pct(-g,0)}. Nếu doanh nghiệp vẫn tốt (cổ tức đều), giữ chờ giá hồi; đừng bán hoảng loạn. `:'Lãi lỗ chưa đáng kể, có thể giữ. ';}
    if(d.sym==='DBX')return t+'DBX là mã đầu cơ, không lãi, không cổ tức. Tránh xa.';
    t+=dy>=.05?`Tỷ suất cổ tức ${pct(dy)}/năm, cao hơn tiết kiệm: <b>có thể mua</b> để nhận dòng tiền.`:d.price<=d.ref*.8?`Giá thấp hơn tham chiếu ${pct(1-d.price/d.ref,0)}${cyc.stock==='bust'?' trong lúc thị trường đóng băng':''}: có thể mua chờ bán khi giá hồi.`:pe>20?`P/E ${trimNum(pe,1)} khá đắt, cổ tức thấp. Không nên mua lúc này.`:'Giá hợp lý nhưng chưa hấp dẫn. Có thể bỏ qua.';
    return t+(p.loan?' Lưu ý: bạn đang nợ vay tiêu dùng 18%/năm, trả nợ trước hiệu quả hơn mua cổ phiếu.':'');}
  if(d.k==='prop'){const a=d.a;
    if(a.kind==='land')return `Đất không tạo dòng tiền, còn tốn lãi nếu vay. Thị trường đất đang <b>${CYC_LABEL[cyc.land].toLowerCase()}</b>. ${cyc.land==='bust'?'Đóng băng là lúc mua rẻ, nếu bạn có tiền nhàn rỗi và chờ được nhiều năm.':cyc.land==='boom'?'Đang sốt: mua lúc này dễ đu đỉnh.':'Chỉ mua nếu tiền nhàn rỗi, không vay.'}`;
    if(a.kind==='startup')return 'Startup có thể mất trắng hoặc nhân 10 lần. Chỉ bỏ số tiền bạn chấp nhận mất.';
    let best=null;for(const x of d.ltvs){const R=analyze(a,x),L=needLoan(p,Math.max(0,R.equity-p.dep));if(p.loan+L>loanCap(p))continue;const real=Math.min(R.cf,R.cfAfter)-L*clr(),coc=R.equity?real*12/R.equity:0;if(!best||real>best.real)best={x,real,coc,R,L};}
    if(!best)return 'Bạn không đủ khả năng tài chính cho thương vụ này. Bỏ qua và tích lũy thêm.';
    const teaser=a.teaser?` Lưu ý ưu đãi lãi suất: sau ${a.teaser.months} tháng, dòng tiền còn <b>${sgn(analyze(a,best.x).cfAfter)}</b>/tháng.`:'';
    if(best.real<=0)return `<b>Không nên mua.</b> Ở mọi mức vay, dòng tiền thực đều âm (tốt nhất ${sgn(best.real)}/tháng). Tài sản này sẽ lấy tiền ra khỏi túi bạn mỗi tháng.${teaser}`;
    const verdict=best.coc>=.15?'<b>Nên mua</b>':best.coc>=DEP_RATE?'Có thể mua':'<b>Không đáng</b>';
    return `${verdict}${best.x?` với vay ${pct(best.x,0)}`:' không vay'}: dòng tiền thực ${sgn(best.real)}/tháng, lợi suất ${pct(best.coc)}/năm trên vốn bỏ ra${best.L?` (đã trừ lãi vay tiêu dùng ${fmt(best.L*clr())}/tháng)`:''}. So sánh: gửi tiết kiệm chỉ ${pct(DEP_RATE,0)}/năm.${teaser}${a.type==='biz'&&mode().bizRisk?' Kinh doanh có năm lãi ít hơn dự kiến, nên đừng dồn hết vốn vào một chỗ.':''}`;}
  return 'Thẻ này không cần quyết định gì.';}
function adviseMarket(p,rows){if(!rows.length)return 'Bạn không có tài sản nào liên quan tới thẻ này.';
  return rows.map(({a,Q})=>{const cf=assetCF(a),yld=Q.net>0?cf*12/Q.net:0,g=Q.basis>0?Q.profit/Q.basis:0;
    const sell=Q.net>0&&(g>=.3&&yld<.1||cf<0&&g>=0);return `<br>• <b>${esc(assetLabel(a))}</b>: ${sell?'<span class="pos">nên bán</span>':'<span class="warn">nên giữ</span>'}. Lãi ${pct(g,0)}, dòng tiền đang cho ${pct(yld,1)}/năm trên số tiền nhận về${sell?'; bán rồi tìm tài sản tốt hơn.':cf>0&&yld>=.1?'; nó đang làm việc tốt cho bạn.':'.'}`;}).join('');}
function adviseChoice(p,c){const m={friendwed:'Mừng 2 tr: quan hệ tốt sẽ mang lại cơ hội đầu tư (được xem 2 thương vụ). Chi phí nhỏ, lợi ích lâu dài.',lend:p.cash>100*TR?'Cho mượn nếu khoản này dưới 10% tiền mặt của bạn và người mượn đáng tin. Quan hệ là tài sản vô hình.':'Tiền mặt của bạn còn mỏng, từ chối khéo là an toàn.',phone:'Thay màn hình 2 tr: đừng tạo thêm khoản trả góp mới cho tiêu sản.',study:`Học thạc sĩ có lời nếu số tiền tăng lương bù được học phí trong 2–3 năm. Tăng 20% lương = ${fmt(p.salary*.2)}/tháng, hoàn vốn khoảng ${trimNum(p.salary*6/(p.salary*.2)/12,1)} năm.`,car:'Vẫn đi xe máy. Ô tô vay 80% là tiêu sản lớn, kéo dòng tiền xuống âm.',car2:'Thuê xe khi cần. Mua xe lúc này sẽ cộng hơn 13 tr chi phí mỗi tháng, đẩy mốc tự do ra xa vài năm.',ins:'Nên mua, nhất là khi đã có con hoặc ngoài 35 tuổi. Một lần nằm viện có thể tốn bằng nhiều năm phí bảo hiểm.',school:tier(p)>=3?'Trường quốc tế hợp khi bạn đã là nhà đầu tư: quan hệ phụ huynh mở thêm cơ hội.':'Trường tư là cân bằng: con học tốt hơn, bạn có thêm quan hệ, chi phí vừa phải. Trường công rẻ nhưng tích rủi ro.',travel:'Tour 3 sao là vừa sức. Du lịch bụi rẻ nhưng tích rủi ro sức khỏe; resort 5 sao chỉ đáng khi bạn đã dư dả.'};return m[c.id]||'Chọn phương án giữ được dòng tiền dương và không tạo nợ mới.';}
function adviseGeneral(p){const c=calc(p),L=[];
  if(p.loan)L.push(`Trả nợ vay tiêu dùng ${fmt(p.loan)} trước tiên: lãi ${pct(clr()*12,0)}/năm cao hơn hầu hết mọi khoản đầu tư.`);
  const bad=p.liabs.filter(l=>l.key!=='home').sort((a,b)=>b.pay/b.bal-a.pay/a.bal)[0];if(bad&&p.cash>bad.bal+c.totalExp*3)L.push(`Trả hết <b>${esc(bad.label)}</b> (${fmt(bad.bal)}) để giảm ngay ${fmt(bad.pay)}/tháng chi phí. Mỗi đồng trả nợ này "sinh lời" ${pct(bad.pay*12/bad.bal,0)}/năm.`);
  const em=(p.cash+p.dep)/Math.max(1,c.totalExp);if(em<3)L.push(`Quỹ khẩn cấp chỉ đủ ${trimNum(em,1)} tháng. Mất việc hay ốm đau lúc này sẽ phải vay nóng. Hãy giữ ít nhất 3–6 tháng chi phí.`);
  else if(p.cash>c.totalExp*12&&!p.ft)L.push(`Bạn đang để ${fmt(p.cash)} tiền mặt nằm im. Gửi tiết kiệm phần chưa dùng (lãi ${pct(DEP_RATE,0)}/năm, rút được ngay) trong lúc chờ thương vụ tốt.`);
  if(mode().insurance&&!p.hins&&(p.kids||p.age>=35))L.push('Bạn chưa có bảo hiểm sức khỏe. Với gia đình có con hoặc ngoài 35 tuổi, đây là khoản nên có.');
  const gap=c.totalExp-c.passive;if(gap>0)L.push(`Còn thiếu ${fmt(gap)}/tháng thu nhập thụ động. Ở giai đoạn <b>${TIERS[tier(p)].n}</b>, hãy ưu tiên ${tier(p)<2?'kinh doanh nhỏ lợi suất cao và phòng trọ không vay, tích vốn đạt '+fmt(TIER_NW[2])+' để mở khóa cơ hội lớn':'thương vụ có lợi suất trên vốn từ 15%/năm và dòng tiền dương cả sau khi hết ưu đãi lãi suất'}.`);
  const neg=p.assets.filter(a=>assetCF(a)<0);if(neg.length)L.push(`${neg.map(a=>esc(assetLabel(a))).join(', ')} đang có dòng tiền âm. Cân nhắc bán khi gặp thẻ Thị trường có giá tốt.`);
  return L.length?L.map(x=>'• '+x).join('<br>'):'Tình hình tài chính của bạn đang rất ổn. Tiếp tục tìm thương vụ có dòng tiền dương.';}
function askChicken(){const p=curP();if(!p||isBotTurn())return;
  if(!useHint(p)){openViewer({tone:'payday',eyebrow:'Gà Vàng',title:'Hết lượt hỏi',body:`${adviceBox('Bạn đã dùng hết lượt hỏi. Ghi sổ đúng 3 lần sẽ được thêm 1 lượt. Ngoài đời, không phải lúc nào cũng có người khuyên.')}`});return;}
  openViewer({tone:'payday',eyebrow:p.pro?'Gà Vàng · chuyên gia PRO':`Gà Vàng · còn ${hintsLeft(p)} lượt hỏi`,title:'Khám sức khỏe tài chính',body:adviceBox(adviseGeneral(p))+(proOffer()?'<p class="lesson">Bản PRO: hỏi không giới hạn và phân tích chuyên sâu. Bấm vương miện 👑 ở góc trên.</p>':'')});save();renderHUD();}
/* ================= Bản PRO (mua trong ứng dụng iOS) ================= */
/* Ứng dụng iOS báo trạng thái qua window.proUpdate({available,owned,price}). Khi App Store chưa có sản phẩm,
   available=false và mọi lời mời mua đều ẩn. Trên web, thêm #pro vào địa chỉ để thử các tính năng PRO. */
const PROS={available:false,owned:false,price:'',plans:[]};
const onPlay=()=>!!(window.Android&&Android.pro);
const proBridge=()=>(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.pro)||(onPlay()?{postMessage:m=>Android.pro(JSON.stringify(m))}:null);
const isPro=()=>!!PROS.owned||/[#&]pro\b/.test(location.hash);
const proOffer=()=>PROS.available&&!isPro();
function proPerks(p){if(p.bot||p.proPerk)return;p.pro=true;p.proPerk=1;const s=S(p);s.luck=clamp(s.luck+10,0,100);s.happy=clamp(s.happy+10,0,100);}
window.proUpdate=st=>{const was=isPro();Object.assign(PROS,st||{});
  if(isPro()&&G&&G.players){G.players.forEach(proPerks);if(!was){if(typeof window.__proDone==='function')window.__proDone();moment('trophy','Chào mừng thành viên PRO! 👑','Gà Vàng giờ là chuyên gia tài chính riêng của bạn');save();}}
  if(st&&st.error)toast(st.error,'neg');const b=$('#proBtn');if(b)b.hidden=!(PROS.available||isPro());if(G&&G.players)renderHUD();};

/* chuyên gia: phân tích sâu hơn cho người chơi PRO */
function expertGeneral(p){const c=calc(p),L=[];if(p.ft)return '';
  const inc=Math.max(1,c.income),save=c.cashflow/inc;L.push(`Tỷ lệ tiết kiệm ${pct(save)} thu nhập: ${save>=.3?'rất tốt, người tự do sớm thường để dành trên 30%':save>=.15?'ổn, cố gắng lên 30%':'thấp, hãy cắt chi tiêu không cần thiết trước khi tìm cách kiếm thêm'}.`);
  const dti=(c.liabPay+c.loanPay+p.assets.reduce((s,a)=>s+(a.left>0?num(a.pay):0),0))/inc;L.push(`Nợ phải trả mỗi tháng bằng ${pct(dti)} thu nhập${dti>.4?': vượt ngưỡng an toàn 40%, ưu tiên trả bớt nợ lãi cao':''}.`);
  const val={};p.assets.forEach(a=>{const k=a.type==='re'?'Bất động sản':a.type==='biz'?'Kinh doanh':a.type==='stock'?'Cổ phiếu':a.type==='gold'?'Vàng':a.type==='crypto'?'Bitcoin':'Khác';val[k]=(val[k]||0)+Math.max(0,assetValue(a)-num(a.loan));});
  const tot=Object.values(val).reduce((a,b)=>a+b,0);if(tot>0){const parts=Object.entries(val).sort((a,b)=>b[1]-a[1]);L.push(`Phân bổ tài sản: ${parts.map(([k,v])=>`${k} ${pct(v/tot,0)}`).join(', ')}.${parts[0][1]/tot>.7?' Quá tập trung vào một loại, một biến cố có thể kéo bạn lùi nhiều năm.':''}`);}
  const gap=c.totalExp-c.passive;if(gap>0){const need=gap*12/.1;L.push(`Bước tiếp theo: cần thêm ${fmt(gap)}/tháng thu nhập thụ động, tương đương sở hữu khoảng ${fmt(need)} tài sản lợi suất 10%/năm. Với ${fmt(p.cash)} tiền mặt, hãy tìm thương vụ có lợi suất trên vốn từ 15% để rút ngắn thời gian.`);}
  return `<br><br><b>Chuyên gia PRO:</b><br>${L.map(x=>'• '+x).join('<br>')}`;}
function expertDeal(p,d){if(d.k!=='prop')return '';const a=d.a,R=analyze(a,d.ltvs[d.ltvs.length-1]),fair=Math.max(0,R.net*12/.1),diff=fair?a.price/fair-1:0;
  return `<br><br><b>Chuyên gia PRO:</b> với lợi suất mục tiêu 10%/năm, giá hợp lý khoảng <b>${fmt(fair)}</b>; giá chào ${fmt(a.price)} ${diff>0?`đắt hơn ${pct(diff,0)}`:`rẻ hơn ${pct(-diff,0)}`}. ${R.cfAfter<R.cf?`Sau ưu đãi, dòng tiền còn ${sgn(R.cfAfter)}/tháng: tính theo con số này.`:''} ${p.cash<R.equity*1.5?'Mua xong tiền mặt còn mỏng: giữ lại ít nhất 3 tháng chi phí.':''}`;}
{const base=adviseDeal;adviseDeal=function(p,d){const h=base(p,d);return p.pro?h+expertDeal(p,d):h;};}
{const base=adviseGeneral;adviseGeneral=function(p){const h=base(p);return p.pro?h+expertGeneral(p):h;};}
/* tư vấn sau ván (PRO) */
function proReview(p){const c=calc(p),st=p.st||{},good=[],bad=[];
  const buys=st.buys||0,neg=st.neg||0,quizOk=p.fq||0,quizN=p.quizN||0;
  if(p.ft)good.push(`Thoát vòng cối xay lúc ${Math.floor(p.freeAge)} tuổi${p.freeAge<45?', sớm hơn phần lớn người trung lưu':''}.`);
  if(buys&&neg===0)good.push('Không mua tài sản nào có dòng tiền âm: bạn hiểu tài sản là thứ đưa tiền vào túi.');
  if(neg)bad.push(`Mua ${neg} tài sản có dòng tiền âm. Hãy luôn tính dòng tiền sau trả góp, kể cả sau khi hết ưu đãi lãi suất.`);
  if(quizN){const r=quizOk/quizN;(r>=.8?good:bad).push(`Ghi sổ đúng ${quizOk}/${quizN} lần${r>=.8?': bạn phân biệt rõ tài sản, tiêu sản, thu nhập, chi phí.':'. Hãy nhớ: nhà ở, xe, đồ dùng là tiêu sản; khoản vay là nợ.'}`);}
  if((st.loanMax||0)>=p.salary*5)bad.push(`Từng vay tiêu dùng tới ${fmt(st.loanMax)} với lãi 18%/năm. Nợ tiêu dùng là cái cối xay giữ chân bạn.`);else if(st.loanMax===0||!st.loanMax)good.push('Gần như không dùng nợ tiêu dùng.');
  if(st.scam)bad.push('Đã sập bẫy lừa đảo lãi suất cao. Lãi cam kết 4–5%/tháng luôn là dấu hiệu đỏ.');if(st.scamNo)good.push('Tỉnh táo từ chối lời mời đầu tư lừa đảo.');
  const sold=p.deals.filter(x=>/^Bán/.test(x.name));if(sold.length){const pl=sold.reduce((a,x)=>a+x.pl,0);(pl>0?good:bad).push(`Bán ${sold.length} lần, tổng ${pl>=0?'lãi':'lỗ'} ${fmt(Math.abs(pl))}. ${pl>0?'Bạn biết chốt lời đúng lúc.':'Hãy kiên nhẫn chờ thẻ Thị trường giá tốt, đừng bán lúc đóng băng.'}`);}
  else if(p.assets.some(a=>assetValue(a)>(a.equity||a.cost||0)*1.5))bad.push('Có tài sản đã tăng giá mạnh nhưng chưa từng chốt lời để tái đầu tư.');
  if(st.cheap>=3)bad.push(`Chọn phương án rẻ ${st.cheap} lần: tiết kiệm trước mắt nhưng tích rủi ro sức khỏe và mất cơ hội quan hệ.`);if(st.prem>=2)good.push('Đầu tư vào quan hệ và chất lượng sống, mở rộng cơ hội.');
  if(mode().insurance)(p.hins?good:bad).push(p.hins?'Có bảo hiểm sức khỏe, chặn được rủi ro lớn.':'Không mua bảo hiểm sức khỏe: một lần ốm có thể xóa nhiều năm tích lũy.');
  const types=new Set(p.assets.map(a=>a.type+(a.kind||'')));(types.size>=3?good:bad).push(types.size>=3?`Đa dạng hóa tốt (${types.size} loại tài sản).`:'Danh mục ít đa dạng; một biến cố có thể ảnh hưởng mạnh.');
  if(st.hint)good.push(`Biết hỏi Gà Vàng ${st.hint} lần: biết tìm lời khuyên cũng là một kỹ năng.`);
  return `<div class="review"><b class="pos">Điểm mạnh</b><ul>${good.map(x=>`<li>${x}</li>`).join('')||'<li>Chưa rõ, hãy chơi thêm.</li>'}</ul><b class="neg">Cần cải thiện</b><ul>${bad.map(x=>`<li>${x}</li>`).join('')||'<li>Không có điểm yếu đáng kể. Xuất sắc!</li>'}</ul></div>`;}

async function fbInit(){
  if(FB)return FB;if(!onlineReady())throw new Error('Chưa cấu hình Firebase');
  for(const m of ['app','auth','firestore'])await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/firebase-${m}-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);FB={auth:firebase.auth(),db:firebase.firestore()};
  /* iOS loads the game from app://game; if Firebase refuses to persist there, stay signed in for the session instead of failing */
  try{await FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){try{await FB.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);}catch(e2){}}
  FB.auth.onAuthStateChanged(u=>{ME=u;if(u){ensureUser(u);startPresence();watchInvites();}if(viewing&&viewing.startsWith('ol:'))showOnline();});
  return FB;}

  if(!s.exists)await ref.set({...base,friends:[],char:'pig',created:now()});else await ref.update({lastSeen:now(),email:base.email});
  meDoc=(await ref.get()).data();}

async function joinRoom(id,quiet){const ref=FB.db.collection('rooms').doc(id);

async function leaveRoom(){if(!roomData)return;const ref=FB.db.collection('rooms').doc(roomData.id);

async function startOnlineGame(){const r=roomData;const ids=[...new Set(r.seats.map(s=>s.dreamId))];while(ids.length<4){const k=Math.floor(Math.random()*DREAMS.length);if(!ids.includes(k))ids.push(k);}

/* ---- giới hạn thời gian mỗi lượt khi chơi trực tuyến ---- */
const TURN_LIMIT=90,AFK_MAX=3;
let turnPill=null,warned=0;
function turnClock(){if(!isOnline()||!G.players||!curP()||!G.turnAt||curP().bot){if(turnPill)turnPill.hidden=true;return;}
  if(!turnPill){turnPill=document.createElement('div');turnPill.id='turnPill';turnPill.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 30px);z-index:60;padding:4px 12px;border-radius:999px;font:700 13px var(--f-mono,monospace);background:#0f1a2e;border:1px solid var(--line);color:#fff;pointer-events:none';document.body.appendChild(turnPill);}
  const left=Math.max(0,Math.ceil(TURN_LIMIT-(Date.now()-G.turnAt)/1000)),mine=iControl();turnPill.hidden=false;
  turnPill.textContent=`⏱ ${left}s · ${mine?'lượt của bạn':'lượt của '+curP().name}`;turnPill.style.borderColor=left<=15?'#ff4d4d':'var(--line)';turnPill.style.color=left<=15?'#ffb3b3':'#fff';
  if(mine&&left<=10&&warned!==G.turnAt){warned=G.turnAt;toast('Còn 10 giây! Hết giờ máy sẽ chơi thay lượt này','neg');sfx('pay');}
  if(ME&&G.online.host===ME.uid&&!G.takeover&&left<=0&&Date.now()-G.turnAt>(TURN_LIMIT+4)*1000)takeover();}

  toast(p.tmpBot?`${p.name} hết giờ, máy chơi thay lượt này`:`${p.name} hết giờ ${AFK_MAX} lần, máy chơi thay từ nay`,'neg');log(p.tmpBot?'Hết giờ, máy chơi thay lượt này':'Hết giờ nhiều lần, máy chơi thay',p);
  closeModal();closeViewer();if(G.phase==='roll'){save();roll(p.ft?(p.charity>0?3:2):(p.charity>0?2:1),true);}else endTurn();}

function parseRemote(s){if(typeof s!=='string'||s.length>1.5e6)return null;try{const o=JSON.parse(s);return validState(o)?sanitize(o):null;}catch(e){return null;}}

let AC=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null;
const SND_MODES=['all','sfx','off'],SND_ICON={all:'♫',sfx:'♪',off:'✕'},SND_LABEL={all:'Nhạc + hiệu ứng',sfx:'Chỉ hiệu ứng',off:'Tắt âm thanh'};

paintSnd();
$('#soundBtn').onclick=()=>{sndMode=SND_MODES[(SND_MODES.indexOf(sndMode)+1)%3];try{localStorage.setItem('dongtien3d.snd',sndMode)}catch(e){}paintSnd();toast(SND_LABEL[sndMode]);ensureAudio();applyMode();};
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=AC.createGain();master.gain.value=.9;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp).connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=0;{const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.Q.value=.3;const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.33;fb.gain.value=.28;wet.gain.value=.22;musicBus.connect(lp);lp.connect(master);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);}sfxBus=AC.createGain();sfxBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();applyMode();
}
function applyMode(){if(!AC)return;sfxBus.gain.value=sndMode==='off'?0:1;const mv=sndMode==='all'?MUSIC_VOL:0;musicBus.gain.setTargetAtTime(mv,AC.currentTime,.3);if(sndMode==='all')startMusic();}

const mf=m=>440*Math.pow(2,(m-69)/12);
function nt(f,t,dur,o={}){if(!AC)return;const osc=AC.createOscillator(),g=AC.createGain();osc.type=o.type||'triangle';osc.frequency.setValueAtTime(f,t);
  if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*.02;l.connect(lg).connect(osc.frequency);l.start(t);l.stop(t+dur+.2);}
  const v=o.vol||.1,a=o.a||.008;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=g;if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);node=fl;}
  osc.connect(g);node.connect(o.bus||sfxBus);osc.start(t);osc.stop(t+dur+.05);}
function nz(t,dur,o={}){if(!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type=o.ft||'highpass';f.frequency.value=o.f||6000;
  g.gain.setValueAtTime(o.vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(o.bus||sfxBus);s.start(t);s.stop(t+dur+.02);}
const kick=(t,bus)=>nt(150,t,.25,{type:'sine',slide:45,vol:.35,bus});
/* tune: [midi|null, beats] */
function tune(notes,bpm,o={}){if(!AC||sndMode==='off')return 0;const b=60/bpm;let t=AC.currentTime+.03;notes.forEach(([m,len,v])=>{if(m!=null)(Array.isArray(m)?m:[m]).forEach(x=>nt(mf(x),t,len*b*(o.leg||1.1),{type:o.type||'triangle',vol:(v||1)*(o.vol||.09),vib:o.vib,lp:o.lp}));t+=len*b;});const dur=t-AC.currentTime;duck(dur);return dur;}
function duck(dur){if(!AC||sndMode!=='all')return;const g=musicBus.gain,now=AC.currentTime;g.cancelScheduledValues(now);g.setTargetAtTime(MUSIC_VOL*.25,now,.05);g.setTargetAtTime(MUSIC_VOL,now+dur+.1,.4);}

function moodBase(){if(!G||!G.players||!curP())return 0;const p=curP();if(p.ft)return 1;const c=calc(p);let b=c.cashflow>0?.15:-.7;b+=Math.min(1,c.totalExp?c.passive/c.totalExp:0)*.7;if(p.loan)b-=.35;if(p.skip>0)b-=.8;return b;}

function schedMusic(){if(!AC||sndMode!=='all')return;
  while(mNext<AC.currentTime+.25){const S=STYLES[mStyle];bpmNow+=(S.bpm-bpmNow)*.04;const sp=60/bpmNow/4,s=mStep%64,bar=Math.floor(s/16),ch=S.prog[bar],t=mNext,B=musicBus;
    if(s%16===0)nt(mf(ch[0]-12),t,sp*(S.pad?14:7),{type:'sine',vol:.22,bus:B});
    if(s%16===8&&!S.pad)nt(mf(ch[0]-12+7),t,sp*6,{type:'sine',vol:.16,bus:B});
    if(s%16===0)ch.forEach(n=>nt(mf(n+12),t,sp*15.5,{type:'sine',vol:S.pad?.04:.028,a:.5,bus:B}));
    if(s%S.arp===S.arp/2)nt(mf(ch[(s/S.arp|0)%3]+24),t,sp*2.4,{type:'sine',vol:S.pad?.025:.032,a:.01,bus:B});
    if(s%2===0){const m=melody[(s>>1)%32];if(m){nt(mf(m),t,sp*(S.pad?4.5:3),{type:'sine',vol:.055,a:.03,bus:B,vib:S.pad?4:0});nt(mf(m+12),t,sp*1.5,{type:'sine',vol:.012,a:.01,bus:B});}}
    if(s%S.pulse===0)nt(mf(ch[0]-24),t,sp*3,{type:'sine',vol:.09,a:.02,bus:B});
    if(S.shaker&&s%4===2)nz(t,.06,{vol:.007,f:5000,ft:'bandpass',bus:B});

}

/* ================= 3D: materials & models ================= */
const std=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.4,metalness:.15,...o});
const goldM=std('#e9b949',{metalness:.9,roughness:.25}),darkM=std('#14182a',{roughness:.5}),whiteM=std('#f4f1ea',{roughness:.5}),glassM=std('#9fd2ff',{metalness:.6,roughness:.1});
function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;return m;}
function heartShape(s){const h=new THREE.Shape();h.moveTo(0,-s*.9);h.bezierCurveTo(-s*1.1,-s*.2,-s*1.1,s*.6,-s*.5,s*.75);h.bezierCurveTo(-s*.2,s*.85,0,s*.6,0,s*.45);h.bezierCurveTo(0,s*.6,s*.2,s*.85,s*.5,s*.75);h.bezierCurveTo(s*1.1,s*.6,s*1.1,-s*.2,0,-s*.9);return h;}
function starShape(R,r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,rr=i%2?r:R;i?s.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):s.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}s.closePath();return s;}
const ext=(shape,d)=>{const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.015,bevelSize:.015,bevelSegments:2,curveSegments:10});g.center();return g;};
function coinTex(){return tex(256,256,(x,w,h)=>{const g=x.createRadialGradient(w*.4,h*.4,10,w/2,h/2,w*.6);g.addColorStop(0,'#ffe9a8');g.addColorStop(1,'#c99328');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#a87818';x.lineWidth=14;x.beginPath();x.arc(w/2,h/2,w*.4,0,7);x.stroke();x.fillStyle='#8a5f10';x.font='800 150px "Be Vietnam Pro",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('₫',w/2,h/2+8);});}
let coinFaceM=null;
function bigCoin(r){const g=new THREE.CylinderGeometry(r,r,r*.22,40);return new THREE.Mesh(g,[goldM,coinFaceM,coinFaceM]);}

/* tile icons */
function makeIcon(type){
  const g=new THREE.Group();
  if(type==='opp'){g.add(mesh(ext(starShape(.2,.09),.07),std('#5ee39a',{emissive:'#1a6b40',emissiveIntensity:.4,metalness:.4})));}
  else if(type==='market'){const m=std('#6db4ff',{metalness:.4});[[.09,-.1],[.17,0],[.26,.1]].forEach(([h,x])=>g.add(mesh(new THREE.BoxGeometry(.075,h,.075),m,x,h/2-.13,0)));const ar=mesh(new THREE.ConeGeometry(.05,.09,4),goldM,.16,.12,0);ar.rotation.z=-.8;g.add(ar);}
  else if(type==='doodad'){const m=std('#ff6f85');g.add(mesh(new THREE.BoxGeometry(.24,.24,.12),m));const hd=mesh(new THREE.TorusGeometry(.065,.014,8,20,Math.PI),darkM,0,.12,0);g.add(hd);}
  else if(type==='payday'||type==='cf'){const c=bigCoin(.17);c.rotation.x=Math.PI/2;c.castShadow=true;g.add(c);if(type==='cf'){const c2=bigCoin(.17);c2.rotation.x=Math.PI/2;c2.position.set(.12,-.04,-.08);g.add(c2);}}
  else if(type==='charity'){const h=mesh(ext(heartShape(.17),.07),std('#c18bff',{emissive:'#4a2390',emissiveIntensity:.35}));h.rotation.z=Math.PI;g.add(h);}
  else if(type==='baby'){g.add(mesh(new THREE.CylinderGeometry(.08,.08,.2,20),whiteM));g.add(mesh(new THREE.CylinderGeometry(.085,.085,.05,20),std('#ff9cc6'),0,.12,0));g.add(mesh(new THREE.ConeGeometry(.04,.08,16),std('#ffd27a'),0,.18,0));}
  else if(type==='downsized'){const m=std('#a8b4c9',{metalness:.5});g.add(mesh(new THREE.BoxGeometry(.28,.19,.1),m));g.add(mesh(new THREE.TorusGeometry(.05,.014,8,16,Math.PI),darkM,0,.095,0));const r=std('#ff5a5a');const a=mesh(new THREE.BoxGeometry(.32,.045,.045),r,0,0,.07);a.rotation.z=.75;const b=a.clone();b.rotation.z=-.75;g.add(a,b);}
  else if(type==='biz'){g.add(mesh(new THREE.BoxGeometry(.13,.34,.13),std('#4f8fe6',{metalness:.5}),-.06,0,0));g.add(mesh(new THREE.BoxGeometry(.12,.22,.12),std('#7fb1ff',{metalness:.5}),.08,-.06,.02));g.add(mesh(new THREE.BoxGeometry(.13,.02,.13),goldM,-.06,.18,0));}
  else if(type==='dream'){const d=mesh(new THREE.OctahedronGeometry(.16),std('#c9a2ff',{metalness:.3,roughness:.1,flatShading:true,emissive:'#3d1f80',emissiveIntensity:.5}));d.scale.y=1.35;g.add(d);}
  else{const r=std('#ff4d5e',{emissive:'#6b0d18',emissiveIntensity:.5});g.add(mesh(new THREE.CylinderGeometry(.045,.03,.22,12),r,0,.05,0));g.add(mesh(new THREE.SphereGeometry(.04,12,8),r,0,-.12,0));}
  return g;
}

function box(w,h,d,c,x=0,y=0,z=0,o){return mesh(new THREE.BoxGeometry(w,h,d),icm(c,o),x,y,z);}
function sph(r,c,x=0,y=0,z=0,o){return mesh(new THREE.SphereGeometry(r,18,14),icm(c,o),x,y,z);}
function cone(r,h,c,x=0,y=0,z=0,seg=16,o){return mesh(new THREE.ConeGeometry(r,h,seg),icm(c,o),x,y,z);}
function tor(r,t,c,x=0,y=0,z=0,o){return mesh(new THREE.TorusGeometry(r,t,10,28),icm(c,o),x,y,z);}

  g.add(mesh(new THREE.BoxGeometry(.2,.16,.2),wall,0,.08,0));const r=mesh(new THREE.ConeGeometry(.17,.13,4),roof,0,.225,0);r.rotation.y=Math.PI/4;g.add(r);return g;}

function prism(w,h,d,m,x=0,y=0,z=0){const s=new THREE.Shape();s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(0,h);s.lineTo(-w/2,0);const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);return mesh(g,m,x,y,z);}
function classic(col,label,bg,fg){const g=new THREE.Group(),st=mat('#e9e4d8',{roughness:.6}),w=mat(col,{roughness:.5});
  g.add(bx(.62,.03,.34,st,0,.015,-.08));g.add(bx(.56,.03,.3,st,0,.045,-.09));g.add(bx(.5,.3,.22,w,0,.21,-.12));
  for(let i=0;i<5;i++)g.add(cy(.018,.02,.28,st,-.2+i*.1,.2,.02,12));
  g.add(bx(.56,.04,.28,st,0,.36,-.06));g.add(prism(.58,.1,.28,st,0,.38,-.06));
  g.add(sign(label,bg,fg,.44,.06,0,.36,.081));return g;}

  TPS.anim.push(t=>{const k=(t*.3+off)%1;c.position.set(ox+Math.sin(k*8+off*9)*.03,h-k*h,oz);c.rotation.set(k*9,k*7,0);});}}
function smoke(g,x,y,z){for(let i=0;i<5;i++){const s=glow('#b8c0cc',.12,.35);g.add(s);const off=i/5;TPS.anim.push(t=>{const k=(t*.25+off)%1;s.position.set(x+Math.sin(k*4)*.03,y+k*.4,z);const q=.08+k*.2;s.scale.set(q,q,q);s.material.opacity=.4*(1-k);});}}

/* ---------- Đường thẳng 3D: giao diện riêng, chỉ dùng nội dung trò chơi. Các ô của vòng đang chơi xếp thành con đường,
   chữ quay về người xem, cảnh đúng nội dung ô và cây, đèn, phố xá hai bên. Bàn cờ cũ được ẩn hẳn. ---------- */
const ROAD={g:new THREE.Group(),tiles:{in:[],ft:[]},sc:{in:[],ft:[]},ring:null,base:0,deco:false,hidden:[],saved:null};
scene.add(ROAD.g);ROAD.g.visible=false;
const roadN=ring=>ring==='ft'?FT.length:BOARD.length;
/* vị trí trên đường của ô k: người đang đi đứng ở 0, phía trước tối đa n-7 ô, phía sau 6 ô */
const roadR=(k,n)=>((k-ROAD.base+6)%n+n)%n-6;
function roadReset(){ROAD.g.clear();ROAD.tiles={in:[],ft:[]};ROAD.sc={in:[],ft:[]};ROAD.deco=false;ROAD.ring=null;TPS.anim.length=0;}
function roadTiles(ring){const L=ROAD.tiles[ring];if(L.length)return L;
  if(ring==='in')BOARD.forEach(t=>{const inf=TILE_INFO[t];const m=new THREE.Mesh(tileGeoR,[tileMat(tileTex(inf.col,inf.lines)),std(shade(inf.col,.55),{roughness:.6})]);L.push(m);});
  else FT.forEach(t=>{const inf=FT_INFO[t.t];let lines=inf.lines,sub=null;
    if(t.t==='biz'){lines=splitName(t.name);sub='+'+fmt(t.cf);}
    if(t.t==='dream'){const d=G&&G.dreams?G.dreams[t.slot]:DREAMS[t.slot];lines=splitName(d.n);sub=fmt(d.c)+'+';}
    if(t.t==='tech'){lines=splitName(t.name);sub='×0 → ×'+Math.max(...t.m);}
    if(t.t==='kcn'){lines=splitName(t.name);sub=fmt(t.cost);}
    L.push(new THREE.Mesh(tileGeoF,[tileMat(tileTex(inf.col,lines,sub,true)),std('#9a7020',{roughness:.35,metalness:.75})]));});
  /* quay 180°: camera đứng sau người chơi nhìn về +z, chữ trên ô đọc xuôi */
  L.forEach(m=>{m.rotation.y=Math.PI;m.receiveShadow=true;m.castShadow=true;ROAD.g.add(m);});return L;}
function roadScenes(ring){const L=ROAD.sc[ring];if(L.length)return L;let v=0;const hi=GFX==='high';
  (ring==='in'?BOARD:FT).forEach(t=>{const g=ring==='in'?tpsScene(t,v):fsScene(t);if(ring==='in'&&t==='opp')v++;
    if(g){g.scale.setScalar(1.1);g.traverse(o=>{if(o.isMesh){o.castShadow=hi;o.receiveShadow=hi;}});ROAD.g.add(g);}L.push(g);});return L;}
/* trang trí cố định dọc đường: cỏ, mặt đường, vỉa hè, đèn, cây, nhà, dãy phố xa và đồi */

  const asphalt=bx(1.36,.04,len,mat('#3a3e47',{roughness:.92}),0,-.01,zc);asphalt.castShadow=false;asphalt.receiveShadow=true;D.add(asphalt);
  const line=mat('#ffd56a',{emissive:'#ffb000',emissiveIntensity:.25});
  for(let z=z0;z<z0+len;z+=.6)[-1,1].forEach(s=>{const l=bx(.035,.004,.3,line,s*.62,.012,z);l.castShadow=false;D.add(l);});

  try{await Promise.race([Promise.all(['800 40px "Bricolage Grotesque"','800 20px "Be Vietnam Pro"','700 20px "JetBrains Mono"'].map(f=>document.fonts.load(f,'Đồng ₫'))),sleep(1800)]);}catch(e){}
  coinFaceM.map=coinTex();coinFaceM.needsUpdate=true;
  if(typeof applyGfx==='function')applyGfx();layoutCamera();requestAnimationFrame(frame);
  const restored=validState(data&&data.G)?sanitize(data.G):null;
  if(restored){G=restored;boardFromState();G.phase='busy';afterEvents(curP());return;}
  const saved=loadSaved();
  G={dreams:(saved&&saved.dreams)||[...DREAMS].sort(()=>Math.random()-.5).slice(0,4)};buildTiles();try{['dongtien3d.v2','dongtien3d.v3'].forEach(k=>localStorage.removeItem(k))}catch(e){}
  showSetup(saved&&saved.players?saved:null);
}
window.claude?.hot?.snapshot?.(()=>({G:G&&G.players?G:null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
